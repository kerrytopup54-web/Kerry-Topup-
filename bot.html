<!doctype html>
<html lang="ht">
<head>
<meta charset="utf-8">
<title>Kerry Topup Bot</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0f5c36">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/bot-manifest.json">
<link rel="icon" href="/bot-icon-192.png">
<link rel="apple-touch-icon" href="/bot-icon-192.png">
<style>
:root{--bg:#0b1410;--hd:#0f5c36;--hd2:#127a47;--bot:#14281e;--me:#127a47;--tx:#eafff3;--mut:#8fcfae;--line:#1f6b43;--acc:#6af0a3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
#app{display:flex;flex-direction:column;height:100dvh;max-width:560px;margin:0 auto;background:var(--bg)}
header{flex:none;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));background:linear-gradient(90deg,var(--hd),var(--hd2));font-weight:700}
.av{object-fit:cover;background:#fff;width:38px;height:38px;border-radius:50%;background:#fff;color:var(--hd);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px}
header small{display:block;color:#b8f0d0;font-weight:400;font-size:12px}
#chat{flex:1;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch}
.row{display:flex;flex-direction:column;margin-bottom:8px;max-width:100%}
.b{max-width:88%;padding:9px 12px;border-radius:14px;font-size:15px;line-height:1.4;white-space:pre-wrap;word-break:break-word}
.bot .b{background:var(--bot);border-bottom-left-radius:4px;align-self:flex-start}
.me .b{background:var(--me);border-bottom-right-radius:4px;align-self:flex-end}
.b a{color:#7fc4ff}.b code{background:#0e2230;color:#7fc4ff;padding:1px 5px;border-radius:5px;font-family:ui-monospace,monospace;font-size:14px}
.b img,.b video{max-width:100%;border-radius:10px;display:block}
.kb{display:flex;flex-direction:column;gap:6px;margin-top:6px;max-width:88%;align-self:flex-start;width:100%}
.kr{display:flex;gap:6px}
.kb button{flex:1;background:#10301f;border:1px solid var(--line);color:var(--acc);padding:11px 6px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.kb button:active{background:#17462e}
.kb button:disabled{opacity:.5}
.typing{color:var(--mut);font-size:13px;padding:4px 6px}
footer{flex:none;display:flex;align-items:center;gap:8px;padding:8px 10px;padding-bottom:calc(8px + env(safe-area-inset-bottom));background:#0f1b15}
#txt{flex:1;background:#16261d;border:1px solid #1d3a2a;border-radius:22px;padding:11px 15px;color:var(--tx);font-size:16px;outline:none;font-family:inherit}
.ic{width:42px;height:42px;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;font-size:19px;cursor:pointer;flex:none}
#att{background:#16261d;color:var(--mut)}#snd{background:#25d366;color:#04210f;font-weight:900}

:root{--bg:#f4faf6;--bot:#ffffff;--me:#d3f5df;--tx:#14231b;--mut:#4d7a62;--line:#9fd6b5;--acc:#0f7a45}
#chat{background:#f4faf6 url(bot-bg.jpg) center top/100% auto repeat-y}
.bot .b{box-shadow:0 1px 2px rgba(0,0,0,.12)}.me .b{box-shadow:0 1px 2px rgba(0,0,0,.12)}
.b a{color:#0b6cbf}.b code{background:#e6f1ec;color:#0b5a8f}
.kb button{background:#ffffff;color:#0f7a45;border:1px solid #9fd6b5;box-shadow:0 1px 2px rgba(0,0,0,.1)}.kb button:active{background:#e3f6ea}
footer{background:#eef5f0}#txt{background:#fff;color:#14231b;border:1px solid #cfe6d8}#att{background:#fff;color:#4d7a62}
.pw{flex:none;text-align:center;font-size:11px;color:#4d7a62;background:#eef5f0;padding:0 0 calc(6px + env(safe-area-inset-bottom));letter-spacing:.4px}.pw b{color:#0f5c36}
footer{padding-bottom:4px}
header{color:#fff}</style>
</head>
<body>
<div id="app">
  <header><img class="av" src="site-logo.png" alt=""><div>Kerry Topup<small id="st">●</small></div></header>
  <div id="chat"></div>
  <footer>
    <button class="ic" id="att" aria-label="photo">📎</button>
    <input id="txt" autocomplete="off" enterkeyhint="send">
    <button class="ic" id="snd" aria-label="send">➤</button>
    <input type="file" id="file" accept="image/*" hidden>
  </footer>
  <div class="pw">Powered by <b>KC GLOBAL STUDIO</b></div>
</div>
<script>
(function(){
var API='https://nzbnlecbtvbnulkknqbi.supabase.co/functions/v1/telegram-bot';
var I18N={
 ht:{ph:'Ekri yon mesaj...',on:'● an liy',off:'Pa gen entènèt. Eseye ankò.',err:'⚠️ Erè. Eseye ankò.'},
 fr:{ph:'Écrivez un message...',on:'● en ligne',off:'Pas de connexion. Réessayez.',err:'⚠️ Erreur. Réessayez.'},
 en:{ph:'Write a message...',on:'● online',off:'No connection. Try again.',err:'⚠️ Error. Try again.'},
 es:{ph:'Escribe un mensaje...',on:'● en línea',off:'Sin conexión. Inténtalo de nuevo.',err:'⚠️ Error. Inténtalo de nuevo.'}
};
var L=((navigator.language||'ht').slice(0,2).toLowerCase());var T=I18N[L]||I18N.ht;
document.documentElement.lang=I18N[L]?L:'ht';
document.getElementById('txt').placeholder=T.ph;document.getElementById('st').textContent=T.on;
var chat=document.getElementById('chat'),txt=document.getElementById('txt'),busy=false;
function getCid(){var k='kt_web_cid',v=null;try{v=localStorage.getItem(k)}catch(e){}
 if(!v||!/^7\d{15}$/.test(v)){v=String(7000000000000000+Math.floor(Math.random()*800000000000000));try{localStorage.setItem(k,v)}catch(e){}}
 return Number(v);}
var CID=getCid();
var ALLOW={B:1,STRONG:1,I:1,EM:1,U:1,S:1,CODE:1,PRE:1,A:1};
function clean(html){
 var doc=new DOMParser().parseFromString('<div>'+html+'</div>','text/html'),root=doc.body.firstChild;
 (function walk(n){Array.prototype.slice.call(n.childNodes).forEach(function(c){
  if(c.nodeType===1){
   if(!ALLOW[c.tagName]){c.replaceWith(doc.createTextNode(c.textContent));return;}
   Array.prototype.slice.call(c.attributes).forEach(function(a){
    if(!(c.tagName==='A'&&a.name==='href'&&/^https?:\/\//i.test(a.value)))c.removeAttribute(a.name);});
   if(c.tagName==='A'){c.setAttribute('target','_blank');c.setAttribute('rel','noopener noreferrer');}
   walk(c);
  }});})(root);
 (function link(n){Array.prototype.slice.call(n.childNodes).forEach(function(c){
  if(c.nodeType===1){if(c.tagName!=='A')link(c);}
  else if(c.nodeType===3&&/https?:\/\//.test(c.nodeValue)){
   var f=doc.createDocumentFragment(),last=0,t=c.nodeValue,re=/https?:\/\/[^\s<]+[^\s<.,;:!?)]/g,m;
   while((m=re.exec(t))){f.appendChild(doc.createTextNode(t.slice(last,m.index)));
    var a=doc.createElement('a');a.href=m[0];a.textContent=m[0];a.target='_blank';a.rel='noopener noreferrer';f.appendChild(a);last=m.index+m[0].length;}
   f.appendChild(doc.createTextNode(t.slice(last)));c.replaceWith(f);}
 });})(root);
 return root.innerHTML;
}
function scroll(){chat.scrollTop=chat.scrollHeight;}
function kbEl(kb){
 if(!kb||!kb.inline_keyboard)return null;var wrap=document.createElement('div');wrap.className='kb';
 kb.inline_keyboard.forEach(function(r){var rd=document.createElement('div');rd.className='kr';
  r.forEach(function(b){var bt=document.createElement('button');bt.textContent=b.text;
   if(b.url){bt.onclick=function(){window.open(b.url,'_blank','noopener')};}
   else bt.onclick=function(){var row=bt.closest('.row');post({cb:b.callback_data,mid:row?Number(row.dataset.id):0});};
   rd.appendChild(bt);});wrap.appendChild(rd);});
 return wrap;
}
function fill(row,m){
 row.innerHTML='';var b=document.createElement('div');b.className='b';
 if(m.video){var v=document.createElement('video');v.src=m.video;v.controls=true;v.playsInline=true;b.appendChild(v);}
 var d=document.createElement('div');d.innerHTML=clean(m.text||'');if(m.text||!m.video)b.appendChild(d);row.appendChild(b);
 var k=kbEl(m.kb);if(k)row.appendChild(k);
}
function addBot(m){var row=document.createElement('div');row.className='row bot';row.dataset.id=m.id;fill(row,m);chat.appendChild(row);}
function addMe(text,id,imgSrc){var row=document.createElement('div');row.className='row me';row.dataset.id=id;
 var b=document.createElement('div');b.className='b';
 if(imgSrc){var im=document.createElement('img');im.src=imgSrc;b.appendChild(im);}else b.textContent=text;
 row.appendChild(b);chat.appendChild(row);scroll();}
function apply(msgs){
 msgs.forEach(function(m){
  if(m.m==='send'||m.m==='video')addBot(m);
  else if(m.m==='edit'){var row=chat.querySelector('.row[data-id="'+m.id+'"]');if(row)fill(row,m);else addBot(m);}
  else if(m.m==='del'){var r=chat.querySelector('.row[data-id="'+m.id+'"]');if(r)r.remove();}
 });scroll();
}
function typing(on){var t=document.getElementById('typ');
 if(on&&!t){t=document.createElement('div');t.id='typ';t.className='typing';t.textContent='…';chat.appendChild(t);scroll();}
 if(!on&&t)t.remove();}
function post(o){
 if(busy)return;busy=true;typing(true);
 o.web=true;o.cid=CID;o.lang=L;
 fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)})
 .then(function(r){return r.json()}).then(function(j){typing(false);apply(j.msgs||[]);})
 .catch(function(){typing(false);apply([{m:'send',id:Date.now(),text:T.off}]);})
 .then(function(){busy=false;});
}
function sendText(){var v=txt.value.trim();if(!v||busy)return;txt.value='';var id=Date.now();addMe(v,id);post({text:v,mid:id});}
document.getElementById('snd').onclick=sendText;
txt.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();sendText();}});
document.getElementById('att').onclick=function(){document.getElementById('file').click();};
document.getElementById('file').onchange=function(e){
 var f=e.target.files&&e.target.files[0];e.target.value='';if(!f||busy)return;
 var img=new Image(),u=URL.createObjectURL(f);
 img.onload=function(){var s=Math.min(1,1280/Math.max(img.width,img.height)),c=document.createElement('canvas');
  c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  var data=c.toDataURL('image/jpeg',0.82);URL.revokeObjectURL(u);addMe('',Date.now(),data);post({photo:data.split(',')[1]});};
 img.onerror=function(){URL.revokeObjectURL(u);};img.src=u;
};
if('serviceWorker' in navigator){try{navigator.serviceWorker.register('/bot-sw.js').catch(function(){});}catch(e){}}
post({text:'/start',mid:Date.now()});
})();
</script>
</body>
</html>
