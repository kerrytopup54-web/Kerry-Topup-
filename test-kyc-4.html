<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KerryTopup KYC</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#F6F8F5;font-family:Arial,sans-serif;color:#11151A;overflow:hidden}
.wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;}
.stage{position:relative;width:min(320px,88vw);aspect-ratio:3/4.3;}
.camera{position:absolute;inset:0;overflow:hidden;background:#111;clip-path:ellipse(50% 50% at 50% 50%);-webkit-clip-path:ellipse(50% 50% at 50% 50%);box-shadow:0 8px 30px rgba(15,166,84,0.15);}
video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.shade{position:absolute;inset:0;clip-path:ellipse(50% 50% at 50% 50%);-webkit-clip-path:ellipse(50% 50% at 50% 50%);background:radial-gradient(ellipse 48% 44% at center,transparent 96%,#0009 100%);pointer-events:none;}

svg.ringSvg{position:absolute;inset:-3%;width:106%;height:106%;pointer-events:none;transform:rotate(-90deg);}
svg.ringSvg path{fill:none;stroke-width:14;stroke-linecap:round;}
.seg-base{stroke:transparent;}
.seg{stroke:transparent;transition:stroke .3s ease;}
.seg.ok{stroke:#0FA654;}
.seg.bad{stroke:#E23B57;}

.arrow{position:absolute;font-size:30px;opacity:0;transition:opacity .25s ease;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25));}
.arrow.show{opacity:1;}
#arrowLeft{left:-6px;top:50%;transform:translateY(-50%);}
#arrowRight{right:-6px;top:50%;transform:translateY(-50%);}
#arrowUp{top:-6px;left:50%;transform:translateX(-50%);}

.msg{margin-top:22px;font-size:14px;font-weight:600;color:#6B7A6E;text-align:center;min-height:20px;}
.msg.ok{color:#0FA654;font-weight:800;font-size:16px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <div class="camera"><video id="video" autoplay muted playsinline></video></div>
    <div class="shade"></div>
    <svg class="ringSvg" viewBox="0 0 200 200">
      <path class="seg-base" d="M100,8 A92,92 0 1,1 99.9,8"/>
      <path id="segBottom" class="seg" d="M35,170 A92,92 0 0,0 165,170"/>
      <path id="segLeft"   class="seg" d="M8,100 A92,92 0 0,0 45,168"/>
      <path id="segRight"  class="seg" d="M155,168 A92,92 0 0,0 192,100"/>
      <path id="segTop"    class="seg" d="M35,30 A92,92 0 0,1 165,30"/>
    </svg>
    <div class="arrow" id="arrowLeft">⬅️</div>
    <div class="arrow" id="arrowRight">➡️</div>
    <div class="arrow" id="arrowUp">⬆️</div>
  </div>
  <div class="msg" id="msg">Activation de la caméra...</div>
</div>

<script>
const video=document.getElementById('video'), msg=document.getElementById('msg');
const segBottom=document.getElementById('segBottom'), segLeft=document.getElementById('segLeft'),
      segRight=document.getElementById('segRight'), segTop=document.getElementById('segTop');
const arrowLeft=document.getElementById('arrowLeft'), arrowRight=document.getElementById('arrowRight'), arrowUp=document.getElementById('arrowUp');

let faceDetector=null;
const STEPS=['center','left','right','up','done'];
let stepIndex=0;
let stableFrames=0;
const NEED_FRAMES=10;

function setMsg(t, ok){ msg.textContent=t; msg.className='msg'+(ok?' ok':''); }

async function start(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});
    video.srcObject=stream;
    if('FaceDetector' in window){
      faceDetector=new FaceDetector({fastMode:true});
      setMsg('Placez votre visage dans le cercle');
      loop();
    } else {
      // Fallback: pa gen deteksyon presi — senpman ranpli chak segman apre yon ti tan
      setMsg('Restez immobile...');
      let i=0;
      const seq=[segBottom,segLeft,segRight,segTop];
      const t=setInterval(()=>{ seq[i].classList.add('ok'); i++; if(i>=seq.length){clearInterval(t); finish();} }, 900);
    }
  }catch(e){ setMsg('Caméra refusée — autorisez-la dans les réglages.'); }
}

async function loop(){
  if(stepIndex>=STEPS.length-1) return;
  try{
    const faces=await faceDetector.detect(video);
    arrowLeft.classList.remove('show'); arrowRight.classList.remove('show'); arrowUp.classList.remove('show');

    if(faces.length===0){
      setMsg('Placez votre visage dans le cercle');
      stableFrames=0;
    } else {
      const f=faces[0];
      const box=f.boundingBox;
      const ratio=(box.width*box.height)/(video.videoWidth*video.videoHeight);

      if(ratio<0.09){ setMsg('Rapprochez-vous'); stableFrames=0; }
      else if(ratio>0.34){ setMsg('Reculez-vous légèrement'); stableFrames=0; }
      else {
        const step=STEPS[stepIndex];
        // Estime pozisyon nen an konpare ak sant bwat figi a (0=goch, 1=dwat)
        let noseX=0.5, noseY=0.5;
        if(f.landmarks){
          const nose=f.landmarks.find(l=>l.type==='nose');
          if(nose && nose.locations && nose.locations[0]){
            noseX=(nose.locations[0].x-box.x)/box.width;
            noseY=(nose.locations[0].y-box.y)/box.height;
          }
        }

        if(step==='center'){
          setMsg('Parfait — restez immobile...');
          stableFrames++;
          if(stableFrames>=NEED_FRAMES){ segBottom.classList.add('ok'); advance(); }
        } else if(step==='left'){
          arrowLeft.classList.add('show');
          setMsg('Tournez doucement la tête vers la gauche');
          if(noseX<0.38){ stableFrames++; if(stableFrames>=NEED_FRAMES){ segLeft.classList.add('ok'); advance(); } }
          else stableFrames=0;
        } else if(step==='right'){
          arrowRight.classList.add('show');
          setMsg('Tournez doucement la tête vers la droite');
          if(noseX>0.62){ stableFrames++; if(stableFrames>=NEED_FRAMES){ segRight.classList.add('ok'); advance(); } }
          else stableFrames=0;
        } else if(step==='up'){
          arrowUp.classList.add('show');
          setMsg('Levez légèrement la tête');
          if(noseY<0.42){ stableFrames++; if(stableFrames>=NEED_FRAMES){ segTop.classList.add('ok'); advance(); } }
          else stableFrames=0;
        }
      }
    }
  }catch(e){}
  setTimeout(loop,100);
}

function advance(){ stepIndex++; stableFrames=0; if(stepIndex>=STEPS.length-1){ finish(); } }

function finish(){
  setMsg('✓ Vérification réussie', true);
  if(video.srcObject) video.srcObject.getTracks().forEach(t=>t.stop());
}

start();
</script>
</body>
</html>
