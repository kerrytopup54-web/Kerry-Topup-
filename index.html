<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Kerry Topup Official</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F8F5;
  --panel:#FFFFFF;
  --panel-2:#F0F3EE;
  --line:#E3E8E0;
  --text:#11151A;
  --muted:#6B7A6E;
  --green:#0FA654;
  --green-2:#0C8A45;
  --green-dim:#E4F6EA;
  --ink:#10141C;
  --ink-2:#1D2330;
  --amber:#B77A0B;
  --amber-dim:#FBF0DA;
  --red:#E23B57;
  --red-dim:#FBE6EA;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(900px 420px at 10% -10%, rgba(15,166,84,0.08), transparent 60%),
    radial-gradient(700px 420px at 100% 0%, rgba(15,166,84,0.04), transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  min-height:100vh;
}
.display{font-family:'Rajdhani',sans-serif;}
.mono{font-family:'JetBrains Mono',monospace;}
a{color:inherit;text-decoration:none;}
button{font-family:'Inter',sans-serif;border:none;cursor:pointer;background:none;color:inherit;}
input,textarea,select{font-family:'Inter',sans-serif;}

/* ---------- App shell (phone-like) ---------- */
.app{
  max-width:460px;margin:0 auto;min-height:100vh;position:relative;
  padding-bottom:78px;
  background:linear-gradient(180deg, rgba(15,166,84,0.03), transparent 200px);
}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:30;
  background:rgba(255,255,255,0.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  padding:14px 16px 12px;
}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.logo{display:flex;align-items:center;gap:10px;}
.logo-mark{
  width:38px;height:38px;border-radius:11px;
  background:linear-gradient(150deg,var(--green),var(--green-2));
  display:flex;align-items:center;justify-content:center;
  font-family:'Rajdhani',sans-serif;font-weight:700;font-size:17px;color:#FFFFFF;
  box-shadow:0 6px 16px -4px rgba(15,166,84,0.4);
}
.logo-text{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:17px;line-height:1.1;}
.logo-text span{display:block;font-family:'Inter',sans-serif;font-weight:400;font-size:10.5px;color:var(--muted);letter-spacing:0.03em;}
.icon-row{display:flex;align-items:center;gap:6px;}
.icon-btn{
  width:38px;height:38px;border-radius:11px;background:var(--panel-2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;position:relative;
}
.icon-btn svg{width:18px;height:18px;}
.badge{
  position:absolute;top:-4px;right:-4px;background:var(--green);color:#FFFFFF;
  font-size:9.5px;font-weight:700;border-radius:9px;min-width:16px;height:16px;
  display:flex;align-items:center;justify-content:center;padding:0 3px;
}

.search-bar{
  margin-top:12px;display:flex;align-items:center;gap:8px;
  background:var(--panel-2);border:1px solid var(--line);border-radius:13px;padding:10px 14px;
}
.search-bar svg{width:16px;height:16px;flex-shrink:0;color:var(--muted);}
.search-bar input{background:none;border:none;outline:none;color:var(--text);font-size:13.5px;width:100%;}
.search-bar input::placeholder{color:#5B6656;}

/* ---------- Content ---------- */
.content{padding:16px;}
@media (max-width:360px){
  .content{padding:12px;}
}
@media (min-width:600px){
  .app{margin-top:0;box-shadow:0 0 60px rgba(0,0,0,0.08);}
}
.section-title{
  display:flex;align-items:center;justify-content:space-between;margin:18px 0 12px;
}
.section-title h3{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:16px;margin:0;letter-spacing:0.01em;}
.section-title .see-all{font-size:12px;color:var(--green);font-weight:600;}
.section-title:first-child{margin-top:0;}

.chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:4px;scrollbar-width:none;}
.chip-row::-webkit-scrollbar{display:none;}
.chip{
  flex-shrink:0;padding:8px 15px;border-radius:20px;font-size:12.5px;font-weight:600;
  background:var(--panel-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap;
}
.chip.active{background:var(--green-dim);border-color:var(--green);color:var(--green);}

.cat-heading{display:flex;align-items:center;gap:10px;margin:22px 0 14px;}
.cat-heading:first-child{margin-top:0;}
.cat-heading .bar{width:4px;height:18px;background:var(--green);border-radius:2px;flex-shrink:0;}
.cat-heading h3{
  color:var(--green);text-transform:uppercase;font-weight:800;font-size:14.5px;
  letter-spacing:0.05em;font-family:'Rajdhani',sans-serif;margin:0;white-space:nowrap;
}
.cat-heading .line{flex:1;height:1px;background:linear-gradient(90deg, var(--line), transparent);}

.prod-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.prod-card{
  background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  display:flex;flex-direction:column;cursor:pointer;
}
.prod-cover{
  height:92px;display:flex;align-items:center;justify-content:center;
  font-size:30px;position:relative;
}
.prod-badge{
  position:absolute;top:8px;left:8px;background:rgba(6,23,13,0.75);color:var(--green);
  font-size:9.5px;font-weight:700;padding:3px 8px;border-radius:8px;text-transform:uppercase;letter-spacing:0.04em;
}
.prod-badge.hot{background:#E23B57;color:#fff;}
.prod-body{padding:10px 12px 12px;}
.prod-name{font-weight:700;font-size:13px;margin-bottom:2px;}
.prod-sub{font-size:11px;color:var(--muted);margin-bottom:10px;}
.prod-foot{display:flex;align-items:center;justify-content:space-between;}
.prod-price{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:15px;color:var(--green);}
.buy-btn{
  background:var(--ink);color:#FFFFFF;font-weight:700;font-size:11.5px;
  padding:7px 12px;border-radius:9px;
}
.buy-btn:active{transform:scale(0.95);}
.buy-btn:disabled{opacity:0.35;}

/* ---------- Variant sheet ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(4,6,5,0.65);z-index:80;display:none;align-items:flex-end;justify-content:center;}
.sheet-bg.show{display:flex;}
.sheet{
  max-width:460px;width:100%;background:var(--panel);border-top-left-radius:22px;border-top-right-radius:22px;
  border:1px solid var(--line);border-bottom:none;padding:20px 18px 26px;max-height:82vh;overflow-y:auto;
  animation:sheetUp .22s ease-out;
}
@keyframes sheetUp{from{transform:translateY(30px);opacity:0.4;} to{transform:translateY(0);opacity:1;}}
.sheet-handle{width:36px;height:4px;background:var(--line);border-radius:3px;margin:0 auto 16px;}
.sheet h3{font-family:'Rajdhani',sans-serif;font-size:20px;margin:0 0 3px;}
.sheet .sub{color:var(--muted);font-size:12.5px;margin-bottom:16px;}
.variant-list{display:flex;flex-direction:column;gap:8px;margin-bottom:18px;}
.variant-item{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;
}
.variant-item.selected{border-color:var(--green);background:var(--green-dim);}
.variant-item .vname{font-weight:600;font-size:13.5px;}
.variant-item .vstock{font-size:10.5px;color:var(--muted);margin-top:2px;}
.variant-item .vprice{font-family:'Rajdhani',sans-serif;font-weight:700;color:var(--green);font-size:14.5px;}
.variant-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
.variant-tile{
  padding:14px 12px;border-radius:13px;border:1.5px solid var(--line);background:var(--panel-2);cursor:pointer;text-align:center;
  transition:border-color .12s, background .12s;
}
.variant-tile.selected{border-color:var(--green);background:var(--green-dim);}
.variant-tile .vname{font-weight:700;font-size:14px;margin-bottom:4px;}
.variant-tile .vprice{font-family:'Rajdhani',sans-serif;font-weight:700;color:var(--green);font-size:15px;}
.variant-tile .vstock{font-size:10px;color:var(--muted);margin-top:3px;}
.field-uid{margin-bottom:16px;}
.field-uid label{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;display:block;margin-bottom:6px;}
.field-uid input{
  width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:11px;color:var(--text);
  padding:11px 13px;font-size:13.5px;outline:none;
}
.field-uid input:focus{border-color:var(--green);}

.btn{
  width:100%;padding:14px;border-radius:13px;font-weight:700;font-size:14px;text-align:center;
}
.btn-green{background:var(--ink);color:#FFFFFF;}
.btn-green:disabled{opacity:0.35;}
.btn-ghost{background:var(--panel-2);border:1px solid var(--line);color:var(--text);}
.btn-red-ghost{background:transparent;border:1px solid #3A2530;color:var(--red);}

/* ---------- Bottom nav ---------- */
.bottomnav{
  position:fixed;bottom:0;left:0;right:0;z-index:40;
  display:flex;justify-content:center;
}
.bottomnav-inner{
  max-width:460px;width:100%;background:rgba(10,13,11,0.92);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));
}
.nav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:12px;color:var(--muted);
}
.nav-btn svg{width:20px;height:20px;}
.nav-btn span{font-size:9.5px;font-weight:600;}
.nav-btn.active{color:var(--green);}

/* ---------- Auth modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(4,6,5,0.7);z-index:90;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-bg.show{display:flex;}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px;max-width:380px;width:100%;}
.modal h2{font-family:'Rajdhani',sans-serif;font-size:21px;margin:0 0 4px;}
.modal .sub{color:var(--muted);font-size:12.5px;margin-bottom:18px;}
.modal .field{margin-bottom:12px;}
.modal .field label{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;display:block;margin-bottom:6px;}
.modal .field input{
  width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:11px;color:var(--text);
  padding:11px 13px;font-size:13.5px;outline:none;
}
.modal .field input:focus{border-color:var(--green);}
.modal-switch{text-align:center;margin-top:14px;font-size:12.5px;color:var(--muted);}
.modal-switch b{color:var(--green);cursor:pointer;}
.modal-close{position:absolute;top:16px;right:16px;color:var(--muted);font-size:18px;}
.modal{position:relative;}

/* ---------- Generic page ---------- */
.page-header{margin-bottom:16px;}
.page-header h2{font-family:'Rajdhani',sans-serif;font-size:22px;margin:0;}
.page-header p{color:var(--muted);font-size:12.5px;margin:3px 0 0;}

.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;}

/* Wallet */
.balance-card{
  background:linear-gradient(140deg, rgba(34,197,94,0.16), rgba(34,197,94,0.02));
  border:1px solid var(--green-dim);border-radius:18px;padding:20px;margin-bottom:16px;
}
.balance-card .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;}
.balance-card .amount{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:34px;margin:4px 0 14px;}
.wallet-actions{display:flex;gap:10px;}
.wallet-actions button{flex:1;}
.segmented{
  position:relative;display:flex;background:var(--panel-2);border:1px solid var(--line);
  border-radius:13px;padding:4px;margin-bottom:16px;
}
.segmented-thumb{
  position:absolute;top:4px;left:4px;width:calc(33.333% - 4px);height:calc(100% - 8px);
  background:var(--ink);border-radius:10px;transition:transform 250ms cubic-bezier(.4,0,.2,1);z-index:0;
}
.segmented-btn{
  position:relative;z-index:1;flex:1;background:none;border:none;padding:10px 4px;
  font-size:12.5px;font-weight:700;color:var(--muted);border-radius:10px;transition:color 150ms;
}
.segmented-btn.active{color:#fff;}
.btn-sm{padding:10px;border-radius:11px;font-weight:700;font-size:12.5px;}

.natcash-box{background:var(--panel-2);border:1px dashed var(--green);border-radius:13px;padding:14px;margin-bottom:14px;}
.natcash-box .row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;}
.natcash-box .row b{font-family:'JetBrains Mono',monospace;color:var(--green);}

.paycard{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:#FDF3D6;border:1.5px solid #F0D888;border-radius:16px;
  padding:16px 16px;margin-bottom:12px;
}
.paycard-info{min-width:0;}
.paycard-number{
  font-family:'JetBrains Mono',monospace;font-weight:700;font-size:21px;color:#B4530A;
  letter-spacing:0.01em;word-break:break-all;
}
.paycard-name{font-size:12.5px;color:#8A7A56;margin-top:4px;}
.paycard-copy{
  flex-shrink:0;background:#fff;border:1px solid #F0D888;color:#B4530A;
  font-weight:700;font-size:13px;padding:10px 18px;border-radius:12px;
}
.paycard-copy:active{transform:scale(0.96);}

.tx-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #171D14;}
.tx-row:last-child{border-bottom:none;}
.tx-left{display:flex;align-items:center;gap:10px;}
.tx-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;}
.tx-icon.in{background:var(--green-dim);}
.tx-icon.out{background:var(--red-dim);}
.tx-title{font-size:13px;font-weight:600;}
.tx-date{font-size:10.5px;color:var(--muted);}
.tx-amount{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:13px;}
.tx-amount.in{color:var(--green);}
.tx-amount.out{color:var(--red);}

/* Orders */
.order-card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:10px;}
.order-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.order-name{font-weight:700;font-size:13.5px;}
.order-date{font-size:10.5px;color:var(--muted);}
.order-pin{
  background:#FDF3D6;border:1.5px solid #F0D888;border-radius:16px;padding:16px 16px;
  display:flex;justify-content:space-between;align-items:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:18px;color:#B4530A;letter-spacing:0.01em;word-break:break-all;
}
.copy-mini{flex-shrink:0;background:#fff;border:1px solid #F0D888;color:#B4530A;font-weight:700;font-size:12.5px;padding:9px 16px;border-radius:12px;margin-left:10px;}
.copy-mini:active{transform:scale(0.96);}

/* Redeem */
.redeem-input{
  width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:13px;color:var(--text);
  padding:14px;font-size:15px;font-family:'JetBrains Mono',monospace;text-align:center;letter-spacing:0.06em;outline:none;margin-bottom:14px;
}
.redeem-input:focus{border-color:var(--green);}

/* Menu drawer */
.drawer-bg{position:fixed;inset:0;background:rgba(4,6,5,0.6);z-index:70;display:none;}
.drawer-bg.show{display:block;}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:78%;max-width:300px;background:var(--panel);
  border-left:1px solid var(--line);z-index:71;transform:translateX(100%);transition:transform .22s ease;
  padding:20px;overflow-y:auto;
}
.drawer.show{transform:translateX(0);}
.drawer-user{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--line);}
.drawer-avatar{width:44px;height:44px;border-radius:50%;background:var(--green-dim);color:var(--green);display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Rajdhani',sans-serif;font-size:17px;}
.drawer-name{font-weight:700;font-size:14px;}
.drawer-email{font-size:11px;color:var(--muted);}
.drawer-item{display:flex;align-items:center;gap:12px;padding:12px 8px;border-radius:11px;font-size:13.5px;font-weight:600;}
.drawer-item:active{background:var(--panel-2);}
.drawer-item svg{width:18px;height:18px;color:var(--muted);}
.drawer-item.danger{color:var(--red);}
.drawer-item.danger svg{color:var(--red);}

/* Toast */
.toast{
  position:fixed;bottom:92px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--ink);border:1px solid var(--ink-2);color:#FFFFFF;
  padding:11px 18px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;
  transition:opacity .2s, transform .2s; z-index:95;box-shadow:0 10px 30px rgba(0,0,0,0.18);max-width:88%;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.empty{text-align:center;padding:50px 20px;color:var(--muted);}
.empty .em-icon{font-size:34px;margin-bottom:10px;}
.empty .em-title{font-family:'Rajdhani',sans-serif;font-size:16px;color:var(--text);margin-bottom:4px;}

.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10.5px;font-weight:700;}
.pill.wait{background:var(--amber-dim);color:var(--amber);}
.pill.ok{background:var(--green-dim);color:var(--green);}
.pill.no{background:var(--red-dim);color:var(--red);}

/* Admin */
.admin-tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none;}
.admin-tabs::-webkit-scrollbar{display:none;}
.atab{flex-shrink:0;padding:8px 14px;border-radius:10px;font-size:12px;font-weight:700;color:var(--muted);background:var(--panel-2);border:1px solid var(--line);white-space:nowrap;}
.atab.active{background:var(--green-dim);color:var(--green);border-color:var(--green);}
table{width:100%;border-collapse:collapse;display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;}
img{max-width:100%;height:auto;}
html,body{overflow-x:hidden;}
th{font-size:10px;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);}
td{padding:8px 8px;font-size:12px;border-bottom:1px solid #171D14;}
.mini-btn{padding:5px 9px;border-radius:7px;font-size:10.5px;font-weight:700;background:var(--panel-2);border:1px solid var(--line);}
textarea.admin-ta{
  width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:11px;color:var(--text);
  padding:11px;font-family:'JetBrains Mono',monospace;font-size:12px;min-height:100px;outline:none;
}

.disclaimer{
  background:var(--amber-dim);border:1px solid #4A3A15;border-radius:12px;padding:12px 14px;font-size:11.5px;
  color:#E8CE8C;line-height:1.5;margin-bottom:16px;
}
@keyframes shakeX { 0%,100%{transform:translateX(0);} 15%{transform:translateX(-8px);} 30%{transform:translateX(7px);} 45%{transform:translateX(-6px);} 60%{transform:translateX(5px);} 75%{transform:translateX(-3px);} 90%{transform:translateX(2px);} }
@keyframes offlineBarMove { 0%{ transform:translateX(-100px); } 50%{ transform:translateX(180px); } 100%{ transform:translateX(-100px); } }
@keyframes skelShimmer { 0%{ background-position:-200px 0; } 100%{ background-position:200px 0; } }
.skel-card{ background:var(--panel); border-radius:14px; padding:10px; }
.skel-img{ width:100%; aspect-ratio:1; border-radius:10px; background:linear-gradient(90deg, var(--panel-2) 25%, #e8ebee 37%, var(--panel-2) 63%); background-size:400px 100%; animation:skelShimmer 1.4s infinite linear; }
.skel-line{ border-radius:6px; background:linear-gradient(90deg, var(--panel-2) 25%, #e8ebee 37%, var(--panel-2) 63%); background-size:400px 100%; animation:skelShimmer 1.4s infinite linear; }
</style>
</head>
<body>
<div id="offlineOverlay" style="display:none;position:fixed;inset:0;background:#ffffff;z-index:99999;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;">
  <div style="width:96px;height:96px;border-radius:50%;background:#e3fff0;display:flex;align-items:center;justify-content:center;margin-bottom:22px;">
    <span style="font-size:44px;">📶</span>

<script>
/* ============================================================
   KERRY TOPUP OFFICIAL — PROTOTYPE FRONT-END
   Demo data layer via window.storage. See disclaimer in Paramètres
   / admin about production security before going live.

const STORE_KEY = 'kt-app-state-v1';
const ADMIN_PASSCODE = 'kerry2026'; // change this before real use
const ADMIN_EMAIL = 'kerrytopup54@gmail.com';

let logoTapCount = 0;
let logoTapTimer = null;
function handleLogoTap(){
  logoTapCount++;
  clearTimeout(logoTapTimer);
  logoTapTimer = setTimeout(() => { logoTapCount = 0; }, 2500);
  if(logoTapCount >= 5){
    logoTapCount = 0;
    openAdminLoginModal();
  }
}
function openAdminLoginModal(){
  document.getElementById('authModal').classList.add('show');
  document.getElementById('authModalContent').innerHTML = `
    <h2>Admin Login</h2>
    <div class="sub">Aksè rezève — pou administratè sèlman.</div>
    <div class="field"><label>Imèl Admin</label><input type="text" id="adminEmail" placeholder="admin@kerrytopup.com"></div>
    <div class="field"><label>Kòd Pasaj</label><input type="password" id="adminPass" placeholder="••••••••"></div>
    <button class="btn btn-green" onclick="tryAdminLogin()">Konekte kòm Admin</button>
  `;
}
async function tryAdminLogin(){
  const email = document.getElementById('adminEmail').value.trim().toLowerCase();
  const val = document.getElementById('adminPass').value;
  try{
    const sb = await getSupabase();
    const { data, error } = await sb.auth.signInWithPassword({ email, password: val });
    if(!error && data.session){
      await syncLocalUserFromAuth(data.user);
      closeAuthModal();
      goPage('admin');
      showToast('Byenveni, Super Admin');
      return;
    }
    const sub = state.admins.find(a=>a.passcode===val && a.email===email);
    if(sub){
      state.isAdmin = true; state.isSuperAdmin = false;
      closeAuthModal();
      goPage('admin');
      showToast('⚠️ Kont sa a pa gen vrè otantifikasyon Supabase — chanjman ap rete lokal sèlman');
      return;
    }
    showToast('Imèl oswa modpas pa bon');
  }catch(e){
    showToast('Pa ka konekte ak sèvè a — eseye ankò');
  }
}

let state = {
  users: [],           // {id, name, email, password, profile:{prenom,nom,email,whatsapp}, googlePhoto}
  currentUserId: null,
  wallets: {},          // userId -> balance (HTG)
  transactions: {},     // userId -> [{type:'in'|'out', label, amount, date}]
  orders: {},           // userId -> [{id, orderNo, type, status, product, variant, price, pin, date}]
  rechargeRequests: [], // {id, userId, amount, txnId, status, date}
  products: [],         // {id, category, name, icon, type:'pin'|'calculator', variants / manualConfig}
  productsLoaded: false,
  inventory: {},         // variantId -> [{code, status:'dispo'|'vann'}]
  redeemCodes: [],       // {code, value, status:'dispo'|'vann', date}
  isAdmin: false,
  isSuperAdmin: false,
  orderCounter: 1000,
  admins: [],            // {id, name, passcode, perms:{...}}
  activityLog: [],       // {date, who, action}
  reportClearedAt: null,
  usedRefs: [],
  usedTxnIds: [],
  usedReceiptHashes: [],
  categories: [],
  cart: [],
  tutorielContent: '',
  tutorielVideo: '',
  paymentSettings: { number: '42614967', name: 'CADET VANSKERRY', whatsapp: '50942614967', ntfyTopic: '' },
  rewardPrograms: [],
  rewardProgress: {},
  rewardClaims: [],
  rewardStock: {},
  rewardSettings: { enabled: true, amount: 10 },
  infoPages: { about_us: '', community: '', terms: '' }
};
function nextOrderNo(){ return 'KT-' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2,5).toUpperCase(); }
function logActivity(action){
  state.activityLog.unshift({ date:new Date().toISOString(), who: state.isSuperAdmin ? 'Super Admin' : 'Admin', action });
  if(state.activityLog.length > 300) state.activityLog.length = 300;
}

/* ---------------- default catalog (editable via Admin) ---------------- */
function defaultProducts(){
  return [
    { id:'ff', category:'Jeux', name:'Free Fire', icon:'🔥', popular:true, type:'pin', active:true,
      description:'Rechaj dyaman Free Fire — livrezon otomatik.',
      variants:[
        {id:'ff-110', label:'110 Diamonds', price:135},
        {id:'ff-341', label:'341 Diamonds', price:390},
        {id:'ff-572', label:'572 Diamonds', price:650},
        {id:'ff-1166', label:'1166 Diamonds', price:1300},
        {id:'ff-2398', label:'2398 Diamonds', price:2600},
        {id:'ff-6166', label:'6166 Diamonds', price:6500},
      ]},
  ];
}

/* ---------------- persistence ---------------- */
async function loadState(){
  try{
    const res = await window.storage.get(STORE_KEY, false);
    if(res && res.value){
      const loaded = JSON.parse(res.value);
      state = Object.assign(state, loaded);
    }
  }catch(e){ /* first run */ }
  state.productsLoaded = false;
  render();
}
async function saveState(){
  try{ await window.storage.set(STORE_KEY, JSON.stringify(state), false); }
  catch(e){ console.warn('Local cache save failed (non-critical):', e); }
}

async function fetchProductsFromServer(){
  try{
    const sb = await getSupabase();
    const { data: prods, error } = await sb.from('products').select('*');
    if(error) throw error;
    if(!prods || prods.length === 0){
      await seedProductsToServer();
    } else {
      const { data: vars } = await sb.from('variants').select('*');
      const { data: configs } = await sb.from('manual_configs').select('*');
      state.products = prods.map(p => {
        const obj = {
          id:p.id, name:p.name, category:p.category, icon:p.icon, image:p.image, description:p.description,
          type:p.type, popular:!!p.popular, active:p.active!==false, badge:p.badge||null,
          redeemInstructions:p.redeem_instructions||'', redeemLink:p.redeem_link||'', descriptions:p.descriptions||[]
        };
        if(p.type === 'calculator'){
          const mc = (configs||[]).find(c=>c.product_id===p.id);
          obj.manualConfig = mc ? { taux:Number(mc.taux), frais:Number(mc.frais||0), min:Number(mc.min_amount), max:Number(mc.max_amount), fields:mc.fields||[], feeTiers:mc.fee_tiers||[] } : {taux:145,frais:0,min:5,max:500,fields:[],feeTiers:[]};
        } else {
          obj.variants = (vars||[]).filter(v=>v.product_id===p.id).map(v=>({id:v.id, label:v.label, price:Number(v.price)}));
          if(p.type === 'form'){ obj.formFields = p.form_fields || []; }
        }
        return obj;
      });
      state.productsLoaded = true;
      await saveState();
      renderShop();
      if(document.getElementById('adminTabs')) renderAdminTab();
    }
  }catch(e){ console.warn('fetchProductsFromServer failed:', e?.message || e?.error_description || e?.code || JSON.stringify(e) || e); }
  await fetchCategoriesFromServer();

/* Called after each PIN unit successfully claimed during checkout */
async function incrementRewardProgress(userId, variantId){
  const matchingPrograms = (Array.isArray(state.rewardPrograms) ? state.rewardPrograms : []).filter(p => p.active && p.variantId === variantId);
  for(const program of matchingPrograms){
    try{
      const sb = await getSupabase();
      const current = state.rewardProgress[program.id] || 0;
      const newCount = current + 1;
      if(newCount >= program.purchasesRequired){
        await sb.from('reward_progress').upsert({ user_id:userId, program_id:program.id, count:0, updated_at:new Date().toISOString() });
        state.rewardProgress[program.id] = 0;
        await claimRewardForProgram(userId, program);
      } else {
        await sb.from('reward_progress').upsert({ user_id:userId, program_id:program.id, count:newCount, updated_at:new Date().toISOString() });
        state.rewardProgress[program.id] = newCount;
      }
    }catch(e){ console.warn('incrementRewardProgress failed:', e?.message || e); }
  }
}
async function claimRewardForProgram(userId, program){
  try{
    const sb = await getSupabase();
    const { data: pinRow } = await sb.from('reward_stock').select('*').eq('variant_id', program.rewardVariantId).eq('status','dispo').order('created_at',{ascending:true}).limit(1).maybeSingle();
    if(pinRow){
      await sb.from('reward_stock').update({ status:'vann' }).eq('id', pinRow.id);
      await sb.from('reward_claims').insert({ user_id:userId, program_id:program.id, variant_id:program.rewardVariantId, pin_code:pinRow.code });
      showToast('🎁 Ou genyen yon rekonpans Kerry Rewards!');
    } else {
      await sb.from('reward_pending').insert({ user_id:userId, program_id:program.id, fulfilled:false });
      showToast('🎁 Ou rive nan objektif ou! Admin ap ajoute PIN byento.');
    }
  }catch(e){ console.warn('claimRewardForProgram failed:', e?.message || e); }
}
/* Called after admin adds new reward stock, to auto-fulfill any customers waiting */
async function fulfillPendingRewardsForVariant(rewardVariantId){
  try{
    const sb = await getSupabase();
    const programIds = state.rewardPrograms.filter(p => p.rewardVariantId === rewardVariantId).map(p=>p.id);
    if(programIds.length === 0) return;
    const { data: pendings } = await sb.from('reward_pending').select('*').in('program_id', programIds).eq('fulfilled', false).order('created_at',{ascending:true});
    if(!pendings) return;
    for(const pending of pendings){
      const { data: pinRow } = await sb.from('reward_stock').select('*').eq('variant_id', rewardVariantId).eq('status','dispo').order('created_at',{ascending:true}).limit(1).maybeSingle();
      if(!pinRow) break;
      await sb.from('reward_stock').update({ status:'vann' }).eq('id', pinRow.id);
      await sb.from('reward_claims').insert({ user_id:pending.user_id, program_id:pending.program_id, variant_id:rewardVariantId, pin_code:pinRow.code });
      await sb.from('reward_pending').update({ fulfilled:true }).eq('id', pending.id);
    }
  }catch(e){ console.warn('fulfillPendingRewardsForVariant failed:', e?.message || e); }
}

async function seedProductsToServer(){
  try{
    const sb = await getSupabase();
    for(const p of state.products){
      const { data: inserted, error } = await sb.from('products').insert({
        name:p.name, category:p.category, icon:p.icon, image:p.image, description:p.description||null,
        type:p.type||'pin', popular:!!p.popular, active:p.active!==false,
        form_fields: p.type==='form' ? (p.formFields||[]) : []
      }).select().single();
      if(error || !inserted) continue;
      p.id = inserted.id; // adopt the real server UUID locally
      if(p.type==='calculator' && p.manualConfig){
        await sb.from('manual_configs').insert({
          product_id:p.id, taux:p.manualConfig.taux, frais:p.manualConfig.frais,
          min_amount:p.manualConfig.min, max_amount:p.manualConfig.max,
          fields:p.manualConfig.fields||[], fee_tiers:p.manualConfig.feeTiers||[]
        });
      } else if(p.variants){
        for(const v of p.variants){
          const { data: vIns } = await sb.from('variants').insert({ product_id:p.id, label:v.label, price:v.price }).select().single();
          if(vIns){
            const oldVid = v.id;
            v.id = vIns.id; // adopt the real server UUID locally
            if(state.inventory[oldVid]){
              state.inventory[v.id] = state.inventory[oldVid];
              delete state.inventory[oldVid];
            }
          }
        }
      }
    }
    await saveState();
    renderShop();
  }catch(e){}
}

const SUPABASE_URL = 'https://nzbnlecbtvbnulkknqbi.supabase.co';

let sbClient = null;
const SUPABASE_CDN_URLS = [
  'https://cdnjs.cloudflare.com/ajax/libs/supabase-js/2.45.4/supabase.min.js',
  'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js',
  'https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js'

function loadScriptFrom(url){
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = url;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('load failed: ' + url));
    document.head.appendChild(s);
  });
}
async function loadSupabaseLib(){
  if(window.supabase) return;
  let lastErr = null;
  for(const url of SUPABASE_CDN_URLS){
    try{ await loadScriptFrom(url); if(window.supabase) return; }
    catch(e){ lastErr = e; }
  }
  throw lastErr || new Error('Supabase library could not load from any source');
}
async function getSupabase(){
  if(sbClient) return sbClient;
  await loadSupabaseLib();
  if(!window.supabase){ throw new Error('window.supabase pa disponib apre chajman'); }
  sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  return sbClient;
}

async function fetchWalletFromServer(userId){
  try{
    const sb = await getSupabase();
    let { data: walletRow } = await sb.from('wallets').select('*').eq('user_id', userId).single();
    if(!walletRow){
      const created = await sb.from('wallets').insert({ user_id:userId, balance: state.wallets[userId]||0 }).select().single();
      walletRow = created.data;
    }
    if(walletRow) state.wallets[userId] = Number(walletRow.balance) || 0;

    const { data: txs } = await sb.from('wallet_transactions').select('*').eq('user_id', userId).order('created_at', { ascending:false }).limit(100);
    if(txs){
      state.transactions[userId] = txs.map(t => ({ type:t.type, label:t.label, amount:Number(t.amount), date:t.created_at }));
    }
  }catch(e){
    // server not reachable / RLS not ready yet — keep using local numbers so the app still works
  }
}

let walletRealtimeChannel = null;
async function subscribeToWalletRealtime(userId){
  try{
    const sb = await getSupabase();
    if(walletRealtimeChannel){ sb.removeChannel(walletRealtimeChannel); }
    walletRealtimeChannel = sb.channel('wallet-rt-' + userId)
      .on('postgres_changes', { event:'*', schema:'public', table:'wallets', filter:'user_id=eq.'+userId }, payload => {
        if(payload.new && typeof payload.new.balance !== 'undefined'){
          state.wallets[userId] = Number(payload.new.balance) || 0;
          const balDisplay = document.getElementById('walletBalanceDisplay');
          if(balDisplay) balDisplay.textContent = money(walletBalance());
          renderTopIcons();
          if(returnToCheckoutAfterRecharge){
            returnToCheckoutAfterRecharge = false;
            goPage('checkout');
          } else if(currentPage === 'checkout'){
            render();
          }
        }
      })
      .on('postgres_changes', { event:'INSERT', schema:'public', table:'wallet_transactions', filter:'user_id=eq.'+userId }, payload => {
        if(!state.transactions[userId]) state.transactions[userId] = [];
        const already = state.transactions[userId].some(t=>t.date===payload.new.created_at && t.amount===Number(payload.new.amount));
        if(!already){
          state.transactions[userId].unshift({ type:payload.new.type, label:payload.new.label, amount:Number(payload.new.amount), date:payload.new.created_at });
          if(currentPage==='wallet') renderWalletTab();
        }
      })
      .subscribe();
  }catch(e){ /* realtime not available — app still works via manual fetch/refresh */ }
}

/* Central wallet mutation — updates locally AND writes through to Supabase so balance + history follow the account across devices. */
async function applyWalletChange(userId, delta, label, type){
  state.wallets[userId] = (state.wallets[userId]||0) + delta;
  if(!state.transactions[userId]) state.transactions[userId] = [];
  state.transactions[userId].unshift({ type, label, amount: Math.abs(delta), date: new Date().toISOString() });
  try{
    const sb = await getSupabase();
    await sb.from('wallets').upsert({ user_id:userId, balance: state.wallets[userId] });
    await sb.from('wallet_transactions').insert({ user_id:userId, type, label, amount: Math.abs(delta) });
  }catch(e){
    // couldn't reach the server — local balance still updated, will need a manual re-sync later
  }
}

let currentPage = 'shop';

function slugify(name){
  return name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}
const PAGE_PATHS = { shop:'/', wallet:'/wallet', commandes:'/commandes', redeem:'/redeem', historique:'/historique', parametres:'/parametres', panye:'/panier', admin:'/admin', tutoriel:'/tutoriel', checkout:'/checkout', kerryRewards:'/programme-fidelite' };
const PATH_PAGES = { '/':'shop', '/wallet':'wallet', '/commandes':'commandes', '/redeem':'redeem', '/historique':'historique', '/parametres':'parametres', '/panier':'panye', '/admin':'admin', '/tutoriel':'tutoriel', '/checkout':'checkout', '/programme-fidelite':'kerryRewards' };
let pendingProductSlug = null;

function goPage(page, opts){
  const guarded = ['wallet','commandes','historique'];
  if(guarded.includes(page) && !isLoggedIn()){
    openAuthModal('login'); pendingAction = ()=>goPage(page); return;
  }
  currentPage = page;
  closeDrawer();
  render();
  window.scrollTo(0,0);
  if(page === 'commandes'){ fetchMyOrders(); subscribeToMyOrdersRealtime(); }
  if(page === 'shop'){ fetchProductsFromServer().then(() => fetchStockCountsForShop()); }
  if(page === 'kerryRewards' && isLoggedIn()){
    fetchRewardPrograms().then(()=>render());
    fetchRewardProgress(state.currentUserId).then(()=>render());
    fetchRewardClaims(state.currentUserId).then(()=>render());
  }
  if(!opts || !opts.skipHistory){
    const path = PAGE_PATHS[page] || '/';
    if(window.location.pathname !== path){ try{ history.pushState({ page }, '', path); }catch(e){ /* pushState blocked in this environment — app still works, URL just won't update */ } }
  }
}

function routeFromURL(){
  const path = window.location.pathname;
  if(path.startsWith('/product/')){
    const slug = path.replace('/product/','').replace(/\/$/,'');
    const found = state.products.find(p => slugify(p.name) === slug);
    if(found){ openProduct(found.id, { skipHistory:true }); }
    else { pendingProductSlug = slug; }
    return;
  }
  const page = PATH_PAGES[path];
  if(page){ goPage(page, { skipHistory:true }); }
}
window.addEventListener('popstate', () => {
  closeSheet();
  routeFromURL();
});

let shopHasRenderedOnce = false;
function renderShop(){
  if(currentPage !== 'shop') return;
  const grid = document.getElementById('shopGrid');
  if(!grid) return;

  if(!state.productsLoaded){
    grid.style.opacity = '1';
    grid.innerHTML = Array(2).fill(0).map(()=>`
      <div class="cat-heading"><div class="bar" style="background:var(--panel-2);"></div><div class="skel-line" style="width:110px;height:15px;"></div></div>
      <div class="prod-grid">
        ${Array(4).fill(0).map(()=>'<div class="skel-card"><div class="skel-img"></div><div class="skel-line" style="width:75%;height:12px;margin-top:9px;"></div><div class="skel-line" style="width:100%;height:28px;border-radius:9px;margin-top:9px;"></div></div>').join('')}
      </div>
    `).join('');
    return;
  }

  if(!shopHasRenderedOnce){
    grid.style.transition = 'opacity 0.35s ease';
    grid.style.opacity = '0';
  }

  const q = (document.getElementById('searchInput').value || '').toLowerCase();
  const activeProducts = state.products.filter(p => p.active !== false);
  const productCatNames = [...new Set(activeProducts.map(p=>p.category))];
  const orderedCatNames = state.categories.length
    ? [...state.categories.map(c=>c.name), ...productCatNames.filter(n => !state.categories.some(c=>c.name===n))]
    : productCatNames;

  let html = '';

  orderedCatNames.forEach(cat => {
    let items = activeProducts.filter(p=>p.category===cat);
    if(q) items = items.filter(p=>p.name.toLowerCase().includes(q));
    if(items.length === 0) return;
    const catMeta = state.categories.find(c=>c.name===cat);
    html += '<div class="cat-heading"><div class="bar"></div><h3>' + (catMeta?.icon ? catMeta.icon+' ' : '') + escapeHtml(cat) + '</h3><div class="line"></div></div>';
    html += '<div class="prod-grid">' + items.map(renderProductCard).join('') + '</div>';
  });

  if(!html){
    html = '<div class="empty"><div class="em-icon">🔍</div><div class="em-title">Pa gen rezilta</div>Eseye yon lòt rechèch.</div>';
  }
  grid.innerHTML = html;
  if(!shopHasRenderedOnce){
    requestAnimationFrame(() => { grid.style.opacity = '1'; });
    shopHasRenderedOnce = true;
  } else {
    grid.style.opacity = '1';
  }
}
function renderProductCard(p){
  const coverStyle = p.image
    ? 'background-image:url(\'' + p.image.replace(/'/g,"") + '\');background-size:cover;background-position:center;'
    : 'background:linear-gradient(150deg, rgba(15,166,84,0.14), rgba(15,166,84,0.04));';

  if(p.type === 'calculator'){
    return '<div class="prod-card" onclick="openProduct(\'' + p.id + '\')">' +
      '<div class="prod-cover" style="' + coverStyle + '">' +
        (p.image ? '' : '<span style="font-size:32px;">' + p.icon + '</span>') +
        (p.badge ? '<span class="prod-badge hot">' + escapeHtml(p.badge) + '</span>' : '') +
      '</div>' +
      '<div class="prod-body">' +
        '<div class="prod-name">' + escapeHtml(p.name) + '</div>' +
        '<button class="buy-btn" style="width:100%;margin-top:8px;" onclick="event.stopPropagation();openProduct(\'' + p.id + '\')">Voir</button>' +
      '</div>' +
    '</div>';
  }

  const totalStock = p.type === 'pin'
    ? p.variants.reduce((s,v) => s + ((state.inventory[v.id]||[]).filter(x=>x.status==='dispo').length), 0)
    : 1; // form-type products are manually processed — never "out of stock"
  return '<div class="prod-card" onclick="openProduct(\'' + p.id + '\')">' +
    '<div class="prod-cover" style="' + coverStyle + '">' +
      (p.image ? '' : '<span style="font-size:32px;">' + p.icon + '</span>') +
      (totalStock===0 ? '<span class="prod-badge" style="color:#fff;background:var(--red);font-size:8px;">EN RUPTURE DE STOCK</span>' : (p.badge ? '<span class="prod-badge hot">' + escapeHtml(p.badge) + '</span>' : '')) +
    '</div>' +
    '<div class="prod-body">' +
      '<div class="prod-name">' + escapeHtml(p.name) + '</div>' +
      '<button class="buy-btn" style="width:100%;margin-top:8px;" onclick="event.stopPropagation();openProduct(\'' + p.id + '\')">Voir</button>' +
    '</div>' +
  '</div>';
}

  if(p.type === 'pin'){
    fetchStockCountsForShop().then(() => { if(viewingProductId === productId && currentPage === 'product') render(); });
  }

let productPageRetried = false;
function normalizeDescBlock(d){
  if(typeof d === 'string') return { text:d, position:'above', bg:'', bold:false, italic:false, underline:false, color:'', fontSize:13 };
  return { text:d.text||'', position:d.position||'above', bg:d.bg||'', bold:!!d.bold, italic:!!d.italic, underline:!!d.underline, color:d.color||'', fontSize:d.fontSize||13 };
}
function renderDescriptionBlocks(p, position){
  return (p.descriptions||[]).map(normalizeDescBlock)
    .filter(d => d.position === position && d.text.trim())
    .map(d => {
      const styles = [
        'line-height:1.6','white-space:pre-wrap','margin:8px 0','padding:'+(d.bg?'10px 12px':'0'),
        'border-radius:'+(d.bg?'10px':'0'),
        'font-size:'+d.fontSize+'px',
        d.bg ? 'background:'+d.bg : '',
        d.color ? 'color:'+d.color : 'color:var(--text)',
        d.bold ? 'font-weight:700' : '',
        d.italic ? 'font-style:italic' : '',
        d.underline ? 'text-decoration:underline' : ''
      ].filter(Boolean).join(';');
      return `<div style="${styles};">${escapeHtml(d.text)}</div>`;
    }).join('');
}

async function confirmFormOrder(productId){
  if(!isLoggedIn()){
    openAuthModal('login');
    pendingAction = () => confirmFormOrder(productId);
    return;
  }
  const p = state.products.find(x=>x.id===productId);
  const v = p.variants.find(x=>x.id===selectedVariantId);
  if(!v){ showToast('Chwazi yon opsyon'); return; }
  const fields = p.formFields || [];
  const collected = {};
  for(let i=0;i<fields.length;i++){
    const val = (document.getElementById('formField-'+i)?.value || '').trim();
    if(fields[i].required && !val){ showToast('Ranpli chan "' + fields[i].label + '"'); return; }
    collected[fields[i].label] = val;
  }
  if(walletBalance() < v.price){ showToast('Balans ou pa ase — rechaje Wallet la'); return; }
  const order = {
    id: uid(), orderNo: nextOrderNo(), type:'form', status:'en_cours',
    product: p.name, variant: v.label, price: v.price,
    fields: collected, date: new Date().toISOString()
  };
  if(!state.orders[state.currentUserId]) state.orders[state.currentUserId] = [];
  state.orders[state.currentUserId].unshift(order);
  await insertOrderToServer(order, state.currentUserId);
  await applyWalletChange(state.currentUserId, -v.price, p.name+' — '+v.label, 'out');
  await saveState();
  showToast('Kòmand voye — Admin ap trete l');
  goPage('commandes');
}

async function claimPinFromServer(variantId){
  try{
    const sb = await getSupabase();
    const { data: code, error } = await sb.rpc('claim_pin', { p_variant_id: variantId });
    if(error) throw error;
    if(!code) return { ok:false, offline:false };
    return { ok:true, code, offline:false };
  }catch(e){
    return { ok:false, offline:true }; // Supabase unreachable
  }
}

async function confirmPurchase(productId){
  if(!isLoggedIn()){
    openAuthModal('login');
    pendingAction = () => confirmPurchase(productId);
    return;
  }
  const p = state.products.find(x=>x.id===productId);
  const v = p.variants.find(x=>x.id===selectedVariantId);
  if(!v){ showToast('Chwazi yon opsyon'); return; }
  if(walletBalance() < v.price){
    showToast('Balans ou pa ase — rechaje Wallet la');
    return;
  }

  const claim = await claimPinFromServer(v.id);
  let pinCode = null;

  if(claim.ok){
    pinCode = claim.code;
    // keep the local mirror in sync so stock counters on the shop page stay correct
    const local = (state.inventory[v.id] || []).find(x => x.code === pinCode);
    if(local) local.status = 'vann';
  } else if(claim.offline){
    // Supabase unreachable — fall back to local-only stock (not cross-device safe right now)
    const stockList = state.inventory[v.id] || [];
    const availablePin = stockList.find(x=>x.status==='dispo');
    if(!availablePin){ showToast('Stock fini. Tanpri retounen pita.'); return; }
    availablePin.status = 'vann';
    pinCode = availablePin.code;
  } else {
    showToast('Stock fini. Tanpri retounen pita.');
    fetchPinsFromServer();
    return;
  }

  // payment confirmed — deduct + dispense
  const order = {
    id: uid(), orderNo: nextOrderNo(), type:'pin', status:'terminee',
    product: p.name, variant: v.label, price: v.price,
    pin: pinCode, date: new Date().toISOString()
  };
  if(!state.orders[state.currentUserId]) state.orders[state.currentUserId] = [];
  state.orders[state.currentUserId].unshift(order);
  await insertOrderToServer(order, state.currentUserId);
  await applyWalletChange(state.currentUserId, -v.price, p.name+' — '+v.label, 'out');
  try{ await incrementRewardProgress(state.currentUserId, v.id); }catch(e){ console.warn('Kerry Rewards hook failed (non-blocking):', e); }
  await saveState();
  showToast('Acha reyisi! Gade nan Mes Commandes');
  goPage('commandes');
}

/* ---- Proof-of-payment screenshot check (best-effort OCR — Admin still makes the final call) ---- */
function loadTesseract(){
  return new Promise((resolve, reject) => {
    if(window.Tesseract){ resolve(); return; }
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.1/tesseract.min.js';
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('load failed'));
    document.head.appendChild(s);
  });
}
async function runProofOcr(file, amount, txn, ref){
  await loadTesseract();
  const { data } = await Tesseract.recognize(file, 'eng');
  const text = data.text || '';
  const confidence = data.confidence || 0;
  const cleanUpper = text.toUpperCase().replace(/\s+/g,' ');
  const digitsOnly = text.replace(/\D/g,'');

  // photo quality: low OCR confidence or almost no readable text = can't verify seriously
  const qualityOk = confidence >= 35 && text.trim().length >= 15;

  // receipt type detection (SMS receipts never show the "kontni"/référence field)
  const isSmsReceipt = /TRANSCODE/i.test(text) || /\bBALANS\s*OU\b/i.test(text) || /\bFRE\s*:/i.test(text);
  const isAppReceipt = /\bKONTNI\b/i.test(text) || /ID\s*TRANZAKSYON/i.test(text) || /TRANZAKSYON\s*AVEK\s*SIKS/i.test(text);
  const receiptType = isSmsReceipt && !isAppReceipt ? 'sms' : (isAppReceipt ? 'app' : 'inconnu');

  // exact matches only for money-critical fields — no fuzzy tolerance here
  const txnDigits = (txn||'').replace(/\D/g,'');
  const txnOk = txnDigits ? digitsOnly.includes(txnDigits) : false;
  const amountOk = amount ? new RegExp('\\b' + Math.round(amount) + '\\b').test(digitsOnly + ' ' + text.replace(/[.,]00/g,'')) : false;

  // tolerant matches (case/spacing/accents) for name + receiver number
  const numberOk = digitsOnly.includes(state.paymentSettings.number);
  const nameNorm = cleanUpper.replace(/[^A-Z ]/g,'');
  const nameOk = nameNorm.includes('CADET') && (nameNorm.includes('VANSKERRY') || (nameNorm.includes('VANS') && nameNorm.includes('KERRY')));

  const dateMatch = text.match(/(\d{2})\/(\d{2})\/(\d{4})\D{0,15}?(\d{2}):(\d{2})(?::(\d{2}))?/);
  let timeOk = null, minutesAgo = null;
  if(dateMatch){
    const [, dd, mm, yyyy, hh, min, ss] = dateMatch;
    const txnDate = new Date(+yyyy, +mm-1, +dd, +hh, +min, ss?+ss:0);
    minutesAgo = Math.round((Date.now() - txnDate.getTime()) / 60000);
    timeOk = minutesAgo >= -2 && minutesAgo <= 10;
  }

  // référence: only required/checked when the receipt format actually shows it (App receipts)
  const refApplicable = receiptType === 'app';
  const refDigits = (ref||'').replace(/\D/g,'');
  const refOk = refApplicable ? (refDigits ? digitsOnly.includes(refDigits) : false) : null;

  return { receiptType, qualityOk, confidence, numberOk, nameOk, amountOk, txnOk, timeOk, minutesAgo, refApplicable, refOk };
}
async function hashFile(file){
  const buf = await file.arrayBuffer();
  const digest = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

  box.style.display = 'flex';

    disp.style.color = 'var(--red)';

  const m = Math.floor(remaining/60000);

  disp.textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');

async function submitRecharge(){
  const amount = parseFloat(document.getElementById('rcAmount').value);
  const txn = document.getElementById('rcTxn').value.trim();
  lastRechargeAttempt = { amount, txn };
  const file = document.getElementById('rcProofImage').files[0];
  const resultBox = document.getElementById('rcOcrResult');
  const btn = document.getElementById('rcSubmitBtn');
  if(!amount || amount<=0){ showToast('Antre yon montan valid'); return; }
  if(!txn){ showToast('Antre TXN ID lan'); return; }
  if(!file){ showToast('Ajoute yon foto rezi tranzaksyon an'); return; }
  if(rcTimerExpired){ showToast('Délai expiré — voye sou WhatsApp'); return; }

  const ref = currentRechargeRef;

  // fraud pre-checks (no OCR needed)
  if(state.usedTxnIds.includes(txn)){
    resultBox.innerHTML = `<div class="card" style="border-color:var(--red);"><div style="color:var(--red);font-weight:700;">TXN ID sa a deja itilize.</div></div>`;
    showToast('TXN ID deja itilize');
    return;
  }

  if(btn){ btn.disabled = true; btn.textContent = 'Ap verifye foto a...'; }
  resultBox.innerHTML = '<div style="font-size:12px;color:var(--muted);">⏳ Ap li foto a, tanpri tann...</div>';

  const receiptHash = await hashFile(file).catch(()=>null);
  if(receiptHash && state.usedReceiptHashes.includes(receiptHash)){
    resultBox.innerHTML = `<div class="card" style="border-color:var(--red);"><div style="color:var(--red);font-weight:700;">Resi sa a deja itilize pou yon lòt demand.</div></div>`;
    if(btn){ btn.disabled = false; btn.textContent = 'Envoyer la demande'; }
    showToast('Resi deja itilize');
    return;
  }

  let checks = null;
  try{ checks = await runProofOcr(file, amount, txn, ref); }catch(e){ checks = null; }

  const allGood = !!checks && checks.qualityOk && checks.numberOk && checks.nameOk &&
    checks.amountOk && checks.txnOk && checks.timeOk === true &&
    (checks.refApplicable ? checks.refOk === true : true);

  const req = {
    id: uid(), userId: state.currentUserId, amount, txnId: txn, ref,
    status: allGood ? 'approved' : 'a_verifier',
    date: new Date().toISOString(), ocrChecks: checks, receiptHash
  };

  // Try to insert directly with the intended status. The database's unique
  // constraints (on txn_id/ref/receipt_hash where status='approved') are the
  // real atomicity guarantee here — even two devices submitting at the exact
  // same moment can't both land on 'approved' for the same txn/ref/receipt.
  let insertOk = false, wasDuplicate = false;
  try{
    const sb = await getSupabase();
    const { error } = await sb.from('recharge_requests').insert({
      id: req.id, user_id: req.userId, amount: req.amount, txn_id: req.txnId, ref: req.ref,
      status: req.status, ocr_checks: req.ocrChecks, receipt_hash: req.receiptHash
    });
    if(error){
      if(error.code === '23505'){ wasDuplicate = true; }
      else{ throw error; }
    } else {
      insertOk = true;
    }
  }catch(e){
    // Supabase unreachable — fall back to local-only bookkeeping so the app still works offline
    console.warn('recharge_requests insert failed:', e?.message || e?.error_description || e?.code || JSON.stringify(e) || e);
    insertOk = 'local';
  }

  if(wasDuplicate){
    // the DB rejected it as a duplicate — downgrade to a_verifier, never credit
    req.status = 'a_verifier';
    try{
      const sb = await getSupabase();
      await sb.from('recharge_requests').insert({
        id: uid(), user_id: req.userId, amount: req.amount, txn_id: req.txnId, ref: req.ref,
        status: 'a_verifier', ocr_checks: req.ocrChecks, receipt_hash: req.receiptHash
      });
    }catch(e){}
  }

  state.rechargeRequests.unshift(req);
  const finalApproved = req.status === 'approved' && !wasDuplicate;

  if(finalApproved){
    await applyWalletChange(state.currentUserId, amount, 'Rechaj NatCash (oto-verifye) — Ref '+ref, 'in');
    state.usedTxnIds.push(txn);
    state.usedRefs.push(ref);
    if(receiptHash) state.usedReceiptHashes.push(receiptHash);
    resultBox.innerHTML = `<div class="card" style="border-color:var(--green);"><div style="color:var(--green);font-weight:700;">✅ Wallet kredite! Nouvo balans: ${money(walletBalance())}</div></div>`;
    const balDisplay = document.getElementById('walletBalanceDisplay');
    if(balDisplay) balDisplay.textContent = money(walletBalance());
    showToast('Wallet kredite ✓');
    sendConfirmationEmail(req);
    resetRechargeFlow();
    if(returnToCheckoutAfterRecharge){
      returnToCheckoutAfterRecharge = false;
      setTimeout(() => goPage('checkout'), 1200);
    }
  } else if(wasDuplicate){
    resultBox.innerHTML = `<div class="card" style="border-color:var(--red);"><div style="color:var(--red);font-weight:700;">TXN ID, referans, oswa resi sa a deja itilize pou yon lòt demand.</div></div>`;
    showToast('Deja itilize');
    if(btn){ btn.disabled = false; btn.textContent = 'Envoyer la demande'; }
  } else {
    resultBox.innerHTML = `<div class="card" style="border-color:var(--amber);"><div style="color:var(--amber);font-weight:700;margin-bottom:4px;">Nou pa t kapab verifye peman an otomatikman.</div><div style="font-size:11.5px;color:var(--muted);margin-bottom:10px;">Tanpri voye demann lan sou WhatsApp oswa tann revizyon administratè a.</div><button class="btn" style="background:#25D366;color:#fff;width:100%;" onclick="sendRechargeWhatsApp()">Envoyer sur WhatsApp</button></div>`;
    showToast('Admin ap verifye kòmand ou');
    if(btn){ btn.disabled = false; btn.textContent = 'Envoyer la demande'; }
  }

  await saveState();
  document.getElementById('rcAmount').value=''; document.getElementById('rcTxn').value='';
  renderMyRequests();
  renderTopIcons();
}

async function submitTransfer(){
  const email = document.getElementById('trEmail').value.trim().toLowerCase();
  const amount = parseFloat(document.getElementById('trAmount').value);
  if(!email || !amount || amount<=0){ showToast('Ranpli tout chan yo kòrèkteman'); return; }
  if(walletBalance() < amount){ showToast('Balans ou pa ase'); return; }
  const senderName = currentUser().name;
  try{
    const sb = await getSupabase();
    const { data: recipientId, error: lookupErr } = await sb.rpc('find_user_id_by_email', { p_email: email });
    if(lookupErr) throw lookupErr;
    if(!recipientId){ showToast('Pa gen itilizatè ak imèl sa a'); return; }
    if(recipientId === state.currentUserId){ showToast('Ou pa ka transfere pou tèt ou'); return; }
    const targetLocal = state.users.find(u=>u.id===recipientId);
    const recipientName = targetLocal ? targetLocal.name : email.split('@')[0];
    const { error: transferErr } = await sb.rpc('transfer_wallet', {
      recipient_id: recipientId, amount,
      sender_label: 'Transfè bay '+recipientName,
      recipient_label: 'Transfè resevwa nan men '+senderName
    });
    if(transferErr){ showToast('Erè: ' + transferErr.message); return; }
    await fetchWalletFromServer(state.currentUserId);
    render();
    showToast('Transfè reyisi');
  }catch(e){

function addPinToCart(productId){
  const p = state.products.find(x=>x.id===productId);
  const v = p.variants.find(x=>x.id===selectedVariantId);
  if(!v){ showToast('Chwazi yon opsyon'); return; }
  const existing = state.cart.find(i => i.type==='pin' && i.variantId===v.id);
  if(existing){
    existing.qty += 1;
    existing.price = existing.unitPrice * existing.qty;
  } else {
    state.cart.push({ id:uid(), productId:p.id, productName:p.name, type:'pin', variantId:v.id, variantLabel:v.label, unitPrice:v.price, qty:1, price:v.price, fields:null });
  }

  saveCartToServer();
  renderTopIcons();
  showToast('Ajoute nan panye ✓');
  goPage('shop');
}
function addFormToCart(productId){
  const p = state.products.find(x=>x.id===productId);
  const v = p.variants.find(x=>x.id===selectedVariantId);
  if(!v){ showToast('Chwazi yon opsyon'); return; }
  const fields = p.formFields || [];
  const collected = {};
  for(let i=0;i<fields.length;i++){
    const val = (document.getElementById('formField-'+i)?.value || '').trim();
    if(fields[i].required && !val){ showToast('Ranpli chan "' + fields[i].label + '"'); return; }
    collected[fields[i].label] = val;
  }
  state.cart.push({ id:uid(), productId:p.id, productName:p.name, type:'form', variantId:v.id, variantLabel:v.label, price:v.price, fields:collected });
  saveState();
  saveCartToServer();
  renderTopIcons();
  showToast('Ajoute nan panye ✓');
  goPage('shop');
}
function changeCartQty(itemId, delta){
  const item = state.cart.find(i=>i.id===itemId);
  if(!item || item.type!=='pin') return;
  item.qty = Math.max(1, item.qty + delta);
  item.price = item.unitPrice * item.qty;
  saveState();
  saveCartToServer();
  render();
}
function removeFromCart(itemId){
  state.cart = state.cart.filter(i=>i.id!==itemId);

  if(walletBalance() < total){ showToast('Balans ou pa ase pou tout panye a — rechaje Wallet la'); return; }
  const itemsToProcess = [...state.cart];
  const failed = [];
  const manualOrdersCreated = [];
  let processedAmount = 0;
  let processedCount = 0;
  for(const item of itemsToProcess){
    if(item.type === 'pin'){
      let claimedCount = 0;
      for(let n=0; n<item.qty; n++){
        const claim = await claimPinFromServer(item.variantId);
        let pinCode = null;
        if(claim.ok){
          pinCode = claim.code;
          const local = (state.inventory[item.variantId] || []).find(x => x.code === pinCode);
          if(local) local.status = 'vann';
        } else if(claim.offline){
          const stockList = state.inventory[item.variantId] || [];
          const availablePin = stockList.find(x=>x.status==='dispo');
          if(!availablePin) break;
          availablePin.status = 'vann';
          pinCode = availablePin.code;
        } else {
          break;
        }
        const order = {
          id: uid(), orderNo: nextOrderNo(), type:'pin', status:'terminee',
          product: item.productName, variant: item.variantLabel, price: item.unitPrice,
          pin: pinCode, date: new Date().toISOString()
        };
        if(!state.orders[state.currentUserId]) state.orders[state.currentUserId] = [];
        state.orders[state.currentUserId].unshift(order);
        await insertOrderToServer(order, state.currentUserId);
        claimedCount++;
        try{ await incrementRewardProgress(state.currentUserId, item.variantId); }catch(e){ console.warn('Kerry Rewards hook failed (non-blocking):', e); }
      }
      if(claimedCount > 0){ processedAmount += claimedCount * item.unitPrice; processedCount++; }
      if(claimedCount < item.qty){
        item.qty = item.qty - claimedCount;
        item.price = item.unitPrice * item.qty;
        failed.push(item);
      }
    } else {
      const order = {
        id: uid(), orderNo: nextOrderNo(), type:item.type, status:'en_cours',
        product: item.productName, variant: item.variantLabel, price: item.price,
        fields: item.fields, montantUSD: item.montantUSD || null, date: new Date().toISOString()
      };
      if(!state.orders[state.currentUserId]) state.orders[state.currentUserId] = [];
      state.orders[state.currentUserId].unshift(order);
      await insertOrderToServer(order, state.currentUserId);
      processedAmount += item.price;
      processedCount++;
      manualOrdersCreated.push(order);
    }
  }
  if(processedAmount > 0){
    await applyWalletChange(state.currentUserId, -processedAmount, 'Panye — ' + processedCount + ' atik', 'out');
  }
  state.cart = failed; // keep unfulfilled units in cart so the customer can retry or remove them
  await saveState();
  await saveCartToServer();
  render();
  if(failed.length > 0){
    showToast(failed.length + ' atik pa disponib — yo rete nan panye a');
  } else {
    showToast('Acha reyisi! Gade nan Mes Commandes');
    if(manualOrdersCreated.length > 0){
      notifyAdminOfManualOrders(manualOrdersCreated);
    }
    goPage('commandes');
  }
}
function sendNtfyNotification(title, message){
  const topic = state.paymentSettings.ntfyTopic;
  if(!topic) return;
  try{
    fetch('https://ntfy.sh/' + topic, {
      method: 'POST',
      body: message,
      headers: { 'Title': title, 'Priority': 'high' }
    });
  }catch(e){ /* best-effort — no notification service configured or unreachable */ }
}

let clientSearchTerm = '';
async function searchClientByEmail(){
  const val = document.getElementById('clientSearchInput').value.trim().toLowerCase();
  if(!val) return;
  clientSearchTerm = val;
  if(!val.includes('@')){ renderAdminTab(); return; } // plain name filter, no lookup needed
  try{
    const sb = await getSupabase();
    const { data: foundId } = await sb.rpc('find_user_id_by_email', { p_email: val });
    if(foundId){
      let u = state.users.find(x=>x.id===foundId);
      if(!u){
        const { data: profile } = await sb.from('profiles').select('*').eq('id', foundId).single();
        u = { id:foundId, name: profile?.name || val.split('@')[0], email: val, googlePhoto:null };
        state.users.push(u);
      } else {
        u.email = val;
      }
      const { data: walletRow } = await sb.from('wallets').select('*').eq('user_id', foundId).single();
      if(walletRow) state.wallets[foundId] = Number(walletRow.balance) || 0;
      showToast('Kliyan jwenn ✓');
    } else {
      showToast('Pa gen kont ak imèl sa a');
    }
  }catch(e){
    console.warn('searchClientByEmail failed:', e?.message || e);
    showToast('Erè pandan rechèch la');
  }
  renderAdminTab();
}
async function adminAdjustWallet(userId, sign){
  const amtInput = document.getElementById('adjAmt-'+userId);
  const labelInput = document.getElementById('adjLabel-'+userId);
  const amt = parseFloat(amtInput.value);
  const label = labelInput.value.trim() || (sign>0 ? 'Ajistman Admin (kredi)' : 'Ajistman Admin (debi)');
  if(!amt || amt<=0){ showToast('Antre yon montan valid'); return; }
  const u = state.users.find(x=>x.id===userId);
  await applyWalletChange(userId, sign*amt, label, sign>0?'in':'out');
  logActivity((sign>0?'Kredite ':'Debite ') + money(amt) + ' sou kont ' + (u?u.name:userId) + ' — ' + label);
  amtInput.value = ''; labelInput.value = '';
  renderAdminTab();
  showToast('Wallet mete ajou ✓');
}
async function fetchAllUsersFromServer(){
  try{
    const sb = await getSupabase();
    const { data: profiles } = await sb.from('profiles').select('*');
    const { data: wallets } = await sb.from('wallets').select('*');
    if(profiles){
      profiles.forEach(p => {
        let u = state.users.find(x=>x.id===p.id);
        if(!u){
          u = { id:p.id, name:p.name, email:p.email||'', googlePhoto:null };
          state.users.push(u);
        } else if(!u.name){
          u.name = p.name;
        }
      });
    }
    if(wallets){
      wallets.forEach(w => { state.wallets[w.user_id] = Number(w.balance)||0; });
    }
    renderAdminTab();
  }catch(e){ console.warn('fetchAllUsersFromServer failed:', e?.message || e); }

async function fetchPinsFromServer(){
  try{
    const sb = await getSupabase();
    const variantIds = state.products.filter(p=>p.type!=='calculator').flatMap(p=>(p.variants||[]).map(v=>v.id));
    if(variantIds.length===0) return;
    const { data } = await sb.from('pins').select('*').in('variant_id', variantIds);
    if(data){
      const byVariant = {};
      data.forEach(row => {
        if(!byVariant[row.variant_id]) byVariant[row.variant_id] = [];
        byVariant[row.variant_id].push({ id: row.id, code: row.code, status: row.status });
      });
      variantIds.forEach(vid => { state.inventory[vid] = byVariant[vid] || []; });
      renderAdminTab();
      renderShop();
    }
  }catch(e){ /* offline — keep showing local counts */ }
}
async function fetchStockCountsForShop(){
  try{
    const sb = await getSupabase();
    const variantIds = state.products.filter(p=>p.type!=='calculator').flatMap(p=>(p.variants||[]).map(v=>v.id));
    if(variantIds.length===0) return;
    const { data, error } = await sb.rpc('get_stock_counts', { p_variant_ids: variantIds });
    if(error) throw error;
    const counts = {};
    (data||[]).forEach(row => { counts[row.variant_id] = Number(row.available_count); });
    variantIds.forEach(vid => {
      const n = counts[vid] || 0;
      // build a dummy dispo-status array of the right length — customers never see real codes here
      state.inventory[vid] = Array.from({length:n}, () => ({ code:null, status:'dispo' }));
    });
    renderShop();
  }catch(e){ console.warn('fetchStockCountsForShop failed:', e?.message || e?.error_description || e?.code || JSON.stringify(e) || e); }
}

async function addProduct(){
  const type = document.getElementById('npType').value;
  const name = document.getElementById('npName').value.trim();
  const cat = document.getElementById('npCat').value.trim() || (state.categories[0]?.name || 'Divès');
  const icon = document.getElementById('npIcon').value.trim() || '🎮';
  const image = document.getElementById('npImage').value.trim();
  const description = document.getElementById('npDesc').value.trim();
  if(!name){ showToast('Antre non pwodwi a'); return; }
  if(!image){ showToast('Foto pwodwi a obligatwa'); return; }
  if(!description){ showToast('Deskripsyon an obligatwa'); return; }
  const base = { id: uid(), name, category:cat, icon, image, description, popular:false, active:true, type };
  if(type === 'calculator'){
    base.manualConfig = { taux:145, frais:0, min:5, max:500, fields:[], feeTiers:[] };
  } else {
    const variantRaw = document.getElementById('npVariant').value.trim();
    if(!variantRaw){ showToast('Antre premye opsyon (Non,Pri)'); return; }
    const [vLabel, vPrice] = variantRaw.split(',').map(s=>s.trim());
    if(!vLabel || !vPrice){ showToast('Fòma opsyon: Non,Pri'); return; }
    base.variants = [{id:uid(), label:vLabel, price:parseFloat(vPrice)}];
    if(type === 'form'){ base.formFields = []; }
  }
  try{
    const sb = await getSupabase();
    const { data: inserted } = await sb.from('products').insert({
      name, category:cat, icon, image, description, type, popular:false, active:true,
      form_fields: type==='form' ? [] : []
    }).select().single();
    if(inserted){
      base.id = inserted.id;
      if(type === 'calculator'){
        await sb.from('manual_configs').insert({ product_id:base.id, taux:145, frais:0, min_amount:5, max_amount:500, fields:[], fee_tiers:[] });
      } else {
        const { data: vIns } = await sb.from('variants').insert({ product_id:base.id, label:base.variants[0].label, price:base.variants[0].price }).select().single();
        if(vIns) base.variants[0].id = vIns.id;
      }
    }
  }catch(e){ /* offline — product stays local-only until next sync */ }
  state.products.push(base);
  logActivity('Ajoute pwodwi '+name);
  selectedProductMode = 'pin';
  await saveState(); renderAdminTab(); showToast('Pwodwi ajoute');
}

async function addFeeTier(pid){
  const p = state.products.find(x=>x.id===pid);
  if(!p.manualConfig.feeTiers) p.manualConfig.feeTiers = [];
  const min = parseFloat(document.getElementById('ftMin-'+pid).value);
  const max = parseFloat(document.getElementById('ftMax-'+pid).value);

function feeForAmount(manualConfig, amount){
  const tiers = manualConfig.feeTiers || [];
  const match = tiers.find(t => amount >= t.min && amount <= t.max);
  if(match) return match.fee;
  return manualConfig.frais || 0; // fallback to flat fee if no tier matches
}

async function uploadImageToStorage(file){
  try{
    const sb = await getSupabase();
    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
    const path = 'uploads/' + uid() + '.' + ext;
    const { error } = await sb.storage.from('images').upload(path, file);
    if(error) throw error;
    const { data } = sb.storage.from('images').getPublicUrl(path);
    return data.publicUrl;
  }catch(e){
    showToast('Erè upload foto: ' + (e && e.message ? e.message : 'erè enkoni'));
    return null;
  }
}

async function addPinToModal(){
  const input = document.getElementById('pinModalInput');
  const errBox = document.getElementById('pinModalError');
  const code = input.value.trim();
  errBox.textContent = '';
  if(!code){ errBox.textContent = 'Antre yon kòd PIN.'; return; }
  if(!state.inventory[pinModalVariantId]) state.inventory[pinModalVariantId] = [];
  const dup = state.inventory[pinModalVariantId].some(x => x.code === code);
  if(dup){ errBox.textContent = 'PIN sa a deja egziste nan kategori sa a — pa ajoute de fwa.'; return; }
  try{
    const sb = await getSupabase();
    const { error } = await sb.from('pins').insert({ variant_id: pinModalVariantId, code, status:'dispo' });
    if(error){
      if(error.code === '23505'){ errBox.textContent = 'PIN sa a deja egziste nan kategori sa a — pa ajoute de fwa.'; return; }
      throw error;
    }
  }catch(e){ /* offline — still add locally, will need a manual re-sync later */ }
  state.inventory[pinModalVariantId].push({ code, status:'dispo' });
  pinModalAddedCount++;
  document.getElementById('pinModalCount').textContent = pinModalAddedCount + ' PIN ajoute nan sesyon sa a';
  input.value = '';
  input.focus();
  await saveState();
}
async function approveRecharge(id){
  const r = state.rechargeRequests.find(x=>x.id===id);
  if(r.status === 'approved'){ showToast('Deja apwouve'); return; }
  try{
    const sb = await getSupabase();
    const { error } = await sb.from('recharge_requests').update({ status:'approved' }).eq('id', id);
    if(error && error.code === '23505'){
      showToast('Refize: TXN ID/referans/resi sa deja apwouve pou yon lòt demand');
      return;
    }
  }catch(e){ /* offline — proceed with local-only approval */ }
  r.status = 'approved';
  await applyWalletChange(r.userId, r.amount, 'Rechaj NatCash', 'in');
  if(!state.usedTxnIds.includes(r.txnId)) state.usedTxnIds.push(r.txnId);
  if(r.ref && !state.usedRefs.includes(r.ref)) state.usedRefs.push(r.ref);
  if(r.receiptHash && !state.usedReceiptHashes.includes(r.receiptHash)) state.usedReceiptHashes.push(r.receiptHash);
  logActivity('Apwouve rechaj #'+r.id.slice(0,6)+' — '+money(r.amount));
  await saveState(); renderAdminTab(); showToast('Rechaj apwouve');
}

/* ===== PWA Install Banner ===== */
let deferredInstallPrompt = null;
const INSTALL_DISMISS_KEY = 'kt_install_dismissed_until';

function setupPWAManifest(){
  try{
    const logoImg = document.querySelector('.logo-mark img');
    const iconSrc = logoImg ? logoImg.src : '';
    const manifest = {
      name: "Kerry Topup Official",
      short_name: "Kerry Topup",
      start_url: "/",
      display: "standalone",
      background_color: "#0A0D09",
      theme_color: "#0FA654",
      icons: iconSrc ? [
        { src: iconSrc, sizes: "192x192", type: "image/png" },
        { src: iconSrc, sizes: "512x512", type: "image/png" }
      ] : []
    };
    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = url;
    document.head.appendChild(link);
  }catch(e){ console.warn('setupPWAManifest failed:', e); }
}
function registerServiceWorker(){
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('/sw.js').catch(e => console.warn('SW registration failed:', e));
  }
}
function isAlreadyInstalled(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
function showInstallBannerIfEligible(){
  if(isAlreadyInstalled()) return;
  const dismissedUntil = parseInt(localStorage.getItem(INSTALL_DISMISS_KEY) || '0', 10);
  if(Date.now() < dismissedUntil) return;
  if(!deferredInstallPrompt) return;
  const banner = document.getElementById('installBanner');
  if(banner) banner.style.display = 'flex';
}
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  showInstallBannerIfEligible();
});
window.addEventListener('appinstalled', () => {
  const banner = document.getElementById('installBanner');
  if(banner) banner.style.display = 'none';
  deferredInstallPrompt = null;
});
async function triggerPWAInstall(){
  const banner = document.getElementById('installBanner');
  if(!deferredInstallPrompt){ if(banner) banner.style.display = 'none'; return; }
  deferredInstallPrompt.prompt();
  const choice = await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  if(banner) banner.style.display = 'none';
}
function dismissInstallBanner(){
  const banner = document.getElementById('installBanner');
  if(banner) banner.style.display = 'none';
  localStorage.setItem(INSTALL_DISMISS_KEY, String(Date.now() + 7*24*60*60*1000));
}
setupPWAManifest();
registerServiceWorker();

let wasOffline = false;
let snakeInterval = null;
function updateOfflineOverlay(){
  const overlay = document.getElementById('offlineOverlay');
  if(!overlay) return;
  if(!navigator.onLine){
    overlay.style.display = 'flex';
    wasOffline = true;
  } else if(wasOffline){
    stopSnakeGame();
    window.location.reload();
  }
}
window.addEventListener('offline', updateOfflineOverlay);
window.addEventListener('online', updateOfflineOverlay);

function toggleSnakeGame(){
  const box = document.getElementById('snakeGameBox');
  const btn = document.getElementById('snakeToggleBtn');
  if(box.style.display === 'none'){
    box.style.display = 'flex';
    btn.style.display = 'none';
    startSnakeGame();
  } else {
    box.style.display = 'none';
    btn.style.display = 'inline-block';
    stopSnakeGame();
  }
}
function stopSnakeGame(){
  if(snakeInterval){ clearInterval(snakeInterval); snakeInterval = null; }
}
function startSnakeGame(){
  const canvas = document.getElementById('snakeCanvas');
  const ctx = canvas.getContext('2d');
  const cell = 20, cols = 16, rows = 11;
  let snake, dir, nextDir, food, score, alive;

  function resetGame(){
    snake = [{x:5,y:5}];
    dir = {x:1,y:0};
    nextDir = {x:1,y:0};
    food = {x:8,y:5};
    score = 0;
    alive = true;
    document.getElementById('snakeScoreLabel').textContent = 'Score: 0';
    draw();
    stopSnakeGame();
    snakeInterval = setInterval(tick, 160);
  }
  function placeFood(){
    let ok = false;
    while(!ok){
      food = { x: Math.floor(Math.random()*cols), y: Math.floor(Math.random()*rows) };
      ok = !snake.some(s => s.x===food.x && s.y===food.y);
    }
  }
  function draw(){
    ctx.fillStyle = '#0E1109';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#00D26A';
    snake.forEach(s => ctx.fillRect(s.x*cell+1, s.y*cell+1, cell-2, cell-2));
    ctx.fillStyle = '#FFD34D';
    ctx.fillRect(food.x*cell+3, food.y*cell+3, cell-6, cell-6);
    if(!alive){
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 14px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('Game Over 😹', canvas.width/2, canvas.height/2 - 10);
      ctx.font = '12px Arial';
      ctx.fillText('Tapé pou rejwe', canvas.width/2, canvas.height/2 + 14);
    }
  }
  function tick(){
    if(!alive) return;
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if(head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows || snake.some(s => s.x===head.x && s.y===head.y)){
      alive = false;
      draw();
      stopSnakeGame();
      return;
    }
    snake.unshift(head);
    if(head.x === food.x && head.y === food.y){
      score += 10;
      document.getElementById('snakeScoreLabel').textContent = 'Score: ' + score;
      placeFood();
    } else {
      snake.pop();
    }
    draw();
  }
  function setDir(x,y){
    if(dir.x === -x && dir.y === -y) return; // no reversing into self
    nextDir = {x,y};
  }
  document.onkeydown = (e) => {
    if(document.getElementById('snakeGameBox').style.display === 'none') return;
    if(!alive){ resetGame(); return; }
    if(e.key==='ArrowUp') setDir(0,-1);
    else if(e.key==='ArrowDown') setDir(0,1);
    else if(e.key==='ArrowLeft') setDir(-1,0);
    else if(e.key==='ArrowRight') setDir(1,0);
  };
  let touchStartX = 0, touchStartY = 0;
  canvas.ontouchstart = (e) => { touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; };
  canvas.ontouchend = (e) => {
    if(!alive){ resetGame(); return; }
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if(Math.abs(dx) > Math.abs(dy)){ setDir(dx > 0 ? 1 : -1, 0); }
    else { setDir(0, dy > 0 ? 1 : -1); }
  };
  canvas.onclick = () => { if(!alive) resetGame(); };
  resetGame();
}
updateOfflineOverlay();

loadState();
goPage(currentPage, { skipHistory:true });
fetchProductsFromServer().then(() => fetchStockCountsForShop());
fetchTutorielContent();
fetchRewardPrograms();
fetchRewardSettings();
fetchInfoPages();
fetchPaymentSettings();
(async () => {
  await tryRestoreSupabaseSession();
  routeFromURL();
})();
</script>
