async function checkoutCart(){
  if(!isLoggedIn()){
    openAuthModal('login');
    pendingAction = () => checkoutCart();
    return;
  }
  if(blockIfSuspended()) return;
  const total = cartTotal();
  if(total <= 0){ return; }
  if(walletBalance() < total){ showToast('Balans ou pa ase pou tout panye a — rechaje Wallet la'); return; }
  const itemsToProcess = [...state.cart];
  const failed = [];
  const manualOrdersCreated = [];
  let processedAmount = 0;
  let processedCount = 0;
  for(const item of itemsToProcess){
    if(item.type === 'pin'){
      let claimedCount = 0;
      for(let n=0; n<item.qty; n++){
        try{
          const sb = await getSupabase();
          const { data: result, error } = await sb.rpc('purchase_pin_secure', { p_variant_id: item.variantId });
          if(error){
            if((error.message||'').includes('Balans')){ break; } // insufficient funds — stop, leave remaining qty in cart
            console.warn('purchase_pin_secure erè:', error.message);
            break;
          }
          const outOfStock = result.status === 'en_cours';
          const order = {
            id: result.order_id, orderNo: result.order_no, type:'pin', status: result.status,
            product: result.product_name, variant: result.variant_label, price: Number(result.price),
            pin: result.pin_code, date: new Date().toISOString()
          };
          if(!state.orders[state.currentUserId]) state.orders[state.currentUserId] = [];
          state.orders[state.currentUserId].unshift(order);

          const local = (state.inventory[item.variantId] || []).find(x => x.status === 'dispo');
          if(local) local.status = 'vann';

          if(outOfStock){
            sendNtfyNotification('Stock ' + order.product + ' - ' + order.variant + ' fini', 'Yon kliyan an atant pou opsyon sa a.', 'default', 'package');
            sendOrderReceivedEmail(order, currentUser());
          } else {
            checkStockAndNotifyIfEmpty(item.variantId, order.product, order.variant);
            sendOrderReceiptEmail(order, currentUser());
          }
          notifyAdminNewSale(order);
          claimedCount++;
        }catch(e){ console.warn('purchase_pin_secure exception:', e?.message||e); break; }
      }
      if(claimedCount > 0){ processedCount++; }
      if(claimedCount < item.qty){
        item.qty = item.qty - claimedCount;
        item.price = item.unitPrice * item.qty;
        failed.push(item);
      }
    } else if(item.type === 'calculator'){
      try{
        const sb = await getSupabase();
        const { data: result, error } = await sb.rpc('create_manual_order_secure', {
          p_product_id: item.productId, p_amount_usd: item.montantUSD, p_fields: item.fields || {}
        });
        if(error){ console.warn('create_manual_order_secure erè:', error.message); failed.push(item); continue; }
        const order = {
          id: result.order_id, orderNo: result.order_no, type:'calculator', status:'en_cours',
          product: result.product_name, variant: result.amount_usd + ' $', price: Number(result.price),
          fields: item.fields, montantUSD: item.montantUSD, date: new Date().toISOString()
        };
        if(!state.orders[state.currentUserId]) state.orders[state.currentUserId] = [];
        state.orders[state.currentUserId].unshift(order);
        sendOrderReceivedEmail(order, currentUser());
        processedCount++;
        manualOrdersCreated.push(order);
      }catch(e){ console.warn('create_manual_order_secure exception:', e?.message||e); failed.push(item); }
    } else if(item.type === 'form'){
      try{
        const sb = await getSupabase();
        const { data: result, error } = await sb.rpc('create_form_order_secure', {
          p_variant_id: item.variantId, p_fields: item.fields || {}
        });
        if(error){ console.warn('create_form_order_secure erè:', error.message); failed.push(item); continue; }
        const order = {
          id: result.order_id, orderNo: result.order_no, type:'form', status:'en_cours',
          product: result.product_name, variant: result.variant_label, price: Number(result.price),
          fields: item.fields, date: new Date().toISOString()
        };
        if(!state.orders[state.currentUserId]) state.orders[state.currentUserId] = [];
        state.orders[state.currentUserId].unshift(order);
        sendOrderReceivedEmail(order, currentUser());
        processedCount++;
        manualOrdersCreated.push(order);
      }catch(e){ console.warn('create_form_order_secure exception:', e?.message||e); failed.push(item); }
    } else if(item.type === 'api_topup'){
      try{
        const sb = await getSupabase();
        const itemOrderNo = 'KT-' + Math.random().toString(36).slice(2, 10).toUpperCase();
        const { data: inserted, error: insErr } = await sb.from('orders').insert({
          order_no: itemOrderNo, user_id: state.currentUserId, type: 'api_topup', status: 'en_cours',
          product: item.productName, variant: item.variantLabel, price: item.price,
          player_id: item.playerId, server_id: item.serverId || null,
        }).select().single();
        if(insErr || !inserted){ console.warn('api_topup order insert erè:', insErr?.message); failed.push(item); continue; }

        await applyWalletChange(state.currentUserId, -item.price, item.productName + ' — ' + item.variantLabel, 'out');

        const { data: result, error } = await sb.functions.invoke('woodflix-place-order', {
          body: { local_product_id: item.variantId, local_order_id: inserted.id, player_id: item.playerId, server_id: item.serverId || undefined, quantity: item.qty || 1 }
        });

        if(error || !result || result.error){
          await sb.from('orders').update({ status: 'anile' }).eq('id', inserted.id);
          await applyWalletChange(state.currentUserId, item.price, 'Ranbousman — ' + item.productName, 'in');
          console.warn('woodflix-place-order erè:', result?.error||error?.message);
          failed.push(item);
          continue;
        }

        if(result.order?.status === 'completed'){
          await sb.from('orders').update({ status: 'terminee' }).eq('id', inserted.id);
        }

        const order = {
          id: inserted.id, orderNo: itemOrderNo, type:'api_topup', status: result.order?.status==='completed'?'terminee':'en_cours',
          product: item.productName, variant: item.variantLabel, price: item.price, date: new Date().toISOString(),
          playerId: item.playerId, serverId: item.serverId || null
        };
        if(!state.orders[state.currentUserId]) state.orders[state.currentUserId] = [];
        state.orders[state.currentUserId].unshift(order);
        notifyAdminNewSale(order);
        incrementRewardProgress(state.currentUserId, item.variantId); // fè pwogram fidelite avanse pou acha otomatik yo tou
        processedCount++;
      }catch(e){ console.warn('api_topup checkout exception:', e?.message||e); failed.push(item); }
    } else {
      const order = {
        id: uid(), orderNo: nextOrderNo(), type:item.type, status:'en_cours',
        product: item.productName, variant: item.variantLabel, price: item.price,
        fields: item.fields, montantUSD: item.montantUSD || null, date: new Date().toISOString()
      };
      if(!state.orders[state.currentUserId]) state.orders[state.currentUserId] = [];
      state.orders[state.currentUserId].unshift(order);
      await insertOrderToServer(order, state.currentUserId);
      sendOrderReceivedEmail(order, currentUser());
      processedAmount += item.price;
      processedCount++;
      manualOrdersCreated.push(order);
    }
  }
  if(processedAmount > 0){
    await applyWalletChange(state.currentUserId, -processedAmount, 'Panye — ' + processedCount + ' atik', 'out');
  }
  await fetchWalletFromServer(state.currentUserId);
  await fetchRewardProgress(state.currentUserId);
  state.cart = failed; // keep unfulfilled units in cart so the customer can retry or remove them
  await saveState();
  await saveCartToServer();
  render();
  if(failed.length > 0){
    showToast(failed.length + ' atik pa disponib — yo rete nan panye a');
  } else {
    showToast(t('toast_purchase_success'));
    if(manualOrdersCreated.length > 0){
      notifyAdminOfManualOrders(manualOrdersCreated);
    }
    checkRapidActivity(state.currentUserId);
    goPage('commandes');
  }
}
function sendNtfyNotification(title, message, priority, tag, attachUrl){
  const topic = state.paymentSettings.ntfyTopic;
  if(!topic) return;
  const safeTitle = title.replace(/[^\x00-\x7F]/g, '').trim() || 'Kerry Topup';
  try{
    const headers = { 'Title': safeTitle, 'Priority': priority || 'high', 'Tags': tag || 'bell' };
    if(attachUrl) headers['Attach'] = attachUrl;
    fetch('https://ntfy.sh/' + topic, {
      method: 'POST',
      body: message,
      headers
    }).catch(e => console.warn('ntfy fetch failed:', e));
  }catch(e){ console.warn('sendNtfyNotification failed:', e?.message || e); }
}
function notifyAdminNewSale(order){
  const u = currentUser();
  const clientName = (u && u.profile) ? (u.profile.prenom + ' ' + u.profile.nom) : (u ? u.name : 'Kliyan');
  let ntfyMsg = '👤 Client : ' + clientName + '\n📦 Produit : ' + order.product + '\n🎯 Opsyon : ' + order.variant + '\n💰 Montant : HTG ' + Number(order.price).toLocaleString('fr-FR');
  if(order.type === 'pin' && order.pin){
    ntfyMsg += '\n🔑 PIN livre : ' + order.pin;
  }
  if(order.type === 'api_topup'){
    ntfyMsg += '\n🎮 Player ID : ' + (order.playerId||'');
    if(order.serverId) ntfyMsg += '\n🌍 Server ID : ' + order.serverId;
    if(order.playerName) ntfyMsg += '\n✅ Non kont : ' + order.playerName;
  }
  ntfyMsg += '\n📊 Estati : ' + (STATUS_LABEL[order.status]||order.status);
  ntfyMsg += '\n🆔 Commande : #' + (order.orderNo || '');
  sendNtfyNotification('💸 Nouvelle vente', ntfyMsg, 'high', 'moneybag');
}
function notifyAdminOfManualOrders(orders){
  const u = currentUser();
  const clientName = (u && u.profile) ? (u.profile.prenom + ' ' + u.profile.nom) : (u ? u.name : 'Kliyan');
  orders.forEach(o => {
    let ntfyMsg = 'Client : ' + clientName;
    ntfyMsg += '\nEmail : ' + (u && u.email ? u.email : '—');
    ntfyMsg += '\nProduit : ' + o.product;
    ntfyMsg += '\nOption : ' + o.variant;
    ntfyMsg += '\nMontant : HTG ' + o.price.toLocaleString('fr-FR');
    if(o.fields){
      Object.entries(o.fields).forEach(([k,v]) => {
        const m = typeof v === 'string' ? v.match(/^(.*) \(Non konfime: (.*)\)$/) : null;
        if(m){
          ntfyMsg += '\nID Joueur : ' + m[1];
          ntfyMsg += '\nNom trouvé : ' + m[2];
        } else {
          ntfyMsg += '\n' + k + ' : ' + v;
        }
      });
    }
    ntfyMsg += '\nCommande : #' + (o.orderNo || '');
    ntfyMsg += '\nStatut : ' + (STATUS_LABEL[o.status] || o.status);
    sendNtfyNotification('Nouvelle commande', ntfyMsg, 'high', 'shopping_cart');
  });
}

async function doRedeem(codeOverride){
  const code = codeOverride || document.getElementById('redeemInput').value.trim();
  if(!code){ showToast('Antre yon kòd'); return; }
  if(!isLoggedIn()){
    openAuthModal('login');
    pendingAction = () => doRedeem(code);
    return;
  }
  const box = document.getElementById('redeemResult');
  const found = state.redeemCodes.find(c=>c.code.toLowerCase()===code.toLowerCase());
  if(!found){ box.innerHTML = '<div class="card" style="border-color:var(--red);"><div style="color:var(--red);font-weight:600;">Kòd sa a pa valid.</div></div>'; return; }
  if(found.status === 'vann'){ box.innerHTML = '<div class="card" style="border-color:var(--red);"><div style="color:var(--red);font-weight:600;">Kòd sa a deja itilize.</div></div>'; return; }
  found.status = 'vann';
  state.wallets[state.currentUserId] = (state.wallets[state.currentUserId]||0) + found.value;
  state.transactions[state.currentUserId].unshift({type:'in', label:'Redeem kòd', amount:found.value, date:new Date().toISOString()});
  await saveState();
  document.getElementById('redeemInput').value='';
  box.innerHTML = '<div class="card" style="border-color:var(--green);"><div style="color:var(--green);font-weight:600;">Siksè! ' + money(found.value) + ' ajoute nan Wallet ou.</div></div>';

function sendWhatsAppOrder(userId, orderId){
  const list = state.orders[userId] || [];
  const o = list.find(x=>x.id===orderId);
  const u = state.users.find(x=>x.id===userId);
  if(!o || !u || !u.profile){ showToast('Pa gen enfòmasyon WhatsApp pou kliyan sa'); return; }
  const digits = u.profile.whatsapp.replace(/\D/g,'');
  let msg = `Bonjou ${u.profile.prenom}, men detay kòmand #${o.orderNo} ou a sou Kerry Topup Official:\n\n`;
  msg += `Pwodwi: ${o.product}\nMontan: ${o.variant}\nTotal: ${o.price.toLocaleString('fr-FR')} HTG\n`;
  if(o.fields){ Object.entries(o.fields).forEach(([k,v]) => { msg += `${k}: ${v}\n`; }); }
  msg += `\nN ap trete kòmand ou a kounye a. Mèsi pou konfyans ou!`;
  const url = 'https://wa.me/' + digits + '?text=' + encodeURIComponent(msg);
  window.open(url, '_blank');
}
async function cancelAndRefundOrder(userId, orderId){
  const list = state.orders[userId] || [];
  const o = list.find(x=>x.id===orderId);
  if(!o) return;
  if(!confirm('Anile kòmand sa a e ranbouse '+money(o.price)+' bay kliyan an?')) return;
  o.status = 'annulee';
  try{
    const sb = await getSupabase();
    await sb.from('orders').update({ status:'annulee' }).eq('id', orderId);
    await applyWalletChange(userId, o.price, 'Ranbousman — ' + o.product, 'in');
  }catch(e){ showToast('⚠️ Erè: '+(e?.message||'enkoni')); return; }
  logActivity('Anile e ranbouse kòmand #'+o.orderNo);
  await saveState(); renderAdminTab(); showToast(t('toast_order_cancelled') + ' — ' + t('toast_money_refunded'));
}
async function updateOrderStatus(userId, orderId, newStatus){
  const list = state.orders[userId] || [];
  const o = list.find(x=>x.id===orderId);
  if(!o) return;
  o.status = newStatus;
  try{ const sb = await getSupabase(); await sb.from('orders').update({ status:newStatus }).eq('id', orderId); }catch(e){}
  logActivity('Chanje estati kòmand #'+o.orderNo+' pou '+STATUS_LABEL[newStatus]);
  if(newStatus === 'terminee'){
    const u = state.users.find(x=>x.id===userId);
    sendOrderReceiptEmail(o, u);
  }
  await saveState(); renderAdminTab(); showToast('Estati mete ajou');
}

async function renderWoodflixLinksTable(){
  const tableBox = document.getElementById('wfscLinksTable');
  if(!tableBox) return;
  const search = (document.getElementById('wfscLinksSearch')?.value || '').trim().toLowerCase();
  tableBox.innerHTML = 'Chajman...';
  try{
    const sb = await getSupabase();
    const { data: variants, error: vErr } = await sb
      .from('variants')
      .select('id, label, price, products(name)')
      .order('label');
    const { data: links, error: lErr } = await sb.from('woodflix_product_links').select('*');
    if(vErr || lErr){
      tableBox.innerHTML = '<span style="color:var(--red);">⚠️ ' + escapeHtml(vErr?.message||lErr?.message||'Erè enkoni') + '</span>';
      return;
    }
    let filtered = variants || [];
    if(search) filtered = filtered.filter(v => (v.label||'').toLowerCase().includes(search) || (v.products?.name||'').toLowerCase().includes(search));
    if(filtered.length === 0){ tableBox.innerHTML = '<div style="color:var(--muted);font-size:12.5px;">Pa gen opsyon.</div>'; return; }
    tableBox.innerHTML = filtered.map(v => {
      const link = (links||[]).find(l => l.local_product_id === v.id) || null;
      const productName = v.products?.name || '';
      return `
        <div style="border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;">

async function saveWoodflixLink(variantId){

      body: { local_product_id: variantId, woodflix_product_id: parseInt(woodflixProductId), markup_percent: 0 }

    await sb.from('variants').update({ woodflix_product_id: parseInt(woodflixProductId) }).eq('id', variantId);

function renderSecurityCard(u){

  return `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <div><div style="font-weight:700;font-size:13.5px;">${escapeHtml(u.name)}</div><div style="color:var(--muted);font-size:11px;">${escapeHtml(u.email||'')}</div></div>
        <div style="font-size:12px;font-weight:700;">${statusLabel}</div>
      </div>
      ${u.suspensionReason ? `<div style="font-size:12px;color:var(--muted);margin-bottom:8px;">Rezon: ${escapeHtml(u.suspensionReason)}</div>` : ''}
      <div style="display:flex;gap:6px;flex-wrap:wrap;">
        <button class="mini-btn" style="color:var(--green);" onclick="reactivateAccount('${u.id}', false)">🟢 Réactiver</button>
        <button class="mini-btn" style="color:#FF9F0A;" onclick="adminSuspendTemp('${u.id}')">🟠 Suspendre temp.</button>
        <button class="mini-btn" style="color:var(--red);" onclick="adminSuspendPermanent('${u.id}')">🔴 Suspendre déf.</button>
        <button class="mini-btn" onclick="toggleSecurityHistory('${u.id}')">📜 Historique</button>
      </div>
      <div id="secHistory-${u.id}" style="display:none;margin-top:10px;border-top:1px solid var(--line);padding-top:8px;">
        ${(u.suspensionHistory||[]).length===0 ? '<div style="font-size:11.5px;color:var(--muted);">Pa gen istwa.</div>' :
          u.suspensionHistory.slice().reverse().map(h => `<div style="font-size:11.5px;color:var(--muted);margin-bottom:4px;">${new Date(h.date).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'numeric',minute:'2-digit',hour12:true})} — <b style="color:var(--text);">${escapeHtml(h.action)}</b>${h.reason?' ('+escapeHtml(h.reason)+')':''}</div>`).join('')}
      </div>
    </div>
  `;
}

function uploadVideoWithProgress(file, path){
  return new Promise(async (resolve, reject) => {
    const sb = await getSupabase();
    const { data: sessionData } = await sb.auth.getSession();
    const accessToken = sessionData?.session?.access_token || SUPABASE_KEY;
    const xhr = new XMLHttpRequest();
    xhr.open('POST', SUPABASE_URL + '/storage/v1/object/tutorial-videos/' + encodeURIComponent(path));
    xhr.setRequestHeader('Authorization', 'Bearer ' + accessToken);
    xhr.setRequestHeader('apikey', SUPABASE_KEY);
    xhr.setRequestHeader('Content-Type', file.type || 'video/mp4');
    xhr.upload.onprogress = (e) => {
      if(e.lengthComputable){
        const pct = Math.round((e.loaded / e.total) * 100);
        const bar = document.getElementById('tv2ProgressBar');
        const text = document.getElementById('tv2ProgressText');
        if(bar) bar.style.width = pct + '%';
        if(text) text.textContent = 'Upload videyo... ' + pct + '%';
      }
    };
    xhr.onload = () => {
      if(xhr.status >= 200 && xhr.status < 300){
        const text = document.getElementById('tv2ProgressText');
        if(text) text.textContent = '✔ Upload fini';
        resolve(SUPABASE_URL + '/storage/v1/object/public/tutorial-videos/' + path);
      } else {
        reject(new Error('Erè telechajman (kòd ' + xhr.status + '): ' + xhr.responseText));
      }
    };
    xhr.onerror = () => reject(new Error('Erè rezo pandan telechajman an'));
    xhr.send(file);
  });
}
async function saveTutorialV2(){
  const title = document.getElementById('tv2Title').value.trim();
  const description = document.getElementById('tv2Description').value.trim();
  const autoTrigger = document.getElementById('tv2AutoTrigger').checked;
  const file = document.getElementById('tv2File').files[0];
  if(!title){ showToast('Mete yon tit'); return; }
  if(!tv2EditingId && !file){ showToast('Chwazi yon videyo'); return; }

  const progressBox = document.getElementById('tv2ProgressBox');
  const progressBar = document.getElementById('tv2ProgressBar');
  const progressText = document.getElementById('tv2ProgressText');
  const buttonRow = document.getElementById('tv2ButtonRow');
  const saveBtn = document.getElementById('tv2SaveBtn');
  const cancelBtn = document.getElementById('tv2CancelBtn');

  try{
    const sb = await getSupabase();
    let videoUrl = tv2EditingId ? state.tutorialsV2.find(x=>x.id===tv2EditingId).videoUrl : '';

    if(file){
      buttonRow.style.display = 'none';
      progressBox.style.display = 'block';
      progressBar.style.width = '0%';
      progressText.textContent = 'Upload videyo... 0%';
      const path = Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9._-]/g, '');
      try{
        videoUrl = await uploadVideoWithProgress(file, path);
      }catch(uploadErr){
        progressText.textContent = '❌ Upload echwe: ' + uploadErr.message;
        progressBar.style.width = '0%';
        buttonRow.style.display = 'flex';
        progressBox.style.display = 'none';
        showToast('⚠️ Upload echwe — eseye ankò');
        return;
      }
    }

    let tutorialId = tv2EditingId;
    if(tv2EditingId){
      await sb.from('tutorials_v2').update({ title, video_url: videoUrl, description, auto_trigger: autoTrigger }).eq('id', tv2EditingId);
      await sb.from('tutorial_triggers_v2').delete().eq('tutorial_id', tv2EditingId);
    } else {
      const { data: inserted } = await sb.from('tutorials_v2').insert({ title, video_url: videoUrl, description, auto_trigger: autoTrigger, order_num: state.tutorialsV2.length }).select().single();
      tutorialId = inserted.id;
    }
    if(autoTrigger && tv2SelectedTriggers.length > 0){
      const rows = tv2SelectedTriggers.map(key => key.startsWith('product:')
        ? { tutorial_id: tutorialId, trigger_type: 'product', product_id: key.slice(8) }
        : { tutorial_id: tutorialId, trigger_type: key, product_id: null }
      );
      await sb.from('tutorial_triggers_v2').insert(rows);
    }
    if(progressBox) progressBox.style.display = 'none';
    await fetchTutorialsV2();
    await fetchTutorialTriggersV2();
    closeTutorialV2Form();
    showToast('Tutorial sove ✓');
  }catch(e){
    if(progressBox) progressBox.style.display = 'none';
    if(buttonRow) buttonRow.style.display = 'flex';
    showToast('Erè: ' + (e?.message || 'enkoni'));
  }
}

async function searchClientByEmail(){
  const val = document.getElementById('clientSearchInput').value.trim().toLowerCase();
  if(!val) return;
  clientSearchTerm = val;
  if(!val.includes('@')){ renderAdminTab(); return; } // plain name filter, no lookup needed
  try{
    const sb = await getSupabase();
    const { data: foundId } = await sb.rpc('find_user_id_by_email', { p_email: val });
    if(foundId){
      let u = state.users.find(x=>x.id===foundId);
      if(!u){
        const { data: profile } = await sb.from('profiles').select('*').eq('id', foundId).single();
        u = { id:foundId, name: profile?.name || val.split('@')[0], email: val, googlePhoto:null };
        state.users.push(u);
      } else {
        u.email = val;
      }
      const { data: walletRow } = await sb.from('wallets').select('*').eq('user_id', foundId).single();
      if(walletRow) state.wallets[foundId] = Number(walletRow.balance) || 0;
      showToast('Kliyan jwenn ✓');
    } else {
      showToast('Pa gen kont ak imèl sa a');
    }
  }catch(e){
    console.warn('searchClientByEmail failed:', e?.message || e);
    showToast('Erè pandan rechèch la');
  }
  renderAdminTab();
}
async function adminAdjustWallet(userId, sign){

async function fetchAllUsersFromServer(){
  try{
    const sb = await getSupabase();
    const { data: profiles } = await sb.from('profiles').select('*');
    const { data: wallets } = await sb.from('wallets').select('*');
    if(profiles){
      profiles.forEach(p => {
        let u = state.users.find(x=>x.id===p.id);
        if(!u){
          u = { id:p.id, name:p.name, email:p.email||'', googlePhoto:null };
          state.users.push(u);
        } else if(!u.name){
          u.name = p.name;
        }
      });
    }
    if(wallets){
      wallets.forEach(w => { state.wallets[w.user_id] = Number(w.balance)||0; });
    }
    renderAdminTab();
  }catch(e){ console.warn('fetchAllUsersFromServer failed:', e?.message || e); }
}

async function fetchPinsFromServer(){
  try{
    const sb = await getSupabase();
    const variantIds = state.products.filter(p=>p.type!=='calculator').flatMap(p=>(p.variants||[]).map(v=>v.id));
    if(variantIds.length===0) return;
    const { data } = await sb.from('pins').select('*').in('variant_id', variantIds);
    if(data){
      const byVariant = {};
      data.forEach(row => {
        if(!byVariant[row.variant_id]) byVariant[row.variant_id] = [];
        byVariant[row.variant_id].push({ id: row.id, code: row.code, status: row.status });
      });
      variantIds.forEach(vid => { state.inventory[vid] = byVariant[vid] || []; });
      renderAdminTab();
      renderShop();
    }
  }catch(e){ /* offline — keep showing local counts */ }
}
async function fetchStockCountsForShop(){
  try{
    const sb = await getSupabase();
    const variantIds = state.products.filter(p=>p.type!=='calculator').flatMap(p=>(p.variants||[]).map(v=>v.id));
    if(variantIds.length===0) return;
    const { data, error } = await sb.rpc('get_stock_counts', { p_variant_ids: variantIds });
    if(error) throw error;
    const counts = {};
    (data||[]).forEach(row => { counts[row.variant_id] = Number(row.available_count); });
    variantIds.forEach(vid => {
      const n = counts[vid] || 0;
      // build a dummy dispo-status array of the right length — customers never see real codes here
      state.inventory[vid] = Array.from({length:n}, () => ({ code:null, status:'dispo' }));
    });
    renderShop();
  }catch(e){ console.warn('fetchStockCountsForShop failed:', e?.message || e?.error_description || e?.code || JSON.stringify(e) || e); }
}
async function fetchAllOrdersForAdmin(){

          id:o.id, orderNo:o.order_no, type:o.type, status:o.status, product:o.product, variant:o.variant,
          price:Number(o.price), pin:o.pin_code, fields:o.fields, montantUSD:o.montant_usd, date:o.created_at,
          adminResponse:o.admin_response
        });
      });
      Object.assign(state.orders, byUser);
      renderAdminTab();
    }
  }catch(e){}
  subscribeToAdminOrdersRealtime();
}

  try{
    const sb = await getSupabase();
    if(adminOrdersChannel){ sb.removeChannel(adminOrdersChannel); }
    adminOrdersChannel = sb.channel('admin-orders-rt')
      .on('postgres_changes', { event:'INSERT', schema:'public', table:'orders' }, payload => {
        if(state.isAdmin){
          showToast('🔔 ' + t('toast_new_order') + ' #' + payload.new.order_no + ' — ' + payload.new.product);
          if(adminTab === 'kòmand') fetchAllOrdersForAdmin();
        }
      })
      .subscribe();
  }catch(e){}
}

  if(!name){ showToast('Antre non pwodwi a'); return; }
  if(!image){ showToast('Foto pwodwi a obligatwa'); return; }
  if(!description){ showToast('Deskripsyon an obligatwa'); return; }
  const base = { id: uid(), name, category:cat, icon, image, description, popular:false, active:true, type };
  if(type === 'calculator'){
    base.manualConfig = { taux:145, frais:0, min:5, max:500, fields:[], feeTiers:[] };
  } else if(type === 'api_topup'){
    base.variants = [];
  } else {
    const variantRaw = document.getElementById('npVariant').value.trim();
    if(!variantRaw){ showToast('Antre premye opsyon (Non,Pri)'); return; }
    const [vLabel, vPrice] = variantRaw.split(',').map(s=>s.trim());
    if(!vLabel || !vPrice){ showToast('Fòma opsyon: Non,Pri'); return; }
    base.variants = [{id:uid(), label:vLabel, price:parseFloat(vPrice)}];
    if(type === 'form'){ base.formFields = []; }
  }
  try{
    const sb = await getSupabase();
    const { data: inserted, error: insErr } = await sb.from('products').insert({
      name, category:cat, icon, image, description, type, popular:false, active:true,
      form_fields: type==='form' ? [] : []
    }).select().single();
    if(insErr){
      showToast('⚠️ Erè Supabase: ' + insErr.message);
      return;
    }
    if(inserted){
      base.id = inserted.id;
      if(type === 'calculator'){
        await sb.from('manual_configs').insert({ product_id:base.id, taux:145, frais:0, min_amount:5, max_amount:500, fields:[], fee_tiers:[] });
      } else if(type === 'api_topup'){
        // pa gen premye opsyon obligatwa — Admin ajoute yo apre nan fòm espesyal la
      } else {
        const { data: vIns } = await sb.from('variants').insert({ product_id:base.id, label:base.variants[0].label, price:base.variants[0].price }).select().single();
        if(vIns) base.variants[0].id = vIns.id;
      }
    }
  }catch(e){
    showToast('⚠️ Erè: ' + (e?.message || 'pa ka konekte ak sèvè a'));
    return;
  }
  state.products.push(base);
  logActivity('Ajoute pwodwi '+name);
  selectedProductMode = 'pin';
  await saveState(); renderAdminTab(); showToast('Pwodwi ajoute');
}

function feeForAmount(manualConfig, amount){
  const tiers = manualConfig.feeTiers || [];
  const match = tiers.find(t => amount >= t.min && amount <= t.max);
  if(match) return match.fee;
  return manualConfig.frais || 0; // fallback to flat fee if no tier matches
}
let descDragState = null;
function startDescDrag(evt, pid, index){
  evt.preventDefault();
  const container = document.getElementById('descBlocksContainer-'+pid);
  const cards = Array.from(container.querySelectorAll('.desc-block-card'));
  const draggedCard = cards[index];
  descDragState = { pid, container, row: draggedCard, startY: evt.clientY };
  draggedCard.style.position = 'relative';
  draggedCard.style.zIndex = '10';
  draggedCard.style.boxShadow = '0 6px 18px rgba(0,0,0,0.35)';
  document.onpointermove = onDescDragMove;
  document.onpointerup = endDescDrag;
}
function onDescDragMove(evt){
  if(!descDragState) return;
  const { row, container } = descDragState;
  const deltaY = evt.clientY - descDragState.startY;
  row.style.transform = 'translateY(' + deltaY + 'px)';
  const threshold = 70;
  if(Math.abs(deltaY) > threshold){
    const dir = deltaY > 0 ? 1 : -1;
    const sibling = dir > 0 ? row.nextElementSibling : row.previousElementSibling;
    if(sibling && sibling.classList && sibling.classList.contains('desc-block-card')){
      if(dir > 0){ container.insertBefore(sibling, row); }
      else { container.insertBefore(row, sibling); }
      descDragState.startY = evt.clientY;
      row.style.transform = '';
    }
  }
}
async function endDescDrag(evt){
  if(!descDragState) return;
  const { pid, row, container } = descDragState;
  document.onpointermove = null;
  document.onpointerup = null;
  row.style.transform = ''; row.style.position = ''; row.style.zIndex = ''; row.style.boxShadow = '';
  const cards = Array.from(container.querySelectorAll('.desc-block-card'));
  const orderedIndexes = cards.map(c => parseInt(c.dataset.index, 10));
  descDragState = null;
  const p = state.products.find(x=>x.id===pid);
  p.descriptions = orderedIndexes.map(i => p.descriptions[i]);
  await saveDescriptionsToServer(p);
  renderAdminTab();
}

  try{ const sb = await getSupabase(); await sb.from('products').update({ descriptions: p.descriptions }).eq('id', p.id); }catch(e){}
  await saveState();

let productDragState = null;
function startProductDrag(ev, pid){
  ev.preventDefault();
  ev.stopPropagation();
  const row = document.getElementById('prow-'+pid);
  const container = document.getElementById('productAdminList');
  if(!row || !container) return;
  productDragState = { row, container, startY: ev.clientY };
  row.style.position = 'relative';
  row.style.zIndex = '10';
  row.style.boxShadow = '0 4px 14px rgba(0,0,0,0.25)';
  try{ ev.currentTarget.setPointerCapture(ev.pointerId); }catch(e){}
  ev.currentTarget.addEventListener('pointermove', onProductDragMove);
  ev.currentTarget.addEventListener('pointerup', onProductDragEnd);
  ev.currentTarget.addEventListener('pointercancel', onProductDragEnd);
}
function onProductDragMove(ev){
  if(!productDragState) return;
  const { row, container } = productDragState;
  const deltaY = ev.clientY - productDragState.startY;
  row.style.transform = 'translateY(' + deltaY + 'px)';
  const threshold = 70;
  if(Math.abs(deltaY) > threshold){
    const dir = deltaY > 0 ? 1 : -1;
    const sibling = dir > 0 ? row.nextElementSibling : row.previousElementSibling;
    if(sibling){
      if(dir > 0){ container.insertBefore(sibling, row); }
      else { container.insertBefore(row, sibling); }
      productDragState.startY = ev.clientY;
      row.style.transform = '';
    }
  }
}
async function onProductDragEnd(ev){
  if(ev && ev.currentTarget){
    ev.currentTarget.removeEventListener('pointermove', onProductDragMove);
    ev.currentTarget.removeEventListener('pointerup', onProductDragEnd);
    ev.currentTarget.removeEventListener('pointercancel', onProductDragEnd);
  }
  if(!productDragState) return;
  const { row, container } = productDragState;
  row.style.transform = '';
  row.style.zIndex = '';
  row.style.boxShadow = '';
  const orderedIds = Array.from(container.children).map(r => r.dataset.pid);
  orderedIds.forEach((pid,i) => { const p = state.products.find(x=>x.id===pid); if(p) p.sortOrder = i; });
  state.products.sort((a,b)=>(a.sortOrder||0)-(b.sortOrder||0));
  productDragState = null;
  try{
    const sb = await getSupabase();
    await Promise.all(orderedIds.map((pid,i) => sb.from('products').update({ sort_order:i }).eq('id', pid)));
  }catch(e){}
  await saveState();
  showToast('Lòd pwodwi mete ajou ✓');
}

async function uploadImageToStorage(file){
  try{

    const { error } = await sb.storage.from('images').upload(path, file);

    const { data } = sb.storage.from('images').getPublicUrl(path);
    return data.publicUrl;
  }catch(e){
    showToast('Erè upload foto: ' + (e && e.message ? e.message : 'erè enkoni'));

let catDragState = null;
function startCatDrag(evt, index){
  evt.preventDefault();
  const container = document.getElementById('catBlocksContainer');
  const cards = Array.from(container.querySelectorAll('.cat-block-card'));
  const draggedCard = cards[index];
  catDragState = { fromIndex: index, cards, startY: evt.clientY };
  draggedCard.style.position = 'relative';
  draggedCard.style.zIndex = '10';
  draggedCard.style.boxShadow = '0 6px 18px rgba(0,0,0,0.35)';
  document.onpointermove = onCatDragMove;
  document.onpointerup = endCatDrag;
}
function onCatDragMove(evt){
  if(!catDragState) return;
  const { cards, fromIndex, startY } = catDragState;
  const draggedCard = cards[fromIndex];
  const deltaY = evt.clientY - startY;
  draggedCard.style.transform = 'translateY(' + deltaY + 'px)';
  const draggedRect = draggedCard.getBoundingClientRect();
  const draggedCenter = draggedRect.top + draggedRect.height/2;
  cards.forEach((card, i) => {
    if(i === fromIndex) return;
    const rect = card.getBoundingClientRect();
    const cardCenter = rect.top + rect.height/2;
    if(draggedCenter > cardCenter && i > fromIndex){
      card.style.transform = 'translateY(-' + draggedRect.height + 'px)';
    } else if(draggedCenter < cardCenter && i < fromIndex){
      card.style.transform = 'translateY(' + draggedRect.height + 'px)';
    } else {
      card.style.transform = '';
    }
  });
}
async function endCatDrag(evt){
  if(!catDragState) return;
  const { fromIndex, cards } = catDragState;
  document.onpointermove = null;
  document.onpointerup = null;
  let toIndex = fromIndex;
  cards.forEach((card, i) => {
    if(i !== fromIndex && card.style.transform && card.style.transform !== ''){
      toIndex = i;
    }
  });
  cards.forEach(card => { card.style.transform = ''; card.style.position = ''; card.style.zIndex = ''; card.style.boxShadow = ''; });
  catDragState = null;
  if(toIndex !== fromIndex){
    const [moved] = state.categories.splice(fromIndex, 1);
    state.categories.splice(toIndex, 0, moved);
    state.categories.forEach((c,idx) => c.sortOrder = idx);
    try{
      const sb = await getSupabase();
      for(const c of state.categories){ await sb.from('categories').update({ sort_order: c.sortOrder }).eq('id', c.id); }
    }catch(e){}
    await saveState();
    renderAdminTab();
  }
}
async function moveCategory(id, dir){
  const i = state.categories.findIndex(c=>c.id===id);
  const j = i + dir;
  if(j < 0 || j >= state.categories.length) return;
  [state.categories[i], state.categories[j]] = [state.categories[j], state.categories[i]];
  state.categories.forEach((c,idx) => c.sortOrder = idx);
  try{
    const sb = await getSupabase();
    await sb.from('categories').update({ sort_order: state.categories[i].sortOrder }).eq('id', state.categories[i].id);
    await sb.from('categories').update({ sort_order: state.categories[j].sortOrder }).eq('id', state.categories[j].id);
  }catch(e){}
  await saveState(); renderAdminTab();
}

  openConfirm('Efase kòd PIN sa a?', 'Sa pa ka anile — kòd la ap disparèt nèt nan estòk la.', async ()=>{
    try{ const sb = await getSupabase(); await sb.from('pins').delete().eq('id', pinId); }catch(e){}
    if(state.inventory[variantId]){
      state.inventory[variantId] = state.inventory[variantId].filter(x=>x.id!==pinId);
    }
    await saveState();
    renderAdminTab();
    showToast('PIN efase');
  });

async function addPinToModal(){
  const input = document.getElementById('pinModalInput');
  const errBox = document.getElementById('pinModalError');
  const code = input.value.trim();
  errBox.textContent = '';
  if(!code){ errBox.textContent = 'Antre yon kòd PIN.'; return; }
  if(!state.inventory[pinModalVariantId]) state.inventory[pinModalVariantId] = [];
  const dup = state.inventory[pinModalVariantId].some(x => x.code === code);
  if(dup){ errBox.textContent = 'PIN sa a deja egziste nan kategori sa a — pa ajoute de fwa.'; return; }
  try{
    const sb = await getSupabase();
    const { error } = await sb.from('pins').insert({ variant_id: pinModalVariantId, code, status:'dispo' });
    if(error){
      if(error.code === '23505'){ errBox.textContent = 'PIN sa a deja egziste nan kategori sa a — pa ajoute de fwa.'; return; }
      throw error;
    }
  }catch(e){ /* offline — still add locally, will need a manual re-sync later */ }
  state.inventory[pinModalVariantId].push({ code, status:'dispo' });
  fulfillPendingPinOrdersForVariant(pinModalVariantId);
  pinModalAddedCount++;
  document.getElementById('pinModalCount').textContent = pinModalAddedCount + ' PIN ajoute nan sesyon sa a';
  input.value = '';
  input.focus();
  await saveState();
}
async function approveRecharge(id){
  const r = state.rechargeRequests.find(x=>x.id===id);
  if(r.status === 'approved'){ showToast('Deja apwouve'); return; }
  try{
    const sb = await getSupabase();
    const { error } = await sb.from('recharge_requests').update({ status:'approved' }).eq('id', id);
    if(error && error.code === '23505'){
      showToast('Refize: TXN ID/referans/resi sa deja apwouve pou yon lòt demand');
      return;
    }
  }catch(e){ /* offline — proceed with local-only approval */ }
  r.status = 'approved';
  await applyWalletChange(r.userId, r.amount, 'Rechaj NatCash', 'in', false, r.txnId, r.proofUrl, r.ref, true);
  if(!state.usedTxnIds.includes(r.txnId)) state.usedTxnIds.push(r.txnId);
  if(r.ref && !state.usedRefs.includes(r.ref)) state.usedRefs.push(r.ref);
  if(r.receiptHash && !state.usedReceiptHashes.includes(r.receiptHash)) state.usedReceiptHashes.push(r.receiptHash);
  const ru = state.users.find(x=>x.id===r.userId);
  sendWalletCreditedEmail(ru, r.amount, r.txnId || r.ref || '');
  logActivity('Apwouve rechaj #'+r.id.slice(0,6)+' — '+money(r.amount));
  await saveState(); renderAdminTab(); showToast('Rechaj apwouve');
}
async function rejectRecharge(id){
  const r = state.rechargeRequests.find(x=>x.id===id);
  r.status = 'rejected';
  try{ const sb = await getSupabase(); await sb.from('recharge_requests').update({ status:'rejected' }).eq('id', id); }catch(e){}
  await saveState(); renderAdminTab(); showToast('Demand rejte');
}

/* ===== PWA Install Banner ===== */
let deferredInstallPrompt = null;

function setupPWAManifest(){
  try{
    const logoImg = document.querySelector('.logo-mark img');
    const iconSrc = logoImg ? logoImg.src : '';
    const manifest = {
      name: "Kerry Topup Official",
      short_name: "Kerry Topup",
      start_url: "/",
      display: "standalone",
      background_color: "#0A0D09",
      theme_color: "#0FA654",
      icons: iconSrc ? [
        { src: iconSrc, sizes: "192x192", type: "image/png" },
        { src: iconSrc, sizes: "512x512", type: "image/png" }
      ] : []
    };
    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = url;
    document.head.appendChild(link);
  }catch(e){ console.warn('setupPWAManifest failed:', e); }
}
function registerServiceWorker(){
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('/sw.js').catch(e => console.warn('SW registration failed:', e));
  }
}
function isAlreadyInstalled(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
function showInstallBannerIfEligible(){
  if(isAlreadyInstalled()) return;
  if(!deferredInstallPrompt) return;
  const banner = document.getElementById('installBanner');
  if(banner) banner.style.display = 'flex';
}
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  showInstallBannerIfEligible();
});
window.addEventListener('appinstalled', () => {
  const banner = document.getElementById('installBanner');
  if(banner) banner.style.display = 'none';
  deferredInstallPrompt = null;
});
async function triggerPWAInstall(){
  const banner = document.getElementById('installBanner');
  if(!deferredInstallPrompt){ if(banner) banner.style.display = 'none'; return; }
  deferredInstallPrompt.prompt();
  const choice = await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  if(banner) banner.style.display = 'none';
}
function dismissInstallBanner(){
  const banner = document.getElementById('installBanner');
  if(banner) banner.style.display = 'none';
}

let wasOffline = false;
let snakeInterval = null;
function updateOfflineOverlay(){
  const overlay = document.getElementById('offlineOverlay');
  if(!overlay) return;

    overlay.style.display = 'flex';

function toggleSnakeGame(){
  const box = document.getElementById('snakeGameBox');
  const btn = document.getElementById('snakeToggleBtn');
  if(box.style.display === 'none'){
    box.style.display = 'flex';
    btn.style.display = 'none';
    startSnakeGame();
  } else {
    box.style.display = 'none';
    btn.style.display = 'inline-block';
    stopSnakeGame();
  }
}
function stopSnakeGame(){
  if(snakeInterval){ clearInterval(snakeInterval); snakeInterval = null; }
}
function startSnakeGame(){
  const canvas = document.getElementById('snakeCanvas');
  const ctx = canvas.getContext('2d');
  const cell = 20, cols = 16, rows = 11;
  let snake, dir, nextDir, food, score, alive;

  function resetGame(){
    snake = [{x:5,y:5}];
    dir = {x:1,y:0};
    nextDir = {x:1,y:0};
    food = {x:8,y:5};
    score = 0;
    alive = true;
    document.getElementById('snakeScoreLabel').textContent = 'Score: 0';
    draw();
    stopSnakeGame();
    snakeInterval = setInterval(tick, 160);
  }
  function placeFood(){
    let ok = false;
    while(!ok){
      food = { x: Math.floor(Math.random()*cols), y: Math.floor(Math.random()*rows) };
      ok = !snake.some(s => s.x===food.x && s.y===food.y);
    }
  }
  function draw(){
    ctx.fillStyle = '#0E1109';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#00D26A';
    snake.forEach(s => ctx.fillRect(s.x*cell+1, s.y*cell+1, cell-2, cell-2));
    ctx.fillStyle = '#FFD34D';
    ctx.fillRect(food.x*cell+3, food.y*cell+3, cell-6, cell-6);
    if(!alive){
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 14px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('Game Over 😹', canvas.width/2, canvas.height/2 - 10);
      ctx.font = '12px Arial';
      ctx.fillText('Tapé pou rejwe', canvas.width/2, canvas.height/2 + 14);
    }
  }
  function tick(){
    if(!alive) return;
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if(head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows || snake.some(s => s.x===head.x && s.y===head.y)){
      alive = false;
      draw();
      stopSnakeGame();
      return;
    }
    snake.unshift(head);
    if(head.x === food.x && head.y === food.y){
      score += 10;
      document.getElementById('snakeScoreLabel').textContent = 'Score: ' + score;
      placeFood();
    } else {
      snake.pop();
    }
    draw();
  }
  function setDir(x,y){
    if(dir.x === -x && dir.y === -y) return; // no reversing into self
    nextDir = {x,y};
  }
  document.onkeydown = (e) => {
    if(document.getElementById('snakeGameBox').style.display === 'none') return;
    if(!alive){ resetGame(); return; }
    if(e.key==='ArrowUp') setDir(0,-1);
    else if(e.key==='ArrowDown') setDir(0,1);
    else if(e.key==='ArrowLeft') setDir(-1,0);
    else if(e.key==='ArrowRight') setDir(1,0);
  };
  let touchStartX = 0, touchStartY = 0;
  canvas.ontouchstart = (e) => { touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; };
  canvas.ontouchend = (e) => {
    if(!alive){ resetGame(); return; }
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if(Math.abs(dx) > Math.abs(dy)){ setDir(dx > 0 ? 1 : -1, 0); }
    else { setDir(0, dy > 0 ? 1 : -1); }
  };
  canvas.onclick = () => { if(!alive) resetGame(); };
  resetGame();
}
