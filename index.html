<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Kerry Topup Official</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F8F5;
  --panel:#FFFFFF;
  --panel-2:#F0F3EE;
  --line:#E3E8E0;
  --text:#11151A;
  --muted:#6B7A6E;
  --green:#0FA654;
  --green-2:#0C8A45;
  --green-dim:#E4F6EA;
  --ink:#10141C;
  --ink-2:#1D2330;
  --amber:#B77A0B;
  --amber-dim:#FBF0DA;
  --red:#E23B57;
  --red-dim:#FBE6EA;
}
html.dark{
  --bg:#0B0F14;
  --panel:#161B22;
  --panel-2:#1D242D;
  --line:#2A323C;
  --text:#F0F3F0;
  --muted:#8A97A0;
  --green:#17C267;
  --green-2:#0FA654;
  --green-dim:#0F2A1C;
  --ink:#2A323C;
  --ink-2:#3A4451;
  --amber:#F0B429;
  --amber-dim:#332B12;
  --red:#F0577A;
  --red-dim:#331419;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(900px 420px at 10% -10%, rgba(15,166,84,0.08), transparent 60%),
    radial-gradient(700px 420px at 100% 0%, rgba(15,166,84,0.04), transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  min-height:100vh;
}
.display{font-family:'Rajdhani',sans-serif;}
.mono{font-family:'JetBrains Mono',monospace;}
a{color:inherit;text-decoration:none;}
button{font-family:'Inter',sans-serif;border:none;cursor:pointer;background:none;color:inherit;}
input,textarea,select{font-family:'Inter',sans-serif;}

/* ---------- App shell (fully responsive) ---------- */
.app{
  width:100%;min-height:100vh;position:relative;
  display:flex;flex-direction:column;
  padding-bottom:78px;
  background:linear-gradient(180deg, rgba(15,166,84,0.03), transparent 200px);
}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:30;
  background:rgba(255,255,255,0.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  padding:14px 16px 12px;
}
@media (min-width:640px){
  .topbar{padding:16px 32px 14px;}
}
@media (min-width:1024px){
  .topbar{padding:18px 56px 16px;}
}
@media (min-width:1440px){
  .topbar{padding:20px 96px 18px;}
}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:1200px;margin:0 auto;}
.logo{display:flex;align-items:center;gap:10px;}
.logo-mark{
  width:38px;height:38px;border-radius:11px;
  background:linear-gradient(150deg,var(--green),var(--green-2));
  display:flex;align-items:center;justify-content:center;
  font-family:'Rajdhani',sans-serif;font-weight:700;font-size:17px;color:#FFFFFF;
  box-shadow:0 6px 16px -4px rgba(15,166,84,0.4);
}
.logo-text{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:17px;line-height:1.1;}
.logo-text span{display:block;font-family:'Inter',sans-serif;font-weight:400;font-size:10.5px;color:var(--muted);letter-spacing:0.03em;}
.icon-row{display:flex;align-items:center;gap:6px;}
.icon-btn{
  width:38px;height:38px;border-radius:11px;background:var(--panel-2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;position:relative;
}
.icon-btn svg{width:18px;height:18px;}
#profileIconBtn{border-radius:50%;overflow:hidden;background:none;border:none;padding:0;}
.badge{
  position:absolute;top:-4px;right:-4px;background:var(--green);color:#FFFFFF;
  font-size:9.5px;font-weight:700;border-radius:9px;min-width:16px;height:16px;
  display:flex;align-items:center;justify-content:center;padding:0 3px;
}

.search-bar{
  margin-top:12px;display:flex;align-items:center;gap:8px;
  background:var(--panel-2);border:1px solid var(--line);border-radius:13px;padding:10px 14px;
  max-width:1200px;margin-left:auto;margin-right:auto;
}
.search-bar svg{width:16px;height:16px;flex-shrink:0;color:var(--muted);}
.search-bar input{background:none;border:none;outline:none;color:var(--text);font-size:13.5px;width:100%;}
.search-bar input::placeholder{color:#5B6656;}

/* ---------- Content ---------- */
.content{padding:16px;max-width:1200px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column;}
@media (max-width:320px){
  .content{padding:10px;}
  .prod-grid{gap:8px;}
}
@media (min-width:480px){
  .content{padding:18px;}
}
@media (min-width:768px){
  .content{padding:22px 28px;}
  .billing-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
}
@media (min-width:1024px){
  .content{padding:28px clamp(28px, 5vw, 56px);}
}
@media (min-width:1440px){
  .content{padding:32px clamp(32px, 6vw, 96px);}
}
.section-title{
  display:flex;align-items:center;justify-content:space-between;margin:18px 0 12px;
}
.section-title h3{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:16px;margin:0;letter-spacing:0.01em;}
.section-title .see-all{font-size:12px;color:var(--green);font-weight:600;}
.section-title:first-child{margin-top:0;}

.chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:4px;scrollbar-width:none;}
.chip-row::-webkit-scrollbar{display:none;}
.chip{
  flex-shrink:0;padding:8px 15px;border-radius:20px;font-size:12.5px;font-weight:600;
  background:var(--panel-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap;
}
.chip.active{background:var(--green-dim);border-color:var(--green);color:var(--green);}

.cat-heading{display:flex;align-items:center;gap:10px;margin:22px 0 14px;}
.cat-heading:first-child{margin-top:0;}
.cat-heading .bar{width:4px;height:18px;background:var(--green);border-radius:2px;flex-shrink:0;}
.cat-heading h3{
  color:var(--green);text-transform:uppercase;font-weight:800;font-size:14.5px;
  letter-spacing:0.05em;font-family:'Rajdhani',sans-serif;margin:0;white-space:nowrap;
}
.cat-heading .line{flex:1;height:1px;background:linear-gradient(90deg, var(--line), transparent);}

.prod-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));gap:14px;}
@media (min-width:640px){.prod-grid{grid-template-columns:repeat(auto-fill, minmax(170px, 1fr));gap:18px;}}
@media (min-width:1024px){.prod-grid{grid-template-columns:repeat(auto-fill, minmax(190px, 1fr));gap:22px;}}
.prod-card{
  background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  display:flex;flex-direction:column;cursor:pointer;
}
.prod-cover{
  height:92px;display:flex;align-items:center;justify-content:center;
  font-size:30px;position:relative;
}
.prod-badge{
  position:absolute;top:8px;left:8px;background:rgba(6,23,13,0.75);color:var(--green);
  font-size:9.5px;font-weight:700;padding:3px 8px;border-radius:8px;text-transform:uppercase;letter-spacing:0.04em;
}
.prod-badge.hot{background:#E23B57;color:#fff;}
.prod-body{padding:10px 12px 12px;flex:1;display:flex;flex-direction:column;}
.prod-name{font-weight:700;font-size:13px;margin-bottom:2px;}
.prod-sub{font-size:11px;color:var(--muted);margin-bottom:10px;}
.prod-foot{display:flex;align-items:center;justify-content:space-between;}
.prod-price{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:15px;color:var(--green);}
.buy-btn{
  background:var(--ink);color:#FFFFFF;font-weight:700;font-size:11.5px;
  padding:7px 12px;border-radius:9px;
}
.buy-btn:active{transform:scale(0.95);}
.buy-btn:disabled{opacity:0.35;}

/* ---------- Variant sheet ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(4,6,5,0.65);z-index:80;display:none;align-items:flex-end;justify-content:center;}
.sheet-bg.show{display:flex;}
.sheet{
  width:100%;background:var(--panel);border-top-left-radius:22px;border-top-right-radius:22px;
  border:1px solid var(--line);border-bottom:none;padding:20px 18px 26px;max-height:82vh;overflow-y:auto;
  animation:sheetUp .22s ease-out;
}
@media (min-width:640px){
  .sheet{max-width:480px;border-radius:22px;border-bottom:1px solid var(--line);margin-bottom:5vh;}
}
@keyframes sheetUp{from{transform:translateY(30px);opacity:0.4;} to{transform:translateY(0);opacity:1;}}
.sheet-handle{width:36px;height:4px;background:var(--line);border-radius:3px;margin:0 auto 16px;}
.sheet h3{font-family:'Rajdhani',sans-serif;font-size:20px;margin:0 0 3px;}
.sheet .sub{color:var(--muted);font-size:12.5px;margin-bottom:16px;}
.variant-list{display:flex;flex-direction:column;gap:8px;margin-bottom:18px;}
.variant-item{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;
}
.variant-item.selected{border-color:var(--green);background:var(--green-dim);}
.variant-item .vname{font-weight:600;font-size:13.5px;}
.variant-item .vstock{font-size:10.5px;color:var(--muted);margin-top:2px;}
.variant-item .vprice{font-family:'Rajdhani',sans-serif;font-weight:700;color:var(--green);font-size:14.5px;}
.variant-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
.variant-tile{
  position:relative;padding:14px 12px;border-radius:13px;border:1.5px solid var(--line);background:var(--panel-2);cursor:pointer;text-align:center;
  transition:border-color .12s, background .12s;
}
.variant-tile.selected{border-color:var(--green);background:var(--green-dim);}
.variant-tile .vname{font-weight:700;font-size:14px;margin-bottom:4px;}
.variant-tile .vprice{font-family:'Rajdhani',sans-serif;font-weight:700;color:var(--green);font-size:15px;}
.variant-tile .vstock{font-size:10px;color:var(--muted);margin-top:3px;}
.field-uid{margin-bottom:16px;}
.field-uid label{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;display:block;margin-bottom:6px;}
.field-uid input{
  width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:11px;color:var(--text);
  padding:11px 13px;font-size:13.5px;outline:none;
}
.field-uid input:focus{border-color:var(--green);}

.btn{
  width:100%;padding:14px;border-radius:13px;font-weight:700;font-size:14px;text-align:center;
}
.btn-green{background:var(--ink);color:#FFFFFF;}
.btn-green:disabled{opacity:0.35;}
.btn-ghost{background:var(--panel-2);border:1px solid var(--line);color:var(--text);}
.btn-red-ghost{background:transparent;border:1px solid #3A2530;color:var(--red);}

/* ---------- Bottom nav ---------- */
.bottomnav{
  position:fixed;bottom:0;left:0;right:0;z-index:40;
  display:flex;justify-content:center;
}
.bottomnav-inner{
  width:100%;max-width:1200px;background:rgba(10,13,11,0.92);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));
}
@media (min-width:640px){
  .bottomnav-inner{padding-left:32px;padding-right:32px;}
}
@media (min-width:1024px){
  .bottomnav-inner{padding-left:56px;padding-right:56px;}
}
.nav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:12px;color:var(--muted);
}
.nav-btn svg{width:20px;height:20px;}
.nav-btn span{font-size:9.5px;font-weight:600;}
.nav-btn.active{color:var(--green);}

/* ---------- Auth modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(4,6,5,0.7);z-index:90;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-bg.show{display:flex;}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px;max-width:380px;width:100%;}
.modal h2{font-family:'Rajdhani',sans-serif;font-size:21px;margin:0 0 4px;}
.modal .sub{color:var(--muted);font-size:12.5px;margin-bottom:18px;}
.led-banner{background:#000000;height:26px;width:100%;border-radius:8px;overflow:hidden;position:relative;margin-bottom:18px;display:flex;align-items:center;}
.led-track{white-space:nowrap;color:#00FF66;font-family:'Courier New',monospace;font-weight:700;font-size:12px;text-shadow:0 0 4px #00FF66,0 0 10px #00FF66,0 0 16px rgba(0,255,102,0.6);animation:ledMarquee 15s linear infinite;padding-left:100%;}
@keyframes ledMarquee{0%{transform:translateX(0);}100%{transform:translateX(-100%);}}
.modal .field{margin-bottom:12px;}
.modal .field label{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;display:block;margin-bottom:6px;}
.modal .field input{
  width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:11px;color:var(--text);
  padding:11px 13px;font-size:13.5px;outline:none;
}
.modal .field input:focus{border-color:var(--green);}
.modal-switch{text-align:center;margin-top:14px;font-size:12.5px;color:var(--muted);}
.modal-switch b{color:var(--green);cursor:pointer;}
.modal-close{position:absolute;top:16px;right:16px;color:var(--muted);font-size:18px;}
.modal{position:relative;}

/* ---------- Generic page ---------- */
.page-header{margin-bottom:16px;}
.page-header h2{font-family:'Rajdhani',sans-serif;font-size:22px;margin:0;}
.page-header p{color:var(--muted);font-size:12.5px;margin:3px 0 0;}

.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;}

/* Wallet */
.balance-card{
  background:linear-gradient(140deg, rgba(34,197,94,0.16), rgba(34,197,94,0.02));
  border:1px solid var(--green-dim);border-radius:18px;padding:20px;margin-bottom:16px;
}
.balance-card .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;}
.balance-card .amount{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:34px;margin:4px 0 14px;}
.wallet-actions{display:flex;gap:10px;}
.wallet-actions button{flex:1;}
.segmented{
  position:relative;display:flex;background:var(--panel-2);border:1px solid var(--line);
  border-radius:13px;padding:4px;margin-bottom:16px;
}
.segmented-thumb{
  position:absolute;top:4px;left:4px;width:calc(33.333% - 4px);height:calc(100% - 8px);
  background:var(--ink);border-radius:10px;transition:transform 250ms cubic-bezier(.4,0,.2,1);z-index:0;
}
.segmented-btn{
  position:relative;z-index:1;flex:1;background:none;border:none;padding:10px 4px;
  font-size:12.5px;font-weight:700;color:var(--muted);border-radius:10px;transition:color 150ms;
}
.segmented-btn.active{color:#fff;}
.btn-sm{padding:10px;border-radius:11px;font-weight:700;font-size:12.5px;}

.natcash-box{background:var(--panel-2);border:1px dashed var(--green);border-radius:13px;padding:14px;margin-bottom:14px;}
.natcash-box .row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;}
.natcash-box .row b{font-family:'JetBrains Mono',monospace;color:var(--green);}

.paycard{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:#FDF3D6;border:1.5px solid #F0D888;border-radius:16px;
  padding:16px 16px;margin-bottom:12px;
}
.paycard-info{min-width:0;}
.paycard-number{
  font-family:'JetBrains Mono',monospace;font-weight:700;font-size:21px;color:#B4530A;
  letter-spacing:0.01em;word-break:break-all;
}
.paycard-name{font-size:12.5px;color:#8A7A56;margin-top:4px;}
.paycard-copy{
  flex-shrink:0;background:#fff;border:1px solid #F0D888;color:#B4530A;
  font-weight:700;font-size:13px;padding:10px 18px;border-radius:12px;
}
.paycard-copy:active{transform:scale(0.96);}

.tx-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #171D14;}
.tx-row:last-child{border-bottom:none;}
.tx-left{display:flex;align-items:center;gap:10px;}
.tx-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;}
.tx-icon.in{background:var(--green-dim);}
.tx-icon.out{background:var(--red-dim);}
.tx-title{font-size:13px;font-weight:600;}
.tx-date{font-size:10.5px;color:var(--muted);}
.tx-amount{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:13px;}
.tx-amount.in{color:var(--green);}
.tx-amount.out{color:var(--red);}

/* Orders */
.order-card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:10px;}
.order-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.order-name{font-weight:700;font-size:13.5px;}
.order-date{font-size:10.5px;color:var(--muted);}
.order-pin{
  background:#FDF3D6;border:1.5px solid #F0D888;border-radius:16px;padding:16px 16px;
  display:flex;justify-content:space-between;align-items:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:18px;color:#B4530A;letter-spacing:0.01em;word-break:break-all;
}
.copy-mini{flex-shrink:0;background:#fff;border:1px solid #F0D888;color:#B4530A;font-weight:700;font-size:12.5px;padding:9px 16px;border-radius:12px;margin-left:10px;}
.copy-mini:active{transform:scale(0.96);}

/* Redeem */
.redeem-input{
  width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:13px;color:var(--text);
  padding:14px;font-size:15px;font-family:'JetBrains Mono',monospace;text-align:center;letter-spacing:0.06em;outline:none;margin-bottom:14px;
}
.redeem-input:focus{border-color:var(--green);}

/* Menu drawer */
.drawer-bg{position:fixed;inset:0;background:rgba(4,6,5,0.6);z-index:70;display:none;}
.drawer-bg.show{display:block;}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:78%;max-width:300px;background:var(--panel);
  border-left:1px solid var(--line);z-index:71;transform:translateX(100%);transition:transform .22s ease;
  padding:20px;overflow-y:auto;
}
.drawer.show{transform:translateX(0);}
.drawer-user{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--line);}
.drawer-avatar{width:44px;height:44px;border-radius:50%;background:var(--green-dim);color:var(--green);display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Rajdhani',sans-serif;font-size:17px;}
.drawer-name{font-weight:700;font-size:14px;}
.drawer-email{font-size:11px;color:var(--muted);}
.drawer-item{display:flex;align-items:center;gap:12px;padding:12px 8px;border-radius:11px;font-size:13.5px;font-weight:600;}
.drawer-item:active{background:var(--panel-2);}
.drawer-item svg{width:18px;height:18px;color:var(--muted);}
.drawer-item.danger{color:var(--red);}
.drawer-item.danger svg{color:var(--red);}

/* Toast */
.rapo-bar:hover .rapo-tooltip{opacity:1;}
.toast{
  position:fixed;bottom:92px;left:50%;transform:translateX(-50%) translateY(14px) scale(0.96);
  background:rgba(16,20,28,0.96);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.08);color:#FFFFFF;
  padding:12px 20px;border-radius:14px;font-size:13px;font-weight:500;line-height:1.4;opacity:0;pointer-events:none;
  transition:opacity .25s cubic-bezier(0.4,0,0.2,1), transform .25s cubic-bezier(0.4,0,0.2,1); z-index:95;box-shadow:0 12px 32px rgba(0,0,0,0.28);max-width:85%;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}

.empty{text-align:center;padding:50px 20px;color:var(--muted);}
.empty .em-icon{font-size:34px;margin-bottom:10px;}
.empty .em-title{font-family:'Rajdhani',sans-serif;font-size:16px;color:var(--text);margin-bottom:4px;}

.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10.5px;font-weight:700;}
.pill.wait{background:var(--amber-dim);color:var(--amber);}
.pill.ok{background:var(--green-dim);color:var(--green);}
.pill.no{background:var(--red-dim);color:var(--red);}

/* Admin */
.admin-tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none;}
.admin-tabs::-webkit-scrollbar{display:none;}
.atab{flex-shrink:0;padding:8px 14px;border-radius:10px;font-size:12px;font-weight:700;color:var(--muted);background:var(--panel-2);border:1px solid var(--line);white-space:nowrap;}
.atab.active{background:var(--green-dim);color:var(--green);border-color:var(--green);}
table{width:100%;border-collapse:collapse;display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.tut-card{background:#fff;border:1px solid #ECEFEA;border-radius:16px;margin-bottom:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.04);}
.tut-header{display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer;user-select:none;}
.tut-num{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;color:var(--green);flex-shrink:0;}
.tut-title{flex:1;font-weight:700;font-size:14px;color:#1a1a1a;}
.tut-arrow{flex-shrink:0;font-size:14px;color:var(--muted);transition:transform 0.35s cubic-bezier(0.4,0,0.2,1);}
.tut-body{max-height:0;overflow:hidden;transition:max-height 0.4s cubic-bezier(0.4,0,0.2,1);}
.tut-body-inner{padding:0 18px 18px;}
.tut-media{width:100%;aspect-ratio:16/9;}
@media (max-width:480px){
  .tut-media{max-width:340px;margin:0 auto;display:block;}
}
img{max-width:100%;height:auto;}
html,body{overflow-x:hidden;}
th{font-size:10px;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);}
td{padding:8px 8px;font-size:12px;border-bottom:1px solid #171D14;}
.mini-btn{padding:5px 9px;border-radius:7px;font-size:10.5px;font-weight:700;background:var(--panel-2);border:1px solid var(--line);}
textarea.admin-ta{
  width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:11px;color:var(--text);
  padding:11px;font-family:'JetBrains Mono',monospace;font-size:12px;min-height:100px;outline:none;
}

.disclaimer{
  background:var(--amber-dim);border:1px solid #4A3A15;border-radius:12px;padding:12px 14px;font-size:11.5px;
  color:#E8CE8C;line-height:1.5;margin-bottom:16px;
}
@keyframes shakeX { 0%,100%{transform:translateX(0);} 15%{transform:translateX(-8px);} 30%{transform:translateX(7px);} 45%{transform:translateX(-6px);} 60%{transform:translateX(5px);} 75%{transform:translateX(-3px);} 90%{transform:translateX(2px);} }
@keyframes offlineBarMove { 0%{ transform:translateX(-100px); } 50%{ transform:translateX(180px); } 100%{ transform:translateX(-100px); } }
@keyframes skelShimmer { 0%{ background-position:-200px 0; } 100%{ background-position:200px 0; } }
.skel-card{ background:var(--panel); border-radius:14px; padding:10px; }
.skel-img{ width:100%; aspect-ratio:1; border-radius:10px; background:linear-gradient(90deg, var(--panel-2) 25%, #e8ebee 37%, var(--panel-2) 63%); background-size:400px 100%; animation:skelShimmer 1.4s infinite linear; }
.skel-line{ border-radius:6px; background:linear-gradient(90deg, var(--panel-2) 25%, #e8ebee 37%, var(--panel-2) 63%); background-size:400px 100%; animation:skelShimmer 1.4s infinite linear; }

function handleLogoTap(){

function openAdminLoginModal(){

}
async function tryAdminLogin(){
  const email = document.getElementById('adminEmail').value.trim().toLowerCase();
  const val = document.getElementById('adminPass').value;
  try{
    const sb = await getSupabase();
    const { data, error } = await sb.auth.signInWithPassword({ email, password: val });
    if(!error && data.session){
      await syncLocalUserFromAuth(data.user);
      closeAuthModal();
      goPage('admin');
      showToast('Byenveni, Super Admin');
      return;
    }
    const sub = state.admins.find(a=>a.passcode===val && a.email===email);
    if(sub){
      state.isAdmin = true; state.isSuperAdmin = false;
      closeAuthModal();
      goPage('admin');
      showToast('⚠️ Kont sa a pa gen vrè otantifikasyon Supabase — chanjman ap rete lokal sèlman');
      return;
    }
    showToast('Imèl oswa modpas pa bon');
  }catch(e){
    showToast('Pa ka konekte ak sèvè a — eseye ankò');
  }
}

async function fetchProductsFromServer(){
  try{
    const sb = await getSupabase();
    const { data: prods, error } = await sb.from('products').select('*');
    if(error) throw error;
    if(!prods || prods.length === 0){
      await seedProductsToServer();
    } else {
      const { data: vars } = await sb.from('variants').select('*');
      const { data: configs } = await sb.from('manual_configs').select('*');
      state.products = prods.map(p => {
        const obj = {
          id:p.id, name:p.name, category:p.category, icon:p.icon, image:p.image, description:p.description,
          type:p.type, popular:!!p.popular, active:p.active!==false, badge:p.badge||null, outOfStock:!!p.out_of_stock,
          redeemInstructions:p.redeem_instructions||'', redeemLink:p.redeem_link||'', descriptions:p.descriptions||[],
          sortOrder:p.sort_order||0
        };
        if(p.type === 'calculator'){
          const mc = (configs||[]).find(c=>c.product_id===p.id);
          obj.manualConfig = mc ? { taux:Number(mc.taux), frais:Number(mc.frais||0), min:Number(mc.min_amount), max:Number(mc.max_amount), fields:mc.fields||[], feeTiers:mc.fee_tiers||[] } : {taux:145,frais:0,min:5,max:500,fields:[],feeTiers:[]};
        } else {
          obj.variants = (vars||[]).filter(v=>v.product_id===p.id).map(v=>({id:v.id, label:v.label, price:Number(v.price), woodflixProductId:v.woodflix_product_id||null, requiresServerId:!!v.requires_server_id, sortOrder:v.sort_order||0}));
          if(p.type === 'form'){ obj.formFields = p.form_fields || []; }
        }
        return obj;
      });
      state.products.sort((a,b)=>(a.sortOrder||0)-(b.sortOrder||0));
      state.productsLoaded = true;
      await saveState();
      renderShop();
      if(document.getElementById('adminTabs')) renderAdminTab();
    }
  }catch(e){ console.warn('fetchProductsFromServer failed:', e?.message || e?.error_description || e?.code || JSON.stringify(e) || e); }
  await fetchCategoriesFromServer();
  if(pendingProductSlug){
    const found = state.products.find(p => slugify(p.name) === pendingProductSlug);
    if(found){ pendingProductSlug = null; openProduct(found.id, { skipHistory:true }); }
  }
}

/* Called after each PIN unit successfully claimed during checkout */
async function incrementRewardProgress(userId, variantId){
  const matchingPrograms = (Array.isArray(state.rewardPrograms) ? state.rewardPrograms : []).filter(p => p.active && p.variantId === variantId);
  for(const program of matchingPrograms){
    try{
      const sb = await getSupabase();
      const current = state.rewardProgress[program.id] || 0;
      const newCount = current + 1;
      if(newCount >= program.purchasesRequired){
        await sb.from('reward_progress').upsert({ user_id:userId, program_id:program.id, count:0, updated_at:new Date().toISOString() });
        state.rewardProgress[program.id] = 0;
        await claimRewardForProgram(userId, program);
      } else {
        await sb.from('reward_progress').upsert({ user_id:userId, program_id:program.id, count:newCount, updated_at:new Date().toISOString() });
        state.rewardProgress[program.id] = newCount;
      }
    }catch(e){ console.warn('incrementRewardProgress failed:', e?.message || e); }
  }
}

/* Called after admin adds new reward stock, to auto-fulfill any customers waiting */
async function fulfillPendingRewardsForVariant(rewardVariantId){
  try{
    const sb = await getSupabase();
    const programIds = state.rewardPrograms.filter(p => p.rewardVariantId === rewardVariantId).map(p=>p.id);
    if(programIds.length === 0) return;
    const { data: pendings } = await sb.from('reward_pending').select('*').in('program_id', programIds).eq('fulfilled', false).order('created_at',{ascending:true});
    if(!pendings) return;
    for(const pending of pendings){
      const { data: pinRow } = await sb.from('reward_stock').select('*').eq('variant_id', rewardVariantId).eq('status','dispo').order('created_at',{ascending:true}).limit(1).maybeSingle();
      if(!pinRow) break;
      await sb.from('reward_stock').update({ status:'vann' }).eq('id', pinRow.id);
      await sb.from('reward_claims').insert({ user_id:pending.user_id, program_id:pending.program_id, variant_id:rewardVariantId, pin_code:pinRow.code });
      await sb.from('reward_pending').update({ fulfilled:true }).eq('id', pending.id);
    }
  }catch(e){ console.warn('fulfillPendingRewardsForVariant failed:', e?.message || e); }
}

/* Called after admin adds new PIN stock for a regular product, to auto-fulfill any customers waiting */
async function fulfillPendingPinOrdersForVariant(variantId){
  try{
    const sb = await getSupabase();
    const { data: pendings, error: pendErr } = await sb.from('pending_pin_orders').select('*').eq('variant_id', variantId).eq('fulfilled', false).order('created_at',{ascending:true});
    if(pendErr){ console.warn('fulfillPendingPinOrdersForVariant select erè:', pendErr); showToast('⚠️ 1) Erè li ke a: ' + pendErr.message); return; }
    console.log('DEBUG fulfillment — kòmand k ap tann pou variant', variantId, ':', pendings);
    if(!pendings || pendings.length===0){ return; }
    console.log('Fulfillment:', pendings.length, 'kòmand jwenn pou variant_id=' + variantId);
    for(const pending of pendings){
      const { data: pinRow, error: pinSelErr } = await sb.from('pins').select('*').eq('variant_id', variantId).eq('status','dispo').order('created_at',{ascending:true}).limit(1).maybeSingle();
      if(pinSelErr){ showToast('⚠️ 2) Erè chèche PIN: ' + pinSelErr.message); return; }
      if(!pinRow){
        const { data: allPinsForVariant } = await sb.from('pins').select('code,status').eq('variant_id', variantId);
        console.log('DEBUG — tout PIN pou variant_id', variantId, ':', allPinsForVariant);
        console.log('Fulfillment: pa gen PIN dispo pou', variantId, '—', (allPinsForVariant?.length||0), 'PIN total');
        break;
      }
      console.log('DEBUG fulfillment — pinRow jwenn:', pinRow, '— pending order_id:', pending.order_id);
      const { error: pinUpdErr } = await sb.from('pins').update({ status:'vann' }).eq('id', pinRow.id);
      if(pinUpdErr){ showToast('⚠️ 3) Erè PIN update: ' + pinUpdErr.message); return; }
      const { data: updatedOrder, error: ordErr } = await sb.from('orders').update({ status:'terminee', pin_code:pinRow.code }).eq('id', pending.order_id).select().maybeSingle();
      if(ordErr){ showToast('⚠️ 4) Erè kòmand update: ' + ordErr.message); return; }
      console.log('DEBUG fulfillment — updatedOrder retounen:', updatedOrder);
      if(!updatedOrder){ showToast('⚠️ 4b) Update pa jwenn okenn liy ak id=' + pending.order_id + ' — order_id sa a ka pa egziste nan tab orders'); return; }
      const { error: fulErr } = await sb.from('pending_pin_orders').update({ fulfilled:true }).eq('id', pending.id);
      if(fulErr){ showToast('⚠️ 5) Erè fulfilled update: ' + fulErr.message); return; }
      console.log('Fulfillment: kòmand #' + (updatedOrder.order_no||'?') + ' chanje pou Terminée');
      try{
        const { data: profileRow } = await sb.from('profiles').select('*').eq('id', pending.user_id).maybeSingle();
        const emailUser = { name: profileRow?.name || 'Kliyan', email: profileRow?.email };
        if(updatedOrder && emailUser.email){
          const orderForEmail = { orderNo: updatedOrder.order_no, date: updatedOrder.created_at, product: updatedOrder.product, variant: updatedOrder.variant, price: updatedOrder.price, pin: pinRow.code };
          sendOrderReceiptEmail(orderForEmail, emailUser);
        }
      }catch(emailErr){ console.warn('fulfillPendingPinOrdersForVariant email failed:', emailErr?.message || emailErr); }
    }
  }catch(e){ console.warn('fulfillPendingPinOrdersForVariant failed:', e?.message || e); showToast('⚠️ Fulfillment erè sinkwòn: ' + (e?.message||'enkoni')); }
}

async function fetchCategoriesFromServer(){
  try{
    const sb = await getSupabase();
    const { data, error } = await sb.from('categories').select('*').order('sort_order', { ascending:true });
    if(error) throw error;
    if(!data || data.length === 0){
      await seedCategoriesToServer();
      return;
    }
    state.categories = data.map(c => ({ id:c.id, name:c.name, icon:c.icon, image:c.image, sortOrder:c.sort_order }));
    await saveState();
    if(document.getElementById('adminTabs')) renderAdminTab();
  }catch(e){ /* categories table may not exist yet — shop falls back to product.category strings */ }
}

async function seedCategoriesToServer(){
  try{
    const sb = await getSupabase();
    const distinctCats = [...new Set(state.products.map(p=>p.category).filter(Boolean))];
    const seedList = distinctCats.length ? distinctCats : ['Jeux'];
    for(let i=0;i<seedList.length;i++){
      const { data: inserted } = await sb.from('categories').insert({ name: seedList[i], sort_order: i }).select().single();
      if(inserted){ state.categories.push({ id:inserted.id, name:inserted.name, icon:null, image:null, sortOrder:i }); }
    }
    await saveState();
  }catch(e){}
}

async function seedProductsToServer(){
  try{
    const sb = await getSupabase();
    for(const p of state.products){
      const { data: inserted, error } = await sb.from('products').insert({
        name:p.name, category:p.category, icon:p.icon, image:p.image, description:p.description||null,
        type:p.type||'pin', popular:!!p.popular, active:p.active!==false,
        form_fields: p.type==='form' ? (p.formFields||[]) : []
      }).select().single();
      if(error || !inserted) continue;
      p.id = inserted.id; // adopt the real server UUID locally
      if(p.type==='calculator' && p.manualConfig){
        await sb.from('manual_configs').insert({
          product_id:p.id, taux:p.manualConfig.taux, frais:p.manualConfig.frais,
          min_amount:p.manualConfig.min, max_amount:p.manualConfig.max,
          fields:p.manualConfig.fields||[], fee_tiers:p.manualConfig.feeTiers||[]
        });
      } else if(p.variants){
        for(const v of p.variants){
          const { data: vIns } = await sb.from('variants').insert({ product_id:p.id, label:v.label, price:v.price }).select().single();
          if(vIns){
            const oldVid = v.id;
            v.id = vIns.id; // adopt the real server UUID locally
            if(state.inventory[oldVid]){
              state.inventory[v.id] = state.inventory[oldVid];
              delete state.inventory[oldVid];
            }
          }
        }
      }
    }
    await saveState();
    renderShop();
  }catch(e){}
}

const SUPABASE_URL = 'https://nzbnlecbtvbnulkknqbi.supabase.co';
const SUPABASE_KEY = 'sb_publishable_FuR-1uEkz6pLdwnHamIJqQ_9dkC8K_U';
let sbClient = null;
const SUPABASE_CDN_URLS = [
  'https://cdnjs.cloudflare.com/ajax/libs/supabase-js/2.45.4/supabase.min.js',
  'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js',
  'https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js'
];
function loadScriptFrom(url){
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = url;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('load failed: ' + url));
    document.head.appendChild(s);
  });
}
async function loadSupabaseLib(){
  if(window.supabase) return;
  let lastErr = null;
  for(const url of SUPABASE_CDN_URLS){
    try{ await loadScriptFrom(url); if(window.supabase) return; }
    catch(e){ lastErr = e; }
  }
  throw lastErr || new Error('Supabase library could not load from any source');
}
async function getSupabase(){
  if(sbClient) return sbClient;
  await loadSupabaseLib();
  if(!window.supabase){ throw new Error('window.supabase pa disponib apre chajman'); }
  sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  return sbClient;
}

  const googleName = authUser.user_metadata?.full_name || authUser.user_metadata?.name;

  const name = profile?.name || fallbackName || googleName || authUser.email.split('@')[0];

  if(!profile){
    try{
      await sb.from('profiles').insert({ id: authUser.id, name, email: authUser.email, is_admin: authUser.email===ADMIN_EMAIL, is_super_admin: authUser.email===ADMIN_EMAIL });

      suspendedUntil: profile?.suspended_until || null, suspensionHistory: profile?.suspension_history || [] };
    state.users.push(localUser);
    state.wallets[authUser.id] = state.wallets[authUser.id] || 0;
    state.transactions[authUser.id] = state.transactions[authUser.id] || [];
    state.orders[authUser.id] = state.orders[authUser.id] || [];
  } else {
    localUser.name = name;
    localUser.googlePhoto = googlePhoto || localUser.googlePhoto;
    localUser.savedWhatsapp = profile?.whatsapp || localUser.savedWhatsapp || '';
    localUser.accountStatus = profile?.account_status || 'active';
    localUser.suspensionReason = profile?.suspension_reason || '';

  }
  if(profile?.dismissed_notif_ids) state.dismissedNotifIds = profile.dismissed_notif_ids;
  if(profile?.seen_notif_ids) state.seenNotifIds = profile.seen_notif_ids;
  if(profile?.recharge_ref) currentRechargeRef = profile.recharge_ref;

async function fetchWalletFromServer(userId){
  try{
    const sb = await getSupabase();
    let { data: walletRow } = await sb.from('wallets').select('*').eq('user_id', userId).single();
    if(!walletRow){
      const created = await sb.from('wallets').insert({ user_id:userId, balance: state.wallets[userId]||0 }).select().single();
      walletRow = created.data;
    }
    if(walletRow) state.wallets[userId] = Number(walletRow.balance) || 0;
    if(!state.walletBonus) state.walletBonus = {};
    if(walletRow) state.walletBonus[userId] = Number(walletRow.bonus_balance) || 0;

    const { data: txs } = await sb.from('wallet_transactions').select('*').eq('user_id', userId).order('created_at', { ascending:false }).limit(100);
    if(txs){
      state.transactions[userId] = txs.map(t => ({ type:t.type, label:t.label, amount:Number(t.amount), date:t.created_at, txnId:t.txn_id, proofUrl:t.proof_url, reference:t.reference, isDepositCategory:!!t.is_deposit }));
    }
  }catch(e){
    // server not reachable / RLS not ready yet — keep using local numbers so the app still works
  }
}

let walletRealtimeChannel = null;
async function subscribeToWalletRealtime(userId){
  try{
    const sb = await getSupabase();
    if(walletRealtimeChannel){ sb.removeChannel(walletRealtimeChannel); }
    walletRealtimeChannel = sb.channel('wallet-rt-' + userId)
      .on('postgres_changes', { event:'*', schema:'public', table:'wallets', filter:'user_id=eq.'+userId }, payload => {
        if(payload.new && typeof payload.new.balance !== 'undefined'){
          state.wallets[userId] = Number(payload.new.balance) || 0;
          if(!state.walletBonus) state.walletBonus = {};
          if(typeof payload.new.bonus_balance !== 'undefined') state.walletBonus[userId] = Number(payload.new.bonus_balance) || 0;
          const balDisplay = document.getElementById('walletBalanceDisplay');
          if(balDisplay) balDisplay.textContent = money(walletBalance());
          renderTopIcons();
          if(returnToCheckoutAfterRecharge){
            returnToCheckoutAfterRecharge = false;
            goPage('checkout');
          } else if(currentPage === 'checkout'){
            render();
          }
        }
      })
      .on('postgres_changes', { event:'INSERT', schema:'public', table:'wallet_transactions', filter:'user_id=eq.'+userId }, payload => {
        if(!state.transactions[userId]) state.transactions[userId] = [];
        const already = state.transactions[userId].some(t=>t.date===payload.new.created_at && t.amount===Number(payload.new.amount));
        if(!already){
          state.transactions[userId].unshift({ type:payload.new.type, label:payload.new.label, amount:Number(payload.new.amount), date:payload.new.created_at });
          if(currentPage==='wallet') renderWalletTab();
        }
      })
      .subscribe();
  }catch(e){ /* realtime not available — app still works via manual fetch/refresh */ }
}

/* Central wallet mutation — updates locally AND writes through to Supabase so balance + history follow the account across devices. */
async function applyWalletChange(userId, delta, label, type, isBonus, txnId, proofUrl, reference, isDepositCategory){
  state.wallets[userId] = Math.round(((state.wallets[userId]||0) + delta) * 100) / 100;
  if(!state.walletBonus) state.walletBonus = {};
  if(!state.transactions[userId]) state.transactions[userId] = [];
  state.transactions[userId].unshift({ type, label, amount: Math.abs(delta), date: new Date().toISOString(), txnId: txnId||null, proofUrl: proofUrl||null, reference: reference||null, isDepositCategory: !!isDepositCategory });

  let bonus = state.walletBonus[userId] || 0;
  if(isBonus && delta > 0){
    bonus += delta; // kredi bonis (ex: Bonus de bienvenue) — konte apa, pa ka transfere
  } else if(delta < 0){
    bonus -= Math.min(bonus, Math.abs(delta)); // depans konsome bonis la anvan, otomatikman
  }
  state.walletBonus[userId] = Math.round(bonus * 100) / 100;

  try{
    const sb = await getSupabase();
    await sb.from('wallets').upsert({ user_id:userId, balance: state.wallets[userId], bonus_balance: bonus });
    await sb.from('wallet_transactions').insert({ user_id:userId, type, label, amount: Math.abs(delta), txn_id: txnId||null, proof_url: proofUrl||null, reference: reference||null, is_deposit: !!isDepositCategory });
  }catch(e){
    // couldn't reach the server — local balance still updated, will need a manual re-sync later
  }
}

  return name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}
const PAGE_PATHS = { shop:'/', wallet:'/wallet', commandes:'/commandes', redeem:'/redeem', historique:'/historique', parametres:'/parametres', panye:'/panier', admin:'/admin', tutoriel:'/tutoriel', checkout:'/checkout', kerryRewards:'/programme-fidelite', suspended:'/suspendu', aboutUs:'/a-propos', conditions:'/conditions', notifications:'/notifications' };
const PATH_PAGES = { '/':'shop', '/wallet':'wallet', '/commandes':'commandes', '/redeem':'redeem', '/historique':'historique', '/parametres':'parametres', '/panier':'panye', '/admin':'admin', '/tutoriel':'tutoriel', '/checkout':'checkout', '/programme-fidelite':'kerryRewards', '/suspendu':'suspended', '/a-propos':'aboutUs', '/conditions':'conditions', '/notifications':'notifications' };
let pendingProductSlug = null;

function goPage(page, opts){
  const guarded = ['wallet','commandes','historique'];
  if(guarded.includes(page) && !isLoggedIn()){
    openAuthModal('login'); pendingAction = ()=>goPage(page); return;
  }
  currentPage = page;
  closeDrawer();
  render();
  window.scrollTo(0,0);
  if(page === 'commandes'){ commandeVisibleCount = 5; fetchMyOrders(); subscribeToMyOrdersRealtime(); }
  if(page === 'shop'){ fetchProductsFromServer().then(() => fetchStockCountsForShop()); }
  if(['shop','wallet','panye','checkout','commandes','redeem','kerryRewards','tutoriel'].includes(page)){ maybeShowTutorialVideo(page, null); }
  if(page === 'wallet'){ maybeShowTutorialV2('recharge', null) || maybeShowTutorialV2('wallet', null); }
  else if(['shop','panye','checkout','commandes','redeem'].includes(page)){ maybeShowTutorialV2(page, null); }
  if(page === 'tutoriel'){ fetchTutorialVideos(); }
  if(page === 'kerryRewards' && isLoggedIn()){
    fetchRewardPrograms().then(()=>render());
    fetchRewardProgress(state.currentUserId).then(()=>render());
    fetchRewardClaims(state.currentUserId).then(()=>render());
  }
  if(!opts || !opts.skipHistory){
    const path = PAGE_PATHS[page] || '/';
    if(window.location.pathname !== path){ try{ history.pushState({ page }, '', path); }catch(e){ /* pushState blocked in this environment — app still works, URL just won't update */ } }
  }
}

function routeFromURL(){
  const path = window.location.pathname;
  if(path.startsWith('/product/')){
    const slug = path.replace('/product/','').replace(/\/$/,'');
    const found = state.products.find(p => slugify(p.name) === slug);
    if(found){ openProduct(found.id, { skipHistory:true }); }
    else { pendingProductSlug = slug; }
    return;
  }
  const page = PATH_PAGES[path];
  if(page){ goPage(page, { skipHistory:true }); }
}
window.addEventListener('popstate', () => {
  closeSheet();
  routeFromURL();
});

function render(){
  renderTopIcons();
  renderBottomNav();
  const c = document.getElementById('content');
  let body = '';
  if(currentPage === 'shop') body = pageShop();
  else if(currentPage === 'wallet'){ body = pageWallet(); }
  else if(currentPage === 'commandes') body = pageCommandes();
  else if(currentPage === 'redeem') body = pageRedeem();
  else if(currentPage === 'historique') body = pageHistorique(false);
  else if(currentPage === 'parametres') body = pageParametres();
  else if(currentPage === 'admin') body = pageAdmin();
  else if(currentPage === 'panye') body = pagePanye();
  else if(currentPage === 'product') body = pageProduct();
  else if(currentPage === 'tutoriel') body = pageTutorielV2();
  else if(currentPage === 'checkout') body = pageCheckout();
  else if(currentPage === 'kerryRewards') body = pageKerryRewards();
  else if(currentPage === 'suspended') body = pageSuspended();
  else if(currentPage === 'aboutUs') body = pageInfoFull('about_us', 'À propos de nous');
  else if(currentPage === 'conditions') body = pageInfoFull('terms', 'Conditions');
  else if(currentPage === 'notifications') body = pageNotifications();
  else if(currentPage && currentPage.indexOf('custompage:')===0) body = pageCustomInfo(currentPage.slice('custompage:'.length));
  c.innerHTML = '<div id="pageBodyWrap" style="flex:1;display:flex;flex-direction:column;">' + body + '</div>';
  if(currentPage === 'wallet') renderWalletTab();

}

function timeAgoText(dateStr){
  const diffMs = Date.now() - new Date(dateStr).getTime();
  const mins = Math.floor(diffMs/60000);
  if(mins < 1) return 'kounye a';
  if(mins < 60) return mins+'min';
  const hrs = Math.floor(mins/60);
  if(hrs < 24) return hrs+'h';
  const days = Math.floor(hrs/24);
  return days+' jou';
}
function getNotifItems(){
  const orders = state.orders[state.currentUserId] || [];
  const dismissed = state.dismissedNotifIds || [];
  const items = [];
  orders.forEach(o => {
    items.push({
      id:'recv-'+o.id, status:'processing',
      title:'Kòmand #'+(o.orderNo||'')+' an tou piti',
      text:'Nou resevwa kòmand ou a epi nou ap trete l. Ou pral resevwa pwodwi ou byento!',
      date:o.date
    });
    if(o.status === 'terminee'){
      items.push({
        id:'done-'+o.id, status:'complete',
        title:'Kòmand #'+(o.orderNo||'')+' konplè!',
        text:'Kòmand ou a livre avèk siksè. Mèsi pou konfyans ou nan Kerry Topup!',
        date:o.date
      });
    }
    if(o.adminResponse){
      items.push({
        id:'resp-'+o.id, status:'response',
        title:'Admin reponn kòmand #'+(o.orderNo||''),
        text:o.adminResponse,
        date:o.date
      });
    }
  });
  return items.filter(n => !dismissed.includes(n.id)).sort((a,b) => new Date(b.date) - new Date(a.date));
}

async function confirmApiTopupPurchase(productId){
  if(!isLoggedIn()){ openAuthModal('login'); return; }
  if(!state.currentUserId) return;
  const p0 = state.products.find(x=>x.id===productId);
  if(p0 && p0.outOfStock){ showToast('⚠️ ' + t('toast_out_of_stock')); return; }
  const buyBtn = document.getElementById('apiBuyBtn-'+productId);
  if(buyBtn && buyBtn.disabled) return; // deja ap trete — anpeche doub-klik
  if(buyBtn){ buyBtn.disabled = true; buyBtn.style.opacity = '0.6'; buyBtn.textContent = '⏳ Ap trete...'; }
  const p = state.products.find(x=>x.id===productId);
  let variant = p.variants.find(v=>v.id===selectedVariantId);
  if(!variant && p.variants.length > 0){ variant = p.variants[0]; selectedVariantId = variant.id; }
  if(!variant){ showToast('⚠️ Pa gen opsyon disponib pou pwodwi sa a — kontakte Admin'); if(buyBtn){buyBtn.disabled=false;buyBtn.style.opacity='1';buyBtn.textContent='⚡ Acheter maintenant';} return; }
  const playerId = document.getElementById('apiPlayerId-'+productId).value.trim();
  const serverIdInput = document.getElementById('apiServerId-'+productId);
  const serverId = serverIdInput ? serverIdInput.value.trim() : '';
  const qty = 1; // Woodflix sipòte sèlman 1 atik pa kòmand
  const totalPrice = variant.price * qty;
  const resetBtn = () => { if(buyBtn){buyBtn.disabled=false;buyBtn.style.opacity='1';buyBtn.textContent='⚡ Acheter maintenant';} };
  if(!playerId){ showToast(t('toast_enter_player_id')); resetBtn(); return; }
  if(walletBalance() < totalPrice){ showToast(t('toast_insufficient_balance')); resetBtn(); goPage('wallet'); return; }
  const verifiedName = (window.verifiedPlayerNames && window.verifiedPlayerNames[productId]) || null;
  try{
    const sb = await getSupabase();
    const orderNo = 'KT-' + Math.random().toString(36).slice(2, 10).toUpperCase();
    const { data: inserted, error: insErr } = await sb.from('orders').insert({
      order_no: orderNo, user_id: state.currentUserId, type: 'api_topup', status: 'en_cours',
      product: p.name, variant: variant.label + (qty>1?' × '+qty:''), price: totalPrice,
      player_id: playerId, server_id: serverId || null, player_name: verifiedName,
    }).select().single();
    if(insErr || !inserted){ showToast('⚠️ Erè kreye kòmand: ' + (insErr?.message||'enkoni')); resetBtn(); return; }

    await applyWalletChange(state.currentUserId, -totalPrice, p.name + ' — ' + variant.label, 'out');

    const { data, error } = await sb.functions.invoke('woodflix-place-order', {
      body: { local_product_id: variant.id, local_order_id: inserted.id, player_id: playerId, server_id: serverId || undefined, quantity: qty }
    });

    if(error || !data || data.error){
      // Woodflix refize — dedwi lajan an, mete kòmand la "echwe", epi RANBOUSE kliyan an
      await sb.from('orders').update({ status: 'anile' }).eq('id', inserted.id);
      await applyWalletChange(state.currentUserId, totalPrice, 'Ranbousman — ' + p.name, 'in');
      await fetchWalletFromServer(state.currentUserId);
      showToast('⚠️ ' + (data?.error || error?.message || 'Woodflix refize kòmand lan — ou ranbouse'));
      resetBtn();
      return;
    }

    // Pa bezwen yon dezyèm update — woodflix-place-order deja mete status ajou nan tab orders la

    const order = {
      id: inserted.id, orderNo, type:'api_topup', status: data.order?.status==='completed'?'terminee':'en_cours',
      product: p.name, variant: variant.label + (qty>1?' × '+qty:''), price: totalPrice, date: new Date().toISOString(),
      playerId, serverId: serverId || null, playerName: verifiedName
    };
    if(!state.orders[state.currentUserId]) state.orders[state.currentUserId] = [];
    state.orders[state.currentUserId].unshift(order);
    fetchWalletFromServer(state.currentUserId); // background — pa bezwen tann sa pou kontinye
    notifyAdminNewSale(order);
    incrementRewardProgress(state.currentUserId, variant.id); // fè pwogram fidelite avanse pou acha otomatik yo tou
      showToast(t('toast_purchase_success'));
    goPage('commandes');
  }catch(e){
    showToast('⚠️ Erè rezo pandan acha a');
    resetBtn();
  }
}
function renderFormSheet(p){
  const sv = sortedVariants(p);
  const prices = p.variants.map(v=>v.price);
  const minP = Math.min(...prices), maxP = Math.max(...prices);
  return `
    <div class="sheet-handle"></div>
    ${p.image ? `<img src="${p.image.replace(/"/g,'')}" alt="${escapeHtml(p.name)}" style="width:100%;max-height:160px;object-fit:contain;border-radius:14px;margin-bottom:12px;background:var(--panel-2);">` : ''}
    <h3>${p.image?'':escapeHtml(p.icon)+' '}${escapeHtml(p.name)}</h3>
    <div class="sub">${p.description ? escapeHtml(p.description) : 'Chwazi opsyon w vle achte a'}</div>
    ${renderDescriptionBlocks(p, 'above')}
    <div style="font-family:'Rajdhani',sans-serif;font-weight:700;font-size:20px;margin:6px 0 16px;">${minP} — ${maxP} <span style="font-size:12px;color:var(--muted);font-weight:600;">HTG</span></div>
    <div class="variant-grid" id="variantList">
      ${sv.map(v => '<div class="variant-tile ' + (v.id===selectedVariantId?'selected':'') + '" onclick="selectFormVariant(\'' + v.id + '\',\'' + p.id + '\')">' +
        (v.id===selectedVariantId ? '<div style="position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;">✓</div>' : '') +
        '<div class="vname">' + escapeHtml(v.label) + '</div>' +
        '<div class="vprice">' + v.price + ' HTG</div>' +
      '</div>').join('')}
    </div>
    ${renderDescriptionBlocks(p, 'below')}
    ${(p.formFields||[]).map((f,i) => {
      if(f.type === 'ffverify'){
        return `
          <div style="border:1.5px solid #C4B5FD;border-radius:16px;padding:18px;margin-bottom:16px;">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;">
              <span style="font-size:20px;">🎮</span>
              <span style="font-weight:800;font-size:16px;color:var(--text);">Info Compte</span>
              ${f.required ? '<span style="background:#FEE2E2;color:#DC2626;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;">* Obligatoire</span>' : ''}
            </div>
            <div style="font-size:13px;color:var(--muted);margin-bottom:14px;">Entrez votre ID Free Fire pour poursuivre l'achat.</div>
            <label style="font-size:13px;font-weight:700;color:var(--text);">${escapeHtml(f.label)}${f.required?' <span style="color:#DC2626;">*</span>':''}</label>
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--panel-2);border:1.5px solid #C4B5FD;border-radius:12px;padding:6px 6px 6px 12px;margin:8px 0 12px;">
              <span style="font-weight:900;font-style:italic;color:#7C3AED;font-size:16px;">F</span>
              <input type="text" id="formField-${i}" placeholder="Entrez votre ID joueur" style="flex:1;min-width:0;background:none;border:none;outline:none;font-size:14px;color:var(--text);padding:8px 0;">
              <button onclick="verifyFormFieldPlayer('${p.id}',${i})" style="display:flex;align-items:center;gap:6px;background:rgba(15,166,84,0.12);color:var(--green);border:none;border-radius:9px;padding:9px 14px;font-size:13px;font-weight:700;white-space:nowrap;flex-shrink:0;">🛡️ Vérifier</button>
            </div>
            <div id="formFieldVerifyResult-${i}"></div>
          </div>
        `;
      }
      return `<div class="field-uid"><label>${escapeHtml(f.label)}${f.required?' *':''}</label><input type="${f.type==='number'?'number':(f.type==='email'?'email':(f.type==='tel'?'tel':'text'))}" id="formField-${i}"></div>`;
    }).join('')}
    <div style="display:flex;gap:10px;">
      <button class="btn btn-ghost" style="flex:1;" onclick="addFormToCart('${p.id}')">Ajouter au panier</button>
      <button class="btn btn-green" style="flex:1;" onclick="confirmFormOrder('${p.id}')">Acheter maintenant</button>
    </div>
  `;
}
function selectFormVariant(variantId, productId){
  selectedVariantId = variantId;
  render();

async function confirmFormOrder(productId){
  if(!isLoggedIn()){
    openAuthModal('login');
    pendingAction = () => confirmFormOrder(productId);
    return;
  }
  const p = state.products.find(x=>x.id===productId);
  const v = p.variants.find(x=>x.id===selectedVariantId);
  if(!v){ showToast('Chwazi yon opsyon'); return; }
  const fields = p.formFields || [];
  const collected = {};
  for(let i=0;i<fields.length;i++){

function updateManualTotal(productId){
  const p = state.products.find(x=>x.id===productId);
  const c = p.manualConfig || {taux:145, frais:0, min:0, max:999999};
  const amt = parseFloat(document.getElementById('manualAmount').value) || 0;
  const frais = feeForAmount(c, amt);
  const total = (amt + frais) * (c.taux||0);
  document.getElementById('manualAmountDisplay').textContent = amt + ' USD';
  const fraisDisplay = document.getElementById('manualFraisDisplay');
  if(fraisDisplay) fraisDisplay.textContent = '+' + frais + ' USD';
  document.getElementById('manualTotalDisplay').textContent = money(Math.round(total));
  const errBox = document.getElementById('manualMaxError');
  const btnBox = document.getElementById('manualBuyButtons');
  const max = c.max || 999999;
  if(errBox && btnBox){
    if(amt > max){
      errBox.style.display = 'block';
      errBox.textContent = 'Ou pa ka kòmande plis pase ' + max + ' $';
      btnBox.style.display = 'none';
    } else {
      errBox.style.display = 'none';
      btnBox.style.display = 'flex';
    }
  }
}
function addManualToCart(productId){
  if(!isLoggedIn()){
    openAuthModal('login');
    pendingAction = () => openProduct(productId);
    return;
  }
  const p = state.products.find(x=>x.id===productId);
  const c = p.manualConfig || {taux:145, frais:2, min:0, max:999999, fields:[]};
  const u = currentUser();
  const amt = parseFloat(document.getElementById('manualAmount').value) || 0;
  if(amt < (c.min||0) || amt > (c.max||999999)){
    showToast('Kantite a dwe ant ' + c.min + ' ak ' + c.max + ' $'); return;
  }
  const customFields = {};
  let missingField = false;
  (c.fields||[]).map(normalizeManualField).forEach((f,i) => {
    const val = (document.getElementById('mField-'+i)?.value || '').trim();
    if(!val) missingField = true;
    customFields[f.label] = val;
  });
  if(missingField){ showToast('Ranpli tout chan yo — yo obligatwa'); return; }
  const total = Math.round((amt + feeForAmount(c, amt)) * (c.taux||0));
  state.cart.push({ id:uid(), productId:p.id, productName:p.name, type:'calculator', variantId:null, variantLabel:amt+' $', price:total, fields:customFields, montantUSD:amt, fraisUSD:feeForAmount(c, amt) });
  saveState();
  saveCartToServer();
  renderTopIcons();
  showToast('Ajoute nan panye ✓');
  goPage('shop');

async function claimPinFromServer(variantId){
  try{
    const sb = await getSupabase();
    const { data: code, error } = await sb.rpc('claim_pin', { p_variant_id: variantId });
    if(error) throw error;
    if(!code) return { ok:false, offline:false };
    return { ok:true, code, offline:false };
  }catch(e){

  }
}
async function checkStockAndNotifyIfEmpty(variantId, productName, variantLabel){
  try{
    const sb = await getSupabase();
    const { count } = await sb.from('pins').select('id', { count:'exact', head:true }).eq('variant_id', variantId).eq('status','dispo');
    if(count === 0){
      sendNtfyNotification('Stock ' + productName + ' - ' + variantLabel + ' fini', 'Ajoute nouvo estòk pou kliyan yo.');
    }
  }catch(e){ console.warn('checkStockAndNotifyIfEmpty failed:', e?.message || e); }
}

async function confirmPurchase(productId){
  if(!isLoggedIn()){
    openAuthModal('login');
    pendingAction = () => confirmPurchase(productId);
    return;
  }
  const p = state.products.find(x=>x.id===productId);
  if(p && p.outOfStock){ showToast('⚠️ ' + t('toast_out_of_stock')); return; }
  const v = p.variants.find(x=>x.id===selectedVariantId);
  if(!v){ showToast('Chwazi yon opsyon'); return; }

  showToast(t('toast_transaction_processing'));
  try{
    const sb = await getSupabase();
    const { data: result, error } = await sb.rpc('purchase_pin_secure', { p_variant_id: v.id });
    if(error){ showToast('⚠️ ' + (error.message || 'Erè pandan acha a')); return; }

    const outOfStock = result.status === 'en_cours';
    const order = {
      id: result.order_id, orderNo: result.order_no, type:'pin', status: result.status,
      product: result.product_name, variant: result.variant_label, price: Number(result.price),
      pin: result.pin_code, date: new Date().toISOString()
    };
    if(!state.orders[state.currentUserId]) state.orders[state.currentUserId] = [];
    state.orders[state.currentUserId].unshift(order);

    // cosmetic local sync so the shop page's stock counter doesn't look stale
    const local = (state.inventory[v.id] || []).find(x => x.status === 'dispo');
    if(local) local.status = 'vann';

    if(outOfStock){
      sendNtfyNotification('Stock ' + order.product + ' - ' + order.variant + ' fini', 'Yon kliyan an atant pou opsyon sa a.', 'default', 'package');
      sendOrderReceivedEmail(order, currentUser());
    } else {
      checkStockAndNotifyIfEmpty(v.id, order.product, order.variant);
      sendOrderReceiptEmail(order, currentUser());
    }
    notifyAdminNewSale(order);

    await fetchWalletFromServer(state.currentUserId);
    await fetchRewardProgress(state.currentUserId); // Kerry Rewards handled server-side inside the RPC now
    await saveState();
    showToast(outOfStock ? t('toast_order_processing') : t('toast_purchase_success'));
    goPage('commandes');
  }catch(e){
    showToast('⚠️ Erè: ' + (e?.message || 'enkoni'));
  }
}

/* ---- Proof-of-payment screenshot check (best-effort OCR — Admin still makes the final call) ---- */
function loadTesseract(){
  return new Promise((resolve, reject) => {
    if(window.Tesseract){ resolve(); return; }
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.1/tesseract.min.js';
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('load failed'));
    document.head.appendChild(s);
  });
}
async function runProofOcr(file, amount, txn, ref){
  await loadTesseract();
  const { data } = await Tesseract.recognize(file, 'eng');
  const text = data.text || '';
  const confidence = data.confidence || 0;
  const cleanUpper = text.toUpperCase().replace(/\s+/g,' ');
  const digitsOnly = text.replace(/\D/g,'');

  // photo quality: low OCR confidence or almost no readable text = can't verify seriously
  const qualityOk = confidence >= 35 && text.trim().length >= 15;

  // receipt type detection (SMS receipts never show the "kontni"/référence field)
  const isSmsReceipt = /TRANSCODE/i.test(text) || /\bBALANS\s*OU\b/i.test(text) || /\bFRE\s*:/i.test(text) || /YOUR\s*BALANCE/i.test(text) || /\bSOLDE\b/i.test(text);
  const isAppReceipt = /\bKONTNI\b/i.test(text) || /ID\s*TRANZAKSYON/i.test(text) || /TRANZAKSYON\s*AVEK\s*SIKS/i.test(text)
    || /TRANSACTION\s*ID/i.test(text) || /SUCCESSFUL\s*TRANSACTION/i.test(text) || /RECIPIENT.{0,15}(NAME|PHONE)/i.test(text)
    || /ID\s*DE\s*TRANSACTION/i.test(text) || /TRANSACTION\s*R[EÉ]USSIE/i.test(text) || /DESTINATAIRE/i.test(text);
  const receiptType = isSmsReceipt && !isAppReceipt ? 'sms' : (isAppReceipt ? 'app' : 'inconnu');

  // exact matches only for money-critical fields — no fuzzy tolerance here
  const txnDigits = (txn||'').replace(/\D/g,'');
  const txnOk = txnDigits ? digitsOnly.includes(txnDigits) : false;
  const amountOk = amount ? new RegExp('\\b' + Math.round(amount) + '\\b').test(digitsOnly + ' ' + text.replace(/[.,]00/g,'')) : false;

  // tolerant matches (case/spacing/accents) for name + receiver number
  const numberOk = digitsOnly.includes(state.paymentSettings.number);
  const nameNorm = cleanUpper.replace(/[^A-Z ]/g,'');
  const hasNameAnywhere = nameNorm.includes('CADET') && (nameNorm.includes('VANSKERRY') || (nameNorm.includes('VANS') && nameNorm.includes('KERRY')));
  // Verifye non an parèt kòm DESTINATÈ, pa moun k ap voye a — anpeche yon resi kote
  // Kerry Topup se moun k ap VOYE a (pa RESEVWA) yo itilize kòm fo prèv peman.
  // Aksan yo retire anvan (é→e, à→a) pou Kreyòl, Anglè, AK Fransè travay ak menm règ la.
  // SMS: "transfere/transferred/transféré [montan] a/to [non]"
  // App: chan "Non resepte a"/"Recipient's name"/"Nom du destinataire" swiv pa non an
  const noAccent = cleanUpper.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const smsRecipientMatch = noAccent.match(/TRANSFER(?:E|RED)?\s+[\d.,]+\s*(?:HTG)?\s*(?:A|TO)\s+([A-Z .]{3,40})/);
  const appRecipientMatch = noAccent.match(/(?:NON\s*RESEPTE\s*A|RECIPIENT.{0,15}NAME|NOM\s*DU\s*DESTINATAIRE)[:\s]+([A-Z .]{3,40})/);
  const recipientMatch = smsRecipientMatch || appRecipientMatch;
  const nameOk = hasNameAnywhere && (!recipientMatch || (recipientMatch[1].includes('CADET') && (recipientMatch[1].includes('VANSKERRY') || (recipientMatch[1].includes('VANS') && recipientMatch[1].includes('KERRY')))));

  const dateMatch = text.match(/(\d{2})\/(\d{2})\/(\d{4})\D{0,15}?(\d{2}):(\d{2})(?::(\d{2}))?/);
  let timeOk = null, minutesAgo = null;
  if(dateMatch){
    const [, dd, mm, yyyy, hh, min, ss] = dateMatch;
    const txnDate = new Date(+yyyy, +mm-1, +dd, +hh, +min, ss?+ss:0);
    minutesAgo = Math.round((Date.now() - txnDate.getTime()) / 60000);
    timeOk = minutesAgo >= -2 && minutesAgo <= 10;
  }

  // référence: only required/checked when the receipt format actually shows it (App receipts)
  const refApplicable = receiptType === 'app';
  const refDigits = (ref||'').replace(/\D/g,'');
  const refOk = refApplicable ? (refDigits ? digitsOnly.includes(refDigits) : false) : null;

  return { receiptType, qualityOk, confidence, numberOk, nameOk, amountOk, txnOk, timeOk, minutesAgo, refApplicable, refOk };
}
async function hashFile(file){
  const buf = await file.arrayBuffer();
  const digest = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

  }catch(e){ console.warn('recharge proof upload failed:', e?.message || e); proofPath = null; }

  let checks = null;
  try{ checks = await runProofOcr(file, amount, txn, ref); }catch(e){ checks = null; }

  const allGood = !!checks && checks.qualityOk && checks.numberOk && checks.nameOk &&
    checks.amountOk && checks.txnOk &&
    (checks.receiptType === 'sms' ? true : checks.timeOk === true) &&
    (checks.refApplicable ? checks.refOk === true : true);

  const req = {
    id: uid(), userId: state.currentUserId, amount, txnId: txn, ref,
    status: allGood ? 'approved' : 'a_verifier',
    date: new Date().toISOString(), ocrChecks: checks, receiptHash, proofUrl: proofPath
  };

  // Try to insert directly with the intended status. The database's unique
  // constraints (on txn_id/ref/receipt_hash where status='approved') are the
  // real atomicity guarantee here — even two devices submitting at the exact
  // same moment can't both land on 'approved' for the same txn/ref/receipt.
  let insertOk = false, wasDuplicate = false;
  try{
    const sb = await getSupabase();
    const { error } = await sb.from('recharge_requests').insert({
      id: req.id, user_id: req.userId, amount: req.amount, txn_id: req.txnId, ref: req.ref,
      status: req.status, ocr_checks: req.ocrChecks, receipt_hash: req.receiptHash, proof_url: proofPath
    });
    if(error){
      if(error.code === '23505'){ wasDuplicate = true; }
      else{ throw error; }
    } else {
      insertOk = true;
    }
  }catch(e){
    // Supabase unreachable — fall back to local-only bookkeeping so the app still works offline
    console.warn('recharge_requests insert failed:', e?.message || e?.error_description || e?.code || JSON.stringify(e) || e);
    insertOk = 'local';
  }

  if(wasDuplicate){
    // the DB rejected it as a duplicate — downgrade to a_verifier, never credit
    req.status = 'a_verifier';
    try{
      const sb = await getSupabase();
      await sb.from('recharge_requests').insert({
        id: uid(), user_id: req.userId, amount: req.amount, txn_id: req.txnId, ref: req.ref,
        status: 'a_verifier', ocr_checks: req.ocrChecks, receipt_hash: req.receiptHash, proof_url: proofPath
      });
    }catch(e){}
  }

  state.rechargeRequests.unshift(req);
  const finalApproved = req.status === 'approved' && !wasDuplicate;

  if(finalApproved){
    await applyWalletChange(state.currentUserId, amount, 'Rechaj NatCash', 'in', false, txn, proofPath, ref, true);
    state.usedTxnIds.push(txn);
    state.usedRefs.push(ref);
    if(receiptHash) state.usedReceiptHashes.push(receiptHash);
    resultBox.innerHTML = `<div class="card" style="border-color:var(--green);"><div style="color:var(--green);font-weight:700;">✅ Wallet kredite! Nouvo balans: ${money(walletBalance())}</div></div>`;
    const balDisplay = document.getElementById('walletBalanceDisplay');
    if(balDisplay) balDisplay.textContent = money(walletBalance());
    showToast('Wallet kredite ✓');
    sendWalletCreditedEmail(currentUser(), amount, txn);
    const u2 = currentUser();
    const clientName2 = (u2 && u2.profile) ? (u2.profile.prenom + ' ' + u2.profile.nom) : (u2 ? u2.name : 'Kliyan');
    let successMsg = 'Client : ' + clientName2;
    successMsg += '\nEmail : ' + (u2 && u2.email ? u2.email : '—');
    successMsg += '\nMontant : HTG ' + amount.toLocaleString('fr-FR');
    successMsg += '\nStatut : Vérifié automatiquement ✅ (pa bezwen aksyon)';
    sendNtfyNotification('Nouveau recharge', successMsg, 'default', 'moneybag');
    resetRechargeFlow();
    if(returnToCheckoutAfterRecharge){
      returnToCheckoutAfterRecharge = false;
      setTimeout(() => goPage('checkout'), 1200);
    }
  } else if(wasDuplicate){
    resultBox.innerHTML = `<div class="card" style="border-color:var(--red);"><div style="color:var(--red);font-weight:700;">TXN ID, referans, oswa resi sa a deja itilize pou yon lòt demand.</div></div>`;
    showToast('Deja itilize');
    if(btn){ btn.disabled = false; btn.textContent = 'Envoyer la demande'; }
  } else {
    resultBox.innerHTML = '';
    const area = document.getElementById('rcSubmitArea');
    if(area) area.innerHTML = `<div style="text-align:center;background:var(--amber-dim);color:var(--amber);font-weight:700;font-size:13px;padding:14px;border-radius:12px;">Le recharge est en cours de validation par l'admin</div>`;
    showToast('Admin ap verifye kòmand ou');
    const u = currentUser();
    const clientName = (u && u.profile) ? (u.profile.prenom + ' ' + u.profile.nom) : (u ? u.name : 'Kliyan');
    const clientPhone = (u && u.profile) ? (u.profile.whatsapp||'') : '';
    const clientEmail = u ? u.email : '';
    let ntfyDetail = '👤 Client : ' + clientName;
    if(clientPhone) ntfyDetail += '\n📱 Tel : ' + clientPhone;
    if(clientEmail) ntfyDetail += '\n📧 Email : ' + clientEmail;
    ntfyDetail += '\n💰 Montan : HTG ' + amount.toLocaleString('fr-FR');
    ntfyDetail += '\n🆔 TXN ID : ' + txn;
    if(ref) ntfyDetail += '\n🔖 Referans : ' + ref;
    if(checks){
      ntfyDetail += '\n📋 Tip resi : ' + (checks.receiptType==='sms'?'SMS':(checks.receiptType==='app'?'App NatCash':'Pa idantifye'));
      ntfyDetail += '\n' + (checks.txnOk?'✅':'❌') + ' TXN ID trouve';
      ntfyDetail += '\n' + (checks.amountOk?'✅':'❌') + ' Montan match';
      ntfyDetail += '\n' + (checks.numberOk?'✅':'❌') + ' Nimewo NatCash';
      ntfyDetail += '\n' + (checks.nameOk?'✅':'❌') + ' Non destinatè';
    }
    ntfyDetail += '\n⚠️ Verifikasyon otomatik echwe — al gade nan Admin.';
    let proofAttachUrl = null;
    if(proofPath){
      try{
        const sb = await getSupabase();
        const { data: signed } = await sb.storage.from('recharge-proofs').createSignedUrl(proofPath, 315360000);
        if(signed) proofAttachUrl = signed.signedUrl;
      }catch(e){ console.warn('signed url for ntfy failed:', e?.message||e); }
    }
    sendNtfyNotification('⏳ Demand Rechaj — À vérifier', ntfyDetail, 'urgent', 'rotating_light', proofAttachUrl);
  }

  await saveState();
  document.getElementById('rcAmount').value=''; document.getElementById('rcTxn').value='';
  renderMyRequests();
  renderTopIcons();
}

const SUSPENSION_REASONS_TEMP = [
  'Activité suspecte détectée',
  'Tentative de fraude détectée',
  'Manipulation du système détectée',
  'Vérification de sécurité en cours',

async function checkAutoReactivation(user){
  if(user.accountStatus === 'suspended_temp' && user.suspendedUntil){
    if(new Date() >= new Date(user.suspendedUntil)){
      await reactivateAccount(user.id, true);
    }
  }
}
function isAccountUsable(){
  const u = currentUser();
  return !u || u.accountStatus === 'active';
}
function blockIfSuspended(){
  const u = currentUser();
  if(!u) return false;
  if(u.accountStatus === 'suspended_temp' || u.accountStatus === 'suspended_permanent'){
    goPage('suspended');
    return true;
  }
  return false;
}
async function flagAndSuspendAccount(userId, reason, detail){
  try{
    const sb = await getSupabase();
    await sb.from('fraud_flags').insert({ user_id: userId, reason, detail });
  }catch(e){ console.warn('flagAndSuspendAccount log failed:', e?.message||e); }
  await suspendAccount(userId, 'temp', reason, 24);
}
async function suspendAccount(userId, kind, reason, hours){
  const u = state.users.find(x=>x.id===userId);
  const suspendedUntil = kind === 'temp' ? new Date(Date.now() + (hours||24)*60*60*1000).toISOString() : null;
  const status = kind === 'temp' ? 'suspended_temp' : 'suspended_permanent';
  const historyEntry = { date: new Date().toISOString(), action: kind==='temp'?'Suspension temporaire':'Suspension définitive', reason };
  const history = (u?.suspensionHistory || []).concat([historyEntry]);
  try{
    const sb = await getSupabase();
    await sb.from('profiles').update({ account_status: status, suspension_reason: reason, suspended_until: suspendedUntil, suspension_history: history }).eq('id', userId);
  }catch(e){ console.warn('suspendAccount failed:', e?.message||e); }
  if(u){ u.accountStatus = status; u.suspensionReason = reason; u.suspendedUntil = suspendedUntil; u.suspensionHistory = history; }
  if(userId === state.currentUserId && currentPage !== 'suspended') goPage('suspended');
}
async function reactivateAccount(userId, isAuto){
  const u = state.users.find(x=>x.id===userId);
  const historyEntry = { date: new Date().toISOString(), action: isAuto ? 'Réactivation automatique' : 'Réactivation par Admin', reason: '' };
  const history = (u?.suspensionHistory || []).concat([historyEntry]);
  try{
    const sb = await getSupabase();
    await sb.from('profiles').update({ account_status: 'active', suspension_reason: null, suspended_until: null, suspension_history: history }).eq('id', userId);
  }catch(e){ console.warn('reactivateAccount failed:', e?.message||e); }
  if(u){ u.accountStatus = 'active'; u.suspensionReason = ''; u.suspendedUntil = null; u.suspensionHistory = history; }
  if(!isAuto){ renderAdminTab(); showToast('Kont reyaktive ✓'); }
}
/* Règ #1: aksyon twò rapid (bot) — tcheke konbyen kòmand fèt nan 60 dènye segond yo */
function checkRapidActivity(userId){
  const orders = state.orders[userId] || [];
  const recentCount = orders.filter(o => (Date.now() - new Date(o.date).getTime()) < 60000).length;
  if(recentCount >= 5){
    flagAndSuspendAccount(userId, SUSPENSION_REASONS_TEMP[2], 'Plis pase 5 kòmand nan mwens pase 60 segond');
    return true;
  }
  return false;
}

let failedRechargeAttempts = {};
function trackFailedRechargeAttempt(userId){
  failedRechargeAttempts[userId] = (failedRechargeAttempts[userId] || 0) + 1;
  if(failedRechargeAttempts[userId] >= 4){
    flagAndSuspendAccount(userId, SUSPENSION_REASONS_TEMP[1], 'Plizyè tantativ peman envalid youn apre lòt');

}

    }

}
async function submitTransfer(){
  if(blockIfSuspended()) return;
  const email = document.getElementById('trEmail').value.trim().toLowerCase();
  const amount = parseFloat(document.getElementById('trAmount').value);
  if(!email || !amount || amount<=0){ showToast('Ranpli tout chan yo kòrèkteman'); return; }
  if(checkWalletManipulation(state.currentUserId, amount)) return;
  if(walletBalance() < amount){ showToast(t('toast_insufficient_balance')); return; }
  const transferableAmount = walletBalance() - (state.walletBonus?.[state.currentUserId] || 0);
  if(amount > transferableAmount){ showToast('Vous ne pouvez pas transférer les bonus, seulement l\'argent que vous avez déposé', 4000); return; }
  const senderName = currentUser().name;
  try{
    const sb = await getSupabase();
    const { data: recipientId, error: lookupErr } = await sb.rpc('find_user_id_by_email', { p_email: email });
    if(lookupErr) throw lookupErr;
    if(!recipientId){ showToast('Pa gen itilizatè ak imèl sa a'); return; }
    if(recipientId === state.currentUserId){ showToast(t('toast_cannot_transfer')); return; }
    const targetLocal = state.users.find(u=>u.id===recipientId);
    const recipientName = targetLocal ? targetLocal.name : email.split('@')[0];
    const { error: transferErr } = await sb.rpc('transfer_wallet', {
      recipient_id: recipientId, amount,
      sender_label: 'Transfè bay '+recipientName,
      recipient_label: 'Transfè resevwa nan men '+senderName
    });
    if(transferErr){ showToast('Erè: ' + transferErr.message); return; }
    await fetchWalletFromServer(state.currentUserId);
    render();
    showToast(t('toast_transfer_success'));
    setTimeout(() => sendTransferEmails(currentUser(), { name: recipientName, email: email }, amount), 2600);
  }catch(e){
    showToast('Pa ka konekte ak sèvè a — eseye ankò');
  }
}

function addPinToCart(productId){
  const p = state.products.find(x=>x.id===productId);
  const v = p.variants.find(x=>x.id===selectedVariantId);
  if(!v){ showToast('Chwazi yon opsyon'); return; }
  const existing = state.cart.find(i => i.type==='pin' && i.variantId===v.id);
  if(existing){
    existing.qty += 1;
    existing.price = existing.unitPrice * existing.qty;
  } else {
    state.cart.push({ id:uid(), productId:p.id, productName:p.name, type:'pin', variantId:v.id, variantLabel:v.label, unitPrice:v.price, qty:1, price:v.price, fields:null });
  }

function addFormToCart(productId){
  const p = state.products.find(x=>x.id===productId);
  const v = p.variants.find(x=>x.id===selectedVariantId);
  if(!v){ showToast('Chwazi yon opsyon'); return; }
  const fields = p.formFields || [];
  const collected = {};
  for(let i=0;i<fields.length;i++){
    const val = (document.getElementById('formField-'+i)?.value || '').trim();

  }

}
